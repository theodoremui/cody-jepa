[project]
name = "cody-jepa"
version = "0.1.0"
description = "Research code for CoDy-JEPA and Grounded Factorial Completion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "scikit-learn>=1.5",
    "scipy>=1.15",
    "torch==2.6.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "torch==2.6.0+cu124 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tqdm>=4.68.4",
    "triton==3.2.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[project.scripts]
cody-jepa-train = "cody_jepa.cli.train:main"
cody-jepa-export-features = "cody_jepa.cli.export_features:main"
cody-jepa-eval-probes = "cody_jepa.cli.eval_probes:main"
cody-jepa-run-gfc = "cody_jepa.cli.run_gfc:main"
cody-jepa-build-manifest = "cody_jepa.cli.build_manifest:main"
cody-jepa-prepare-gfc-features = "cody_jepa.cli.prepare_gfc_features:main"
cody-jepa-make-results = "cody_jepa.cli.make_results:main"
cody-jepa-export-histories = "cody_jepa.cli.export_histories:main"
cody-jepa-gfc-study = "cody_jepa.cli.gfc_study:main"
cody-jepa-make-gfc-study-results = "cody_jepa.cli.make_gfc_study_results:main"
cody-jepa-prepare-gaitlu = "cody_jepa.cli.prepare_gaitlu:main"
cody-jepa-audit-gaitlu-hierarchy = "cody_jepa.cli.audit_gaitlu_hierarchy:main"
cody-jepa-prepare-gaitlu-hierarchy = "cody_jepa.cli.prepare_gaitlu_hierarchy:main"
cody-jepa-train-gaitlu-study = "cody_jepa.cli.train_gaitlu_study:main"
cody-jepa-train-gaitlu-hierarchy = "cody_jepa.cli.train_gaitlu_hierarchy:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "ruff>=0.12",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["F401", "F403"]
"src/cody_jepa/data/dataset.py" = ["F401"]
"src/cody_jepa/gfc*.py" = ["F401", "F403"]
"src/cody_jepa/probes.py" = ["F401"]
"src/cody_jepa/single_stream_jepa.py" = ["F401"]
"tests/*.py" = ["E402"]
