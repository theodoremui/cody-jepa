<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">From one Health and Gait source walk to recording vectors</title>
  <desc id="desc">A participant performs one back-and-forth walk for a speed and clothing condition. It produces right-to-left and left-to-right direction clips that share one source video identifier. Each clip supplies three deterministic windows, which are averaged into one recording vector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56657a"/></marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .heading { font: 700 18px system-ui, sans-serif; fill: #172033; }
      .body { font: 400 16px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #526075; }
      .person { fill: #f4f6f9; stroke: #8795a8; stroke-width: 2; }
      .source { fill: #fff4e8; stroke: #c98248; stroke-width: 2; }
      .clip { fill: #eaf2ff; stroke: #648db8; stroke-width: 2; }
      .vector { fill: #eaf7ef; stroke: #4f8d68; stroke-width: 2; }
      .arrow { fill: none; stroke: #56657a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">A direction clip is not an independent session</text>
  <text x="700" y="80" text-anchor="middle" class="body">The shared source identifier is what prevents a donor from reusing the target's physical walk.</text>

  <g transform="translate(55 240)">
    <rect width="210" height="120" rx="15" class="person"/>
    <text x="105" y="42" text-anchor="middle" class="heading">Participant PA000</text>
    <text x="105" y="76" text-anchor="middle" class="body">fast · jacket</text>
    <text x="105" y="101" text-anchor="middle" class="small">one condition</text>
  </g>
  <path d="M265 300 H345" class="arrow"/>
  <g transform="translate(345 215)">
    <rect width="285" height="170" rx="15" class="source"/>
    <text x="142.5" y="40" text-anchor="middle" class="heading">Back-and-forth source walk</text>
    <text x="142.5" y="78" text-anchor="middle" class="body">source_video_id = S1042</text>
    <text x="142.5" y="112" text-anchor="middle" class="small">same lighting, framing, duration,</text>
    <text x="142.5" y="136" text-anchor="middle" class="small">and segmentation conditions</text>
  </g>

  <path d="M630 270 C680 270 680 175 735 175" class="arrow"/>
  <path d="M630 330 C680 330 680 455 735 455" class="arrow"/>

  <g transform="translate(735 110)">
    <rect width="245" height="130" rx="14" class="clip"/>
    <text x="122.5" y="38" text-anchor="middle" class="heading">R2L direction clip</text>
    <text x="122.5" y="72" text-anchor="middle" class="body">recording R1042-1</text>
    <text x="122.5" y="102" text-anchor="middle" class="small">shares source S1042</text>
  </g>
  <g transform="translate(735 390)">
    <rect width="245" height="130" rx="14" class="clip"/>
    <text x="122.5" y="38" text-anchor="middle" class="heading">L2R direction clip</text>
    <text x="122.5" y="72" text-anchor="middle" class="body">recording R1042-2</text>
    <text x="122.5" y="102" text-anchor="middle" class="small">shares source S1042</text>
  </g>

  <path d="M980 175 H1050" class="arrow"/><path d="M980 455 H1050" class="arrow"/>

  <g transform="translate(1050 95)">
    <rect width="295" height="160" rx="14" class="vector"/>
    <text x="147.5" y="38" text-anchor="middle" class="heading">R2L recording vector</text>
    <text x="147.5" y="78" text-anchor="middle" class="body">3 deterministic windows</text>
    <text x="147.5" y="108" text-anchor="middle" class="body">→ average in float64</text>
    <text x="147.5" y="137" text-anchor="middle" class="small">one gallery item</text>
  </g>
  <g transform="translate(1050 375)">
    <rect width="295" height="160" rx="14" class="vector"/>
    <text x="147.5" y="38" text-anchor="middle" class="heading">L2R recording vector</text>
    <text x="147.5" y="78" text-anchor="middle" class="body">3 deterministic windows</text>
    <text x="147.5" y="108" text-anchor="middle" class="body">→ average in float64</text>
    <text x="147.5" y="137" text-anchor="middle" class="small">one gallery item</text>
  </g>

  <text x="700" y="610" text-anchor="middle" class="small">The two vectors are distinct recordings, but GFC-v2 never treats them as independent physical walks.</text>
</svg>
