<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Five data roles in the revised study</title>
  <desc id="desc">GaitLU pretraining sequences train encoders, a separate GaitLU holdout measures context reliance, Health and Gait development participants fit evaluation heads, locked Health and Gait outcome participants provide final scores, and constructed cases validate code.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56657a"/></marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .heading { font: 700 18px system-ui, sans-serif; fill: #172033; }
      .body { font: 400 16px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #526075; }
      .source { fill: #eaf2ff; stroke: #648db8; stroke-width: 2; }
      .dev { fill: #f4f6f9; stroke: #8795a8; stroke-width: 2; }
      .outcome { fill: #eaf7ef; stroke: #4f8d68; stroke-width: 2; }
      .test { fill: #fff4e8; stroke: #c98248; stroke-width: 2; }
      .arrow { fill: none; stroke: #56657a; stroke-width: 3; marker-end: url(#arrow); }
      .barrier { stroke: #a34f4f; stroke-width: 3; stroke-dasharray: 9 7; }
    </style>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">Each data group has one job</text>
  <text x="700" y="80" text-anchor="middle" class="body">Keeping these jobs separate prevents training, fitting, and final evaluation from leaking into one another.</text>

  <text x="75" y="130" class="heading">Data group</text>
  <text x="520" y="130" class="heading">Allowed use</text>
  <text x="1010" y="130" class="heading">Forbidden use</text>

  <g transform="translate(65 160)">
    <rect width="350" height="90" rx="13" class="source"/>
    <text x="175" y="34" text-anchor="middle" class="heading">GaitLU pretraining pools</text>
    <text x="175" y="62" text-anchor="middle" class="small">four nested unique-data sizes</text>
    <path d="M370 45 H430" class="arrow"/>
    <text x="480" y="36" class="body">Update encoder weights</text>
    <text x="480" y="65" class="small">20 fixed-exposure training runs</text>
    <text x="965" y="50" class="body">No identity inference or factor labels</text>
  </g>

  <g transform="translate(65 265)">
    <rect width="350" height="90" rx="13" class="source"/>
    <text x="175" y="34" text-anchor="middle" class="heading">GaitLU common holdout</text>
    <text x="175" y="62" text-anchor="middle" class="small">10,000 group-disjoint sequences</text>
    <path d="M370 45 H430" class="arrow"/>
    <text x="480" y="36" class="body">Context and training-health checks</text>
    <text x="480" y="65" class="small">same sequences for every rung</text>
    <text x="965" y="50" class="body">No encoder updates</text>
  </g>

  <g transform="translate(65 370)">
    <rect width="350" height="90" rx="13" class="dev"/>
    <text x="175" y="34" text-anchor="middle" class="heading">Health&amp;Gait development</text>
    <text x="175" y="62" text-anchor="middle" class="small">80 total · 76 complete</text>
    <path d="M370 45 H430" class="arrow"/>
    <text x="480" y="36" class="body">Fit heads, normalizers, temperature</text>
    <text x="480" y="65" class="small">validate evaluator invariants</text>
    <text x="965" y="50" class="body">No headline scaling result</text>
  </g>

  <g transform="translate(65 475)">
    <rect width="350" height="90" rx="13" class="outcome"/>
    <text x="175" y="34" text-anchor="middle" class="heading">Health&amp;Gait outcome</text>
    <text x="175" y="62" text-anchor="middle" class="small">318 total · 308 complete</text>
    <path d="M370 45 H430" class="arrow"/>
    <text x="480" y="36" class="body">Score frozen models after the freeze</text>
    <text x="480" y="65" class="small">GFC-v2, probes, identity</text>
    <text x="965" y="50" class="body">No fitting or model selection</text>
  </g>

  <g transform="translate(65 580)">
    <rect width="350" height="90" rx="13" class="test"/>
    <text x="175" y="34" text-anchor="middle" class="heading">Constructed feature cases</text>
    <text x="175" y="62" text-anchor="middle" class="small">known positive and negative cases</text>
    <path d="M370 45 H430" class="arrow"/>
    <text x="480" y="36" class="body">Test equations and code paths</text>
    <text x="480" y="65" class="small">oracles, ties, leakage, nuisance cues</text>
    <text x="965" y="50" class="body">No human-population claim</text>
  </g>

  <line x1="930" y1="145" x2="930" y2="685" class="barrier"/>
</svg>
