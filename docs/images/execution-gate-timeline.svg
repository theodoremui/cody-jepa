<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">Gate sequence and calendar for the 28-model study</title>
  <desc id="fig-desc">Seven gates sit on a rail in order: phase audit on August 13, catalog audit on August 14, metric and power audit on August 15, software dry run on August 17, systems pilot on August 18, training completion on August 29, and analysis lock on September 4. Three bars underneath show the work periods: training waves from August 18 to August 29, locked analysis from August 30 to September 4, and paper writing only from September 5 to September 25.</desc>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <text x="480" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">Gates first, then training, then a hard freeze</text>
  <text x="70" y="112" font-size="17" font-weight="700" fill="#52606d">Gates, in order</text>

  <line x1="70" y1="180" x2="900" y2="180" stroke="#52606d" stroke-width="3"/>

  <text x="85" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Aug 13</text>
  <circle cx="85" cy="180" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="85" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Phase</text>
  <text x="85" y="238" text-anchor="middle" font-size="15" fill="#172b4d">audit</text>

  <text x="219" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Aug 14</text>
  <circle cx="219" cy="180" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="219" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Catalog</text>
  <text x="219" y="238" text-anchor="middle" font-size="15" fill="#172b4d">audit</text>

  <text x="353" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Aug 15</text>
  <circle cx="353" cy="180" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="353" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Metric and</text>
  <text x="353" y="238" text-anchor="middle" font-size="15" fill="#172b4d">power</text>

  <text x="487" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Aug 17</text>
  <circle cx="487" cy="180" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="487" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Software</text>
  <text x="487" y="238" text-anchor="middle" font-size="15" fill="#172b4d">dry run</text>

  <text x="621" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Aug 18</text>
  <circle cx="621" cy="180" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="621" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Systems</text>
  <text x="621" y="238" text-anchor="middle" font-size="15" fill="#172b4d">pilot</text>

  <text x="755" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Aug 29</text>
  <circle cx="755" cy="180" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="755" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Training</text>
  <text x="755" y="238" text-anchor="middle" font-size="15" fill="#172b4d">complete</text>

  <text x="889" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#172b4d">Sep 4</text>
  <circle cx="889" cy="180" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="889" y="216" text-anchor="middle" font-size="15" fill="#172b4d">Analysis</text>
  <text x="889" y="238" text-anchor="middle" font-size="15" fill="#172b4d">lock</text>

  <rect x="70" y="300" width="310" height="76" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="225" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">Training waves</text>
  <text x="225" y="359" text-anchor="middle" font-size="16" fill="#52606d">Aug 18 to Aug 29</text>

  <rect x="405" y="300" width="195" height="76" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="502" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">Locked analysis</text>
  <text x="502" y="359" text-anchor="middle" font-size="16" fill="#52606d">Aug 30 to Sep 4</text>

  <rect x="625" y="300" width="275" height="76" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="762" y="333" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">Paper writing only</text>
  <text x="762" y="359" text-anchor="middle" font-size="16" fill="#52606d">Sep 5 to Sep 25</text>

  <text x="480" y="412" text-anchor="middle" font-size="15" fill="#52606d">Experiments and analysis freeze on September 4, 2026.</text>
  <text x="480" y="436" text-anchor="middle" font-size="15" fill="#52606d">The writing buffer starts only after locked aggregate analysis.</text>
</svg>
