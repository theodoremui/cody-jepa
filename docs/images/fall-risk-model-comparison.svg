<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Four-model comparison for Sequoias fall-risk assessment</title>
  <desc id="desc">The same Sequoias cohort is evaluated with four models: conventional gait and balance measures, OpenCap and OpenSim biomechanics, a frozen JEPA video representation, and a combined biomechanics plus JEPA model. All use the same participant-level splits, label budget, prediction target, and metrics.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A43"/>
      <stop offset="1" stop-color="#164E63"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1 L10 5.5 L1 10 Z" fill="#64748B"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 40px; font-weight: 700; font-style: normal; fill: #FFFFFF; letter-spacing: -0.6px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 400; font-style: normal; fill: #D7EEF5; }
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; font-style: normal; fill: #0E7490; letter-spacing: 1.3px; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 21px; font-weight: 700; font-style: normal; fill: #172033; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 400; font-style: normal; fill: #42526A; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 500; font-style: normal; fill: #526075; }
      .number { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; font-style: normal; fill: #FFFFFF; }
      .result { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 19px; font-weight: 700; font-style: normal; fill: #FFFFFF; }
      .resultBody { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 400; font-style: normal; fill: #D7EEF5; }
      .flow { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#F5F8FB"/>
  <rect width="1600" height="170" fill="url(#top)"/>
  <circle cx="1455" cy="15" r="170" fill="#22D3EE" opacity="0.09"/>
  <text x="80" y="68" class="title">A fair four-model test for Sequoias fall-risk assessment</text>
  <text x="80" y="108" class="subtitle">The same cohort and evaluation protocol isolate what each representation adds</text>
  <text x="80" y="140" class="subtitle">Follow-up experiment after gait JEPA pretraining</text>

  <!-- Shared input -->
  <g filter="url(#shadow)">
    <rect x="80" y="215" width="1440" height="106" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  </g>
  <text x="115" y="252" class="eyebrow">SHARED INPUT</text>
  <text x="115" y="286" class="heading">Sequoias older-adult recordings + prospectively defined fall-risk target</text>
  <g transform="translate(1020 239)">
    <rect width="145" height="48" rx="11" fill="#E0F2FE"/><text x="72.5" y="29" text-anchor="middle" class="small">same label budget</text>
    <rect x="160" width="145" height="48" rx="11" fill="#ECFEFF"/><text x="232.5" y="29" text-anchor="middle" class="small">same splits</text>
    <rect x="320" width="145" height="48" rx="11" fill="#F0FDF4"/><text x="392.5" y="29" text-anchor="middle" class="small">same metrics</text>
  </g>

  <path d="M800 321 V364" class="flow"/>
  <path d="M260 364 H1340" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M260 364 V397" class="flow"/>
  <path d="M620 364 V397" class="flow"/>
  <path d="M980 364 V397" class="flow"/>
  <path d="M1340 364 V397" class="flow"/>

  <!-- Four arms -->
  <g filter="url(#shadow)">
    <rect x="90" y="405" width="340" height="306" rx="22" fill="#FFFFFF" stroke="#9AA8BA" stroke-width="1.7"/>
    <rect x="450" y="405" width="340" height="306" rx="22" fill="#EFF6FF" stroke="#7BA7D8" stroke-width="1.7"/>
    <rect x="810" y="405" width="340" height="306" rx="22" fill="#ECFEFF" stroke="#58AFC2" stroke-width="1.7"/>
    <rect x="1170" y="405" width="340" height="306" rx="22" fill="#F0FDF4" stroke="#63A879" stroke-width="1.7"/>
  </g>

  <circle cx="132" cy="440" r="22" fill="#64748B"/><text x="132" y="445" text-anchor="middle" class="number">1</text>
  <text x="196" y="436" class="eyebrow" fill="#526075">CONVENTIONAL</text>
  <text x="125" y="493" class="heading">Gait &amp; balance measures</text>
  <line x1="125" y1="514" x2="395" y2="514" stroke="#D7DEE8"/>
  <text x="125" y="550" class="body">Hand-selected clinical measures</text>
  <text x="125" y="578" class="body">such as gait speed, cadence, or</text>
  <text x="125" y="606" class="body">balance-test summaries.</text>
  <rect x="125" y="641" width="270" height="43" rx="10" fill="#F1F5F9"/>
  <text x="260" y="667" text-anchor="middle" class="small">interpretable reference baseline</text>

  <circle cx="492" cy="440" r="22" fill="#2563A9"/><text x="492" y="445" text-anchor="middle" class="number">2</text>
  <text x="556" y="436" class="eyebrow" fill="#2563A9">BIOMECHANICS</text>
  <text x="485" y="493" class="heading">OpenCap + OpenSim outputs</text>
  <line x1="485" y1="514" x2="755" y2="514" stroke="#C6D9EC"/>
  <text x="485" y="550" class="body">Estimated kinematics and dynamics:</text>
  <text x="485" y="578" class="body">joint angles, motion trajectories,</text>
  <text x="485" y="606" class="body">and related biomechanical variables.</text>
  <rect x="485" y="641" width="270" height="43" rx="10" fill="#DDEBFA"/>
  <text x="620" y="667" text-anchor="middle" class="small">mechanistically grounded features</text>

  <circle cx="852" cy="440" r="22" fill="#0E7490"/><text x="852" y="445" text-anchor="middle" class="number">3</text>
  <text x="916" y="436" class="eyebrow">LEARNED VIDEO FEATURES</text>
  <text x="845" y="493" class="heading">Frozen JEPA representation</text>
  <line x1="845" y1="514" x2="1115" y2="514" stroke="#BEE1E7"/>
  <text x="845" y="550" class="body">A general movement embedding</text>
  <text x="845" y="578" class="body">learned from large unlabeled gait</text>
  <text x="845" y="606" class="body">video before seeing Sequoias labels.</text>
  <rect x="845" y="641" width="270" height="43" rx="10" fill="#D8F1F5"/>
  <text x="980" y="667" text-anchor="middle" class="small">may capture unlabeled patterns</text>

  <circle cx="1212" cy="440" r="22" fill="#2F7D4A"/><text x="1212" y="445" text-anchor="middle" class="number">4</text>
  <text x="1276" y="436" class="eyebrow" fill="#2F7D4A">COMBINED</text>
  <text x="1205" y="493" class="heading">Biomechanics + JEPA</text>
  <line x1="1205" y1="514" x2="1475" y2="514" stroke="#B9DEC4"/>
  <text x="1205" y="550" class="body">Fuse interpretable biomechanical</text>
  <text x="1205" y="578" class="body">variables with complementary</text>
  <text x="1205" y="606" class="body">learned video features.</text>
  <rect x="1205" y="641" width="270" height="43" rx="10" fill="#DDF4E4"/>
  <text x="1340" y="667" text-anchor="middle" class="small">test added value</text>

  <!-- Common output -->
  <path d="M260 711 V755" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M620 711 V755" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M980 711 V755" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M1340 711 V755" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M260 755 H1340" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M800 755 V792" class="flow"/>

  <rect x="230" y="800" width="1140" height="103" rx="20" fill="url(#top)"/>
  <text x="270" y="840" class="result">Compare fall-risk prediction, calibration, robustness, and label efficiency</text>
  <text x="270" y="873" class="resultBody">The central question is whether the JEPA representation adds information beyond conventional and biomechanical measurements.</text>
</svg>
