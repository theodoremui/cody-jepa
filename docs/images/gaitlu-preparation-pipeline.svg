<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">GaitLU preparation, from private raw release to study-ready inputs</title>
 <desc id="fig-desc">Six ordered steps: hold the raw release of one hundred private shards on HAIC behind a pinned commit, verify the shard count, convert each shard into seekable bit-packed records, audit every nonzero exclusion class, freeze the prepared inventory, then run the active study readiness checks.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="960" height="610" fill="#fbfaf7"/>
  <text x="480" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">The shared path from raw shards to study-ready inputs</text>

  <rect x="50" y="84" width="860" height="56" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="80" y="119" font-size="17" font-weight="700" fill="#172b4d">1. Raw release</text>
  <line x1="330" y1="98" x2="330" y2="126" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="119" font-size="16" fill="#172b4d">100 private gzip tar shards on HAIC, behind a pinned commit.</text>
  <path d="M480 144 V162" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="50" y="168" width="860" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="80" y="203" font-size="17" font-weight="700" fill="#172b4d">2. Verify</text>
  <line x1="330" y1="182" x2="330" y2="210" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="203" font-size="16" fill="#172b4d">Confirm exactly 100 shards before any conversion runs.</text>
  <path d="M480 228 V246" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="50" y="252" width="860" height="56" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="80" y="287" font-size="17" font-weight="700" fill="#172b4d">3. Convert</text>
  <line x1="330" y1="266" x2="330" y2="294" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="287" font-size="16" fill="#172b4d">Validate sequences, bit-pack frames, write a seekable tar.</text>
  <path d="M480 312 V330" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="50" y="336" width="860" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="80" y="371" font-size="17" font-weight="700" fill="#172b4d">4. Audit</text>
  <line x1="330" y1="350" x2="330" y2="378" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="371" font-size="16" fill="#172b4d">Inspect every nonzero exclusion class and keep its reason.</text>
  <path d="M480 396 V414" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="50" y="420" width="860" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="80" y="455" font-size="17" font-weight="700" fill="#172b4d">5. Freeze</text>
  <line x1="330" y1="434" x2="330" y2="462" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="455" font-size="16" fill="#172b4d">Manifest schema, source-group policy, summaries, digests.</text>

  <path d="M480 480 V498" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="50" y="504" width="860" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="80" y="539" font-size="17" font-weight="700" fill="#172b4d">6. Study readiness</text>
  <line x1="330" y1="518" x2="330" y2="546" stroke="#64748b" stroke-width="1.5"/>
  <text x="358" y="539" font-size="16" fill="#172b4d">Audit hierarchy support, finalize the registry, smoke test, then launch.</text>
  <text x="480" y="590" text-anchor="middle" font-size="15" fill="#52606d">Training starts only after the active study gates pass.</text>
</svg>
