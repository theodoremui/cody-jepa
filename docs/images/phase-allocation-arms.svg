<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">Three iso-catalog allocation arms</title>
  <desc id="fig-desc">Three arms place the same nominal catalog of 250,000 sequence-origin atoms in different places. Breadth uses 250,000 sequences with one phase origin each. Balanced uses 125,000 sequences with two origins each. Phase depth uses 62,500 sequences with four origins each. All three multiply out to the same nominal catalog size of 250,000.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="960" height="530" fill="#fbfaf7"/>
  <text x="480" y="48" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">Same catalog size, three places to put the diversity</text>

  <g transform="translate(50 90)">
    <rect width="270" height="250" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="135" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Breadth</text>
    <text x="135" y="68" text-anchor="middle" font-size="16" fill="#172b4d">250,000 sequences</text>
    <text x="135" y="94" text-anchor="middle" font-size="16" fill="#52606d">1 origin each</text>
    <rect x="35" y="125" width="200" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="65" cy="136" r="8" fill="#2563eb" stroke="#172b4d" stroke-width="1.5"/>
    <rect x="35" y="159" width="200" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="65" cy="170" r="8" fill="#2563eb" stroke="#172b4d" stroke-width="1.5"/>
    <rect x="35" y="193" width="200" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="65" cy="204" r="8" fill="#2563eb" stroke="#172b4d" stroke-width="1.5"/>
  </g>

  <g transform="translate(345 90)">
    <rect width="270" height="250" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="135" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Balanced</text>
    <text x="135" y="68" text-anchor="middle" font-size="16" fill="#172b4d">125,000 sequences</text>
    <text x="135" y="94" text-anchor="middle" font-size="16" fill="#52606d">2 origins each</text>
    <rect x="35" y="125" width="200" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="65" cy="136" r="8" fill="#7c3aed" stroke="#172b4d" stroke-width="1.5"/>
    <circle cx="165" cy="136" r="8" fill="#7c3aed" stroke="#172b4d" stroke-width="1.5"/>
    <rect x="35" y="159" width="200" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="65" cy="170" r="8" fill="#7c3aed" stroke="#172b4d" stroke-width="1.5"/>
    <circle cx="165" cy="170" r="8" fill="#7c3aed" stroke="#172b4d" stroke-width="1.5"/>
  </g>

  <g transform="translate(640 90)">
    <rect width="270" height="250" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="135" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Phase depth</text>
    <text x="135" y="68" text-anchor="middle" font-size="16" fill="#172b4d">62,500 sequences</text>
    <text x="135" y="94" text-anchor="middle" font-size="16" fill="#52606d">4 origins each</text>
    <rect x="35" y="125" width="200" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="65" cy="136" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
    <circle cx="115" cy="136" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
    <circle cx="165" cy="136" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
    <circle cx="215" cy="136" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
  </g>

  <path d="M185 345 V391" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M480 345 V391" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M775 345 V391" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="50" y="398" width="860" height="80" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="480" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Every arm reaches the same nominal catalog</text>
  <text x="480" y="459" text-anchor="middle" font-size="16" fill="#172b4d">U times k = 250,000 sequence-origin atoms</text>

  <text x="480" y="507" text-anchor="middle" font-size="15" fill="#52606d">Each bar is one gait cycle. Each dot is one chosen phase origin. Bar counts are schematic.</text>
</svg>
