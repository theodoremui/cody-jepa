<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">Nested phase origins compared with nearby jitter</title>
  <desc id="fig-desc">One gait cycle is drawn as a horizontal bar. The nested semantic origin sets add points around the cycle: k equals one is the base phase alone, k equals two adds the antipodal phase half a cycle away, and k equals four adds the two quarter-cycle phases. The nearby-jitter diagnostic also uses four origins, but all four sit in a tight cluster around the same base phase.</desc>
  <rect width="960" height="520" fill="#fbfaf7"/>
  <text x="480" y="48" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">What the jitter diagnostic controls for</text>

  <rect x="50" y="82" width="860" height="230" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="80" y="116" font-size="18" font-weight="700" fill="#172b4d">Nested semantic origins: spread around the cycle</text>

  <text x="82" y="152" font-size="16" fill="#172b4d">k = 1</text>
  <rect x="170" y="130" width="700" height="24" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="275" cy="142" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>

  <text x="82" y="199" font-size="16" fill="#172b4d">k = 2</text>
  <rect x="170" y="177" width="700" height="24" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="275" cy="189" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="625" cy="189" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>

  <text x="82" y="246" font-size="16" fill="#172b4d">k = 4</text>
  <rect x="170" y="224" width="700" height="24" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="275" cy="236" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="450" cy="236" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="625" cy="236" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="800" cy="236" r="8" fill="#16a34a" stroke="#172b4d" stroke-width="1.5"/>

  <text x="275" y="284" text-anchor="middle" font-size="15" fill="#52606d">b</text>
  <text x="450" y="284" text-anchor="middle" font-size="15" fill="#52606d">b + 1/4</text>
  <text x="625" y="284" text-anchor="middle" font-size="15" fill="#52606d">b + 1/2</text>
  <text x="800" y="284" text-anchor="middle" font-size="15" fill="#52606d">b + 3/4</text>

  <rect x="50" y="340" width="860" height="128" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="80" y="374" font-size="18" font-weight="700" fill="#172b4d">Nearby jitter: also four origins, all clustered at b</text>
  <text x="82" y="428" font-size="16" fill="#172b4d">k = 4</text>
  <rect x="170" y="406" width="700" height="24" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="248" cy="418" r="8" fill="#d97706" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="266" cy="418" r="8" fill="#d97706" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="284" cy="418" r="8" fill="#d97706" stroke="#172b4d" stroke-width="1.5"/>
  <circle cx="302" cy="418" r="8" fill="#d97706" stroke="#172b4d" stroke-width="1.5"/>

  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#52606d">Each bar is one gait cycle. b is the hashed base phase for that sequence and replicate block.</text>
</svg>
