  <rect x="557" y="112" width="76" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="645" y="112" width="76" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="733" y="112" width="76" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
