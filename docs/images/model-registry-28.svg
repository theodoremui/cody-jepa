  <rect x="293" y="112" width="76" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="381" y="112" width="76" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
