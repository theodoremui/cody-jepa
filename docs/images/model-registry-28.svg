  <rect x="293" y="304" width="76" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="381" y="304" width="76" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
