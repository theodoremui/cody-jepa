<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">The 28-model registry as eight paired blocks</title>
  <desc id="fig-desc">A grid with eight columns, one per paired replicate block, and four rows, one per allocation. The breadth, balanced, and phase-depth rows are filled in all eight blocks, giving 24 primary models. The nearby-jitter row is filled in only four prespecified blocks and left empty in the other four, adding 4 diagnostic models for a total of 28.</desc>
  <rect width="960" height="450" fill="#fbfaf7"/>
  <text x="480" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">28 trained models: eight paired blocks, four allocations</text>

  <text x="188" y="92" text-anchor="end" font-size="15" font-weight="700" fill="#52606d">Block</text>
  <text x="243" y="92" text-anchor="middle" font-size="15" fill="#52606d">1</text>
  <text x="331" y="92" text-anchor="middle" font-size="15" fill="#52606d">2</text>
  <text x="419" y="92" text-anchor="middle" font-size="15" fill="#52606d">3</text>
  <text x="507" y="92" text-anchor="middle" font-size="15" fill="#52606d">4</text>
  <text x="595" y="92" text-anchor="middle" font-size="15" fill="#52606d">5</text>
  <text x="683" y="92" text-anchor="middle" font-size="15" fill="#52606d">6</text>
  <text x="771" y="92" text-anchor="middle" font-size="15" fill="#52606d">7</text>
  <text x="859" y="92" text-anchor="middle" font-size="15" fill="#52606d">8</text>

  <text x="188" y="140" text-anchor="end" font-size="16" fill="#172b4d">breadth</text>
