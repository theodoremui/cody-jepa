  <text x="480" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">8 x 3 primary + 4 diagnostic = 28 models</text>
  <text x="480" y="422" text-anchor="middle" font-size="15" fill="#52606d">Each column is one paired block. Dashed cells are blocks that do not run the jitter diagnostic.</text>
</svg>
