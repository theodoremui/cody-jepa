<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Normalized context-reliance intervention</title>
  <desc id="desc">The same masked target is predicted twice. One pass uses its true visible context and the other uses a geometry-matched context from another sequence. Target features, positions, and masks remain fixed. The excess loss is divided by true-context loss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56657a"/></marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .heading { font: 700 19px system-ui, sans-serif; fill: #172033; }
      .body { font: 400 16px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #526075; }
      .true { fill: #eaf7ef; stroke: #4f8d68; stroke-width: 2; }
      .swap { fill: #fff4e8; stroke: #c98248; stroke-width: 2; }
      .fixed { fill: #eaf2ff; stroke: #648db8; stroke-width: 2; }
      .card { fill: #f8fafc; stroke: #9aa8ba; stroke-width: 2; }
      .arrow { fill: none; stroke: #56657a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">Change only the visible context and watch prediction loss</text>
  <text x="700" y="80" text-anchor="middle" class="body">A paired comparison isolates whether the predictor uses details beyond coarse sequence geometry.</text>

  <g transform="translate(55 145)">
    <rect width="310" height="180" rx="16" class="true"/>
    <text x="155" y="38" text-anchor="middle" class="heading">Pass A: true context</text>
    <text x="155" y="78" text-anchor="middle" class="body">Visible frames from</text>
    <text x="155" y="104" text-anchor="middle" class="body">the target sequence</text>
    <text x="155" y="143" text-anchor="middle" class="small">produces loss L_true</text>
  </g>

  <g transform="translate(55 380)">
    <rect width="310" height="180" rx="16" class="swap"/>
    <text x="155" y="38" text-anchor="middle" class="heading">Pass B: near substitute</text>
    <text x="155" y="78" text-anchor="middle" class="body">Visible frames from a</text>
    <text x="155" y="104" text-anchor="middle" class="body">geometry-matched sequence</text>
    <text x="155" y="143" text-anchor="middle" class="small">produces loss L_near-substitute</text>
  </g>

  <path d="M365 235 H470" class="arrow"/><path d="M365 470 H470" class="arrow"/>

  <g transform="translate(470 220)">
    <rect width="380" height="265" rx="16" class="fixed"/>
    <text x="190" y="40" text-anchor="middle" class="heading">Everything else stays fixed</text>
    <text x="190" y="84" text-anchor="middle" class="body">masked target features</text>
    <text x="190" y="116" text-anchor="middle" class="body">target positions</text>
    <text x="190" y="148" text-anchor="middle" class="body">mask pattern</text>
    <text x="190" y="180" text-anchor="middle" class="body">predictor positional inputs</text>
    <text x="190" y="224" text-anchor="middle" class="small">same encoder, same target, paired losses</text>
  </g>

  <path d="M850 352 H945" class="arrow"/>

  <g transform="translate(945 180)">
    <rect width="400" height="340" rx="16" class="card"/>
    <text x="200" y="42" text-anchor="middle" class="heading">Normalized context reliance</text>
    <text x="200" y="92" text-anchor="middle" class="body">R_near =</text>
    <text x="200" y="127" text-anchor="middle" class="body">(L_near-substitute − L_true)</text>
    <line x1="78" y1="143" x2="322" y2="143" stroke="#526075" stroke-width="2"/>
    <text x="200" y="171" text-anchor="middle" class="body">max(L_true, 10⁻⁸)</text>
    <text x="50" y="224" class="body">R near 0</text><text x="165" y="224" class="small">little measured dependence</text>
    <text x="50" y="258" class="body">R positive</text><text x="165" y="258" class="small">true context lowers loss</text>
    <text x="50" y="292" class="body">R negative</text><text x="165" y="292" class="small">inspect for pathology</text>
    <text x="200" y="325" text-anchor="middle" class="small">Always report both raw losses too.</text>
  </g>

  <text x="700" y="615" text-anchor="middle" class="small">This measures reliance under one intervention; it is not a causal decomposition of semantic content.</text>
</svg>
