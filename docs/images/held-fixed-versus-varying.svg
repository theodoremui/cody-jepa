<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">What is held fixed and what varies across cells</title>
  <desc id="fig-desc">The left panel lists everything held identical across all 28 models: architecture and objective, optimizer and schedule, batch size, masks, spatial transforms, sampled-clip exposure, checkpoint selection, and the common eligible corpus. The right panel lists the only three things that change: the number of sequences, the number of phase origins per sequence, and the origin policy. A panel underneath states that their product is pinned at 250,000.</desc>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <text x="480" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">Only three things are allowed to change</text>

  <rect x="50" y="82" width="440" height="330" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="80" y="120" font-size="18" font-weight="700" fill="#172b4d">Held fixed for all 28 models</text>
  <circle cx="88" cy="153" r="4" fill="#2563eb"/>
  <text x="106" y="158" font-size="16" fill="#172b4d">architecture and JEPA objective</text>
  <circle cx="88" cy="188" r="4" fill="#2563eb"/>
  <text x="106" y="193" font-size="16" fill="#172b4d">optimizer, schedule, and batch size</text>
  <circle cx="88" cy="223" r="4" fill="#2563eb"/>
  <text x="106" y="228" font-size="16" fill="#172b4d">context and target masks</text>
  <circle cx="88" cy="258" r="4" fill="#2563eb"/>
  <text x="106" y="263" font-size="16" fill="#172b4d">spatial transforms</text>
  <circle cx="88" cy="293" r="4" fill="#2563eb"/>
  <text x="106" y="298" font-size="16" fill="#172b4d">sampled-clip exposure, one tier for all</text>
  <circle cx="88" cy="328" r="4" fill="#2563eb"/>
  <text x="106" y="333" font-size="16" fill="#172b4d">checkpoint selection rule</text>
  <circle cx="88" cy="363" r="4" fill="#2563eb"/>
  <text x="106" y="368" font-size="16" fill="#172b4d">the common k = 4 eligible corpus</text>

  <rect x="520" y="82" width="390" height="180" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="550" y="120" font-size="18" font-weight="700" fill="#172b4d">Varies across cells</text>
  <circle cx="558" cy="153" r="4" fill="#d97706"/>
  <text x="576" y="158" font-size="16" fill="#172b4d">U, the number of sequences</text>
  <circle cx="558" cy="188" r="4" fill="#d97706"/>
  <text x="576" y="193" font-size="16" fill="#172b4d">k, the origins per sequence</text>
  <circle cx="558" cy="223" r="4" fill="#d97706"/>
  <text x="576" y="228" font-size="16" fill="#172b4d">origin policy: nested or jitter</text>

  <rect x="520" y="292" width="390" height="120" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="550" y="330" font-size="18" font-weight="700" fill="#172b4d">And their product is pinned</text>
  <text x="550" y="366" font-size="16" fill="#172b4d">U times k = 250,000 in every cell,</text>
  <text x="550" y="392" font-size="16" fill="#52606d">so catalog size cannot explain a gap.</text>

  <text x="480" y="446" text-anchor="middle" font-size="15" fill="#52606d">Within a paired block the seeds and nuisance streams are shared too, so the same block trains matched models.</text>
</svg>
