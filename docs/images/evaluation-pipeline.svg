<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Prospectively locked Grounded Factorial Completion v2 pipeline</title>
  <desc id="desc">GaitLU-only encoders produce recording features. Eighty Health and Gait participants fit evaluation adapters, 318 participants remain a locked outcome cohort, and five trained-model replicate contrasts provide primary uncertainty.</desc>
  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .heading { font: 700 20px system-ui, sans-serif; fill: #172033; }
      .group-heading { font: 700 18px system-ui, sans-serif; fill: #172033; }
      .body { font: 400 16px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 14px system-ui, sans-serif; fill: #526075; }
      .box { fill: #f8fafc; stroke: #aeb8c8; stroke-width: 2; rx: 14; }
      .train { fill: #eaf2ff; stroke: #6d91b8; }
      .eval { fill: #e9f7ef; stroke: #4b9270; }
      .warn { fill: #fff7e6; stroke: #d39b35; }
      .arrow { stroke: #526075; stroke-width: 3; fill: none; marker-end: url(#head); }
      .barrier { stroke: #9b4b4b; stroke-width: 3; stroke-dasharray: 8 6; }
    </style>
    <marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#526075"/>
    </marker>
  </defs>

  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">From frames to participant-level evidence</text>

  <g transform="translate(45 105)">
    <rect width="190" height="145" class="box"/>
    <text x="95" y="32" text-anchor="middle" class="heading">Direction clip</text>
    <g fill="#dbe3ee" stroke="#718096">
      <rect x="25" y="48" width="48" height="48"/>
      <rect x="71" y="56" width="48" height="48"/>
      <rect x="117" y="64" width="48" height="48"/>
    </g>
    <text x="95" y="135" text-anchor="middle" class="small">ordered silhouette frames</text>
  </g>
  <path d="M235 178 H290" class="arrow"/>
  <g transform="translate(290 105)">
    <rect width="220" height="145" class="box"/>
    <text x="110" y="32" text-anchor="middle" class="heading">Three windows</text>
    <rect x="25" y="55" width="50" height="50" fill="#dceaff" stroke="#6d91b8"/>
    <rect x="85" y="55" width="50" height="50" fill="#dceaff" stroke="#6d91b8"/>
    <rect x="145" y="55" width="50" height="50" fill="#dceaff" stroke="#6d91b8"/>
    <text x="110" y="132" text-anchor="middle" class="small">16 frames each, fixed locations</text>
  </g>
  <path d="M510 178 H565" class="arrow"/>
  <g transform="translate(565 105)">
    <rect width="225" height="145" class="box"/>
    <text x="112.5" y="32" text-anchor="middle" class="heading">One recording feature</text>
    <text x="112.5" y="77" text-anchor="middle" class="body">average the three vectors</text>
    <text x="112.5" y="108" text-anchor="middle" class="small">windows are not treated as trials</text>
  </g>

  <path d="M790 178 H855" class="arrow"/>
  <g transform="translate(855 82)">
    <rect width="500" height="190" class="warn" rx="16"/>
    <text x="250" y="35" text-anchor="middle" class="heading">Frozen Health&amp;Gait cohort roles</text>
    <rect x="20" y="60" width="215" height="95" class="train" rx="12"/>
    <text x="127.5" y="91" text-anchor="middle" class="group-heading">Development cohort</text>
    <text x="127.5" y="119" text-anchor="middle" class="body">80 total, 76 complete</text>
    <text x="127.5" y="143" text-anchor="middle" class="small">fit adapters and normalization</text>
    <rect x="265" y="60" width="215" height="95" class="eval" rx="12"/>
    <text x="372.5" y="91" text-anchor="middle" class="group-heading">Locked outcome cohort</text>
    <text x="372.5" y="119" text-anchor="middle" class="body">318 total, 308 complete</text>
    <text x="372.5" y="143" text-anchor="middle" class="small">score once after the freeze</text>
    <line x1="250" y1="62" x2="250" y2="153" class="barrier"/>
  </g>

  <path d="M1105 272 V340" class="arrow"/>
  <g transform="translate(865 340)">
    <rect width="490" height="135" class="eval" rx="14"/>
    <text x="245" y="32" text-anchor="middle" class="heading">16 GFC-v2 queries per complete participant</text>
    <text x="245" y="67" text-anchor="middle" class="body">8 targets × 2 session-safe focal factors</text>
    <text x="245" y="98" text-anchor="middle" class="small">all eight gallery cells remain candidates</text>
  </g>

  <path d="M865 407 H790" class="arrow"/>
  <g transform="translate(500 340)">
    <rect width="290" height="135" class="box"/>
    <text x="145" y="32" text-anchor="middle" class="heading">Average within participant</text>
    <text x="145" y="68" text-anchor="middle" class="body">learned GFC-v2 top-1</text>
    <text x="145" y="94" text-anchor="middle" class="body">controls and factor breakdowns</text>
    <text x="145" y="119" text-anchor="middle" class="small">queries are not independent samples</text>
  </g>

  <path d="M500 407 H425" class="arrow"/>
  <g transform="translate(45 330)">
    <rect width="380" height="155" class="box"/>
    <text x="190" y="32" text-anchor="middle" class="heading">Run-level primary inference</text>
    <text x="190" y="66" text-anchor="middle" class="body">full − small within each ladder</text>
    <text x="190" y="98" text-anchor="middle" class="body">t interval over five replicate means</text>
    <text x="190" y="127" text-anchor="middle" class="small">participant bootstraps are sensitivities</text>
  </g>

  <g transform="translate(90 555)">
    <rect width="1220" height="100" fill="#f8fafc" stroke="#c7cfdb" rx="14"/>
    <text x="610" y="34" text-anchor="middle" class="heading">What the barriers prevent</text>
    <text x="610" y="68" text-anchor="middle" class="body">Health&amp;Gait never trains revised encoders; locked outcomes cannot influence fitting, model selection, or analysis code.</text>
  </g>
</svg>
