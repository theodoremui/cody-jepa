<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">The eight Health and Gait conditions for one participant</title>
  <desc id="desc">A two by four grid combines two walking speeds, two clothing states, and two walking directions to make eight observed recordings.</desc>
  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px system-ui, sans-serif; fill: #4b5568; }
      .label { font: 700 18px system-ui, sans-serif; fill: #172033; }
      .small { font: 400 15px system-ui, sans-serif; fill: #4b5568; }
      .cell { fill: #f7f9fc; stroke: #aeb8c8; stroke-width: 2; rx: 14; }
      .usual { fill: #eaf2ff; }
      .fast { fill: #fff0e5; }
      .person { fill: #35618d; }
      .jacket { fill: #d56a3a; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <g id="walker">
      <circle cx="0" cy="-28" r="9" class="person"/>
      <path d="M0 -18 L0 18 M0 -4 L-18 9 M0 -4 L17 6 M0 18 L-15 42 M0 18 L17 40" stroke="#35618d" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
    <g id="walker-jacket">
      <circle cx="0" cy="-28" r="9" class="person"/>
      <path d="M-13 -16 L13 -16 L18 18 L-18 18 Z" class="jacket" opacity="0.9"/>
      <path d="M0 18 L-15 42 M0 18 L17 40 M-10 -7 L-23 10 M10 -7 L23 8" stroke="#35618d" stroke-width="7" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">One participant supplies a complete 2 × 2 × 2 grid</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">speed × clothing × direction = 8 observed recordings</text>

  <text x="120" y="150" text-anchor="middle" class="label">Speed</text>
  <text x="120" y="286" text-anchor="middle" class="label">Usual</text>
  <text x="120" y="306" text-anchor="middle" class="small">UGS</text>
  <text x="120" y="496" text-anchor="middle" class="label">Fast</text>
  <text x="120" y="516" text-anchor="middle" class="small">FGS</text>

  <text x="390" y="130" text-anchor="middle" class="label">No jacket</text>
  <text x="810" y="130" text-anchor="middle" class="label">Jacket</text>
  <path d="M205 145 H575" stroke="#8aa7c7" stroke-width="4"/>
  <path d="M625 145 H995" stroke="#dca07f" stroke-width="4"/>

  <g transform="translate(200 175)">
    <rect width="185" height="190" class="cell usual"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Right to left</text>
    <use href="#walker" transform="translate(92 100)"/>
    <path d="M142 155 H42" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">UGS · WoJ · R2L</text>
  </g>
  <g transform="translate(405 175)">
    <rect width="185" height="190" class="cell usual"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Left to right</text>
    <use href="#walker" transform="translate(92 100)"/>
    <path d="M42 155 H142" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">UGS · WoJ · L2R</text>
  </g>
  <g transform="translate(620 175)">
    <rect width="185" height="190" class="cell usual"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Right to left</text>
    <use href="#walker-jacket" transform="translate(92 100)"/>
    <path d="M142 155 H42" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">UGS · WJ · R2L</text>
  </g>
  <g transform="translate(825 175)">
    <rect width="185" height="190" class="cell usual"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Left to right</text>
    <use href="#walker-jacket" transform="translate(92 100)"/>
    <path d="M42 155 H142" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">UGS · WJ · L2R</text>
  </g>

  <g transform="translate(200 385)">
    <rect width="185" height="190" class="cell fast"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Right to left</text>
    <use href="#walker" transform="translate(92 100) scale(1.08)"/>
    <path d="M142 155 H42" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">FGS · WoJ · R2L</text>
  </g>
  <g transform="translate(405 385)">
    <rect width="185" height="190" class="cell fast"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Left to right</text>
    <use href="#walker" transform="translate(92 100) scale(1.08)"/>
    <path d="M42 155 H142" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">FGS · WoJ · L2R</text>
  </g>
  <g transform="translate(620 385)">
    <rect width="185" height="190" class="cell fast"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Right to left</text>
    <use href="#walker-jacket" transform="translate(92 100) scale(1.08)"/>
    <path d="M142 155 H42" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">FGS · WJ · R2L</text>
  </g>
  <g transform="translate(825 385)">
    <rect width="185" height="190" class="cell fast"/>
    <text x="92.5" y="30" text-anchor="middle" class="label">Left to right</text>
    <use href="#walker-jacket" transform="translate(92 100) scale(1.08)"/>
    <path d="M42 155 H142" class="arrow" marker-end="url(#arrowhead)"/>
    <text x="92.5" y="180" text-anchor="middle" class="small">FGS · WJ · L2R</text>
  </g>

  <text x="600" y="625" text-anchor="middle" class="subtitle">A participant must have all eight cells to enter the primary completion analysis.</text>
</svg>
