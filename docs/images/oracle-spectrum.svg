<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Exact partial-factor oracle spectrum for the eight-cell gallery</title>
  <desc id="desc">When no factors are recovered, all eight gallery cells tie and top-one credit is one eighth. One recovered binary factor leaves four tied cells, two factors leave two, and all three factors identify one target.</desc>
  <style>
    .title { font: 700 30px system-ui, sans-serif; fill: #172033; }
    .heading { font: 700 19px system-ui, sans-serif; fill: #172033; }
    .body { font: 400 16px system-ui, sans-serif; fill: #334155; }
    .small { font: 400 14px system-ui, sans-serif; fill: #526075; }
    .cell { fill: #f1f4f8; stroke: #9aa8ba; stroke-width: 1.5; }
    .match { fill: #eaf2ff; stroke: #648db8; stroke-width: 2; }
    .target { fill: #eaf7ef; stroke: #3f8a61; stroke-width: 3; }
    .card { fill: #fbfcfe; stroke: #c2ccd8; stroke-width: 2; }
  </style>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">The full gallery makes every missing factor cost the same</text>
  <text x="700" y="80" text-anchor="middle" class="body">Fractional top-1 credit is one divided by the number of tied cells that still match the recovered factors.</text>

  <g transform="translate(45 135)">
    <rect width="305" height="455" rx="16" class="card"/>
    <text x="152.5" y="38" text-anchor="middle" class="heading">Recover 0 factors</text>
    <text x="152.5" y="68" text-anchor="middle" class="body">8 cells still match</text>
    <g transform="translate(50 100)">
      <rect x="0" y="0" width="92" height="62" rx="8" class="match"/><rect x="112" y="0" width="92" height="62" rx="8" class="match"/>
      <rect x="0" y="80" width="92" height="62" rx="8" class="match"/><rect x="112" y="80" width="92" height="62" rx="8" class="match"/>
      <rect x="0" y="160" width="92" height="62" rx="8" class="match"/><rect x="112" y="160" width="92" height="62" rx="8" class="match"/>
      <rect x="0" y="240" width="92" height="62" rx="8" class="match"/><rect x="112" y="240" width="92" height="62" rx="8" class="target"/>
    </g>
    <text x="152.5" y="425" text-anchor="middle" class="heading">Top-1 = 1/8</text>
  </g>

  <g transform="translate(380 135)">
    <rect width="305" height="455" rx="16" class="card"/>
    <text x="152.5" y="38" text-anchor="middle" class="heading">Recover 1 factor</text>
    <text x="152.5" y="68" text-anchor="middle" class="body">4 cells still match</text>
    <g transform="translate(50 100)">
      <rect x="0" y="0" width="92" height="62" rx="8" class="match"/><rect x="112" y="0" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="80" width="92" height="62" rx="8" class="match"/><rect x="112" y="80" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="160" width="92" height="62" rx="8" class="match"/><rect x="112" y="160" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="240" width="92" height="62" rx="8" class="target"/><rect x="112" y="240" width="92" height="62" rx="8" class="cell"/>
    </g>
    <text x="152.5" y="425" text-anchor="middle" class="heading">Top-1 = 1/4</text>
  </g>

  <g transform="translate(715 135)">
    <rect width="305" height="455" rx="16" class="card"/>
    <text x="152.5" y="38" text-anchor="middle" class="heading">Recover 2 factors</text>
    <text x="152.5" y="68" text-anchor="middle" class="body">2 cells still match</text>
    <g transform="translate(50 100)">
      <rect x="0" y="0" width="92" height="62" rx="8" class="match"/><rect x="112" y="0" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="80" width="92" height="62" rx="8" class="cell"/><rect x="112" y="80" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="160" width="92" height="62" rx="8" class="cell"/><rect x="112" y="160" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="240" width="92" height="62" rx="8" class="target"/><rect x="112" y="240" width="92" height="62" rx="8" class="cell"/>
    </g>
    <text x="152.5" y="425" text-anchor="middle" class="heading">Top-1 = 1/2</text>
  </g>

  <g transform="translate(1050 135)">
    <rect width="305" height="455" rx="16" class="card"/>
    <text x="152.5" y="38" text-anchor="middle" class="heading">Recover all 3</text>
    <text x="152.5" y="68" text-anchor="middle" class="body">1 cell matches</text>
    <g transform="translate(50 100)">
      <rect x="0" y="0" width="92" height="62" rx="8" class="cell"/><rect x="112" y="0" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="80" width="92" height="62" rx="8" class="cell"/><rect x="112" y="80" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="160" width="92" height="62" rx="8" class="cell"/><rect x="112" y="160" width="92" height="62" rx="8" class="cell"/>
      <rect x="0" y="240" width="92" height="62" rx="8" class="target"/><rect x="112" y="240" width="92" height="62" rx="8" class="cell"/>
    </g>
    <text x="152.5" y="425" text-anchor="middle" class="heading">Top-1 = 1</text>
  </g>

  <g transform="translate(250 625)">
    <rect width="20" height="20" rx="4" class="target"/><text x="30" y="16" class="small">target</text>
    <rect x="145" width="20" height="20" rx="4" class="match"/><text x="175" y="16" class="small">another tied match</text>
    <rect x="390" width="20" height="20" rx="4" class="cell"/><text x="420" y="16" class="small">ruled out by recovered factors</text>
  </g>
  <text x="700" y="680" text-anchor="middle" class="small">Because donors stay in the gallery, the spectrum depends only on how many factors are recovered—not which factors they are.</text>
</svg>
