<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="fig-title fig-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="fig-title">The eight-item gallery and the continuous target margin</title>
  <desc id="fig-desc">A query built from two donor recordings is scored against a complete eight-item factorial gallery. One gallery item is the true target and one is the nearest non-target competitor. The target margin is the distance to that nearest competitor minus the distance to the true target, so a positive margin means the true target wins.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <text x="480" y="46" text-anchor="middle" font-size="23" font-weight="700" fill="#172b4d">One query, eight candidates, one continuous score</text>

  <rect x="50" y="130" width="250" height="140" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="175" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Query q</text>
  <text x="175" y="207" text-anchor="middle" font-size="16" fill="#172b4d">built from blocks of</text>
  <text x="175" y="233" text-anchor="middle" font-size="16" fill="#172b4d">two donor recordings</text>

  <path d="M304 200 H344" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="350" y="95" width="530" height="205" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <text x="615" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Complete eight-item gallery</text>
  <rect x="371" y="150" width="110" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="497" y="150" width="110" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="552" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#172b4d">target</text>
  <rect x="623" y="150" width="110" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="749" y="150" width="110" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="371" y="222" width="110" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="497" y="222" width="110" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="623" y="222" width="110" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="678" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#172b4d">rival</text>
  <rect x="749" y="222" width="110" height="58" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <rect x="50" y="332" width="860" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="80" y="366" font-size="18" font-weight="700" fill="#172b4d">Target margin</text>
  <text x="80" y="398" font-size="16" fill="#172b4d">m(q) = d(q, rival) minus d(q, target). Positive means the true target wins.</text>

  <text x="480" y="452" text-anchor="middle" font-size="15" fill="#52606d">target is the true target. rival is the nearest non-target competitor under the frozen distance.</text>
</svg>
