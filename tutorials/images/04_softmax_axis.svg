<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Softmax normalizes each score row across keys</title>
  <desc id="desc">A four by four score matrix has queries down the rows and keys across the columns. The highlighted second row is turned into four positive weights that sum to one, which is why the attention output for that query is a weighted average.</desc>
  <defs><marker id="ax04" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">One row of scores becomes one set of averaging weights</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="250" y="92" text-anchor="middle" font-size="17" font-weight="700">keys run across the columns</text>
    <rect x="120" y="112" width="260" height="260" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="120" y="177" width="260" height="65" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="152" y="152" text-anchor="middle" font-size="16">1.0</text>
    <text x="217" y="152" text-anchor="middle" font-size="16">0.4</text>
    <text x="282" y="152" text-anchor="middle" font-size="16">0.2</text>
    <text x="347" y="152" text-anchor="middle" font-size="16">0.9</text>
    <text x="152" y="217" text-anchor="middle" font-size="16" font-weight="700">0.2</text>
    <text x="217" y="217" text-anchor="middle" font-size="16" font-weight="700">1.5</text>
    <text x="282" y="217" text-anchor="middle" font-size="16" font-weight="700">0.0</text>
    <text x="347" y="217" text-anchor="middle" font-size="16" font-weight="700">0.7</text>
    <text x="152" y="282" text-anchor="middle" font-size="16">0.5</text>
    <text x="217" y="282" text-anchor="middle" font-size="16">0.1</text>
    <text x="282" y="282" text-anchor="middle" font-size="16">1.1</text>
    <text x="347" y="282" text-anchor="middle" font-size="16">0.3</text>
    <text x="152" y="347" text-anchor="middle" font-size="16">0.8</text>
    <text x="217" y="347" text-anchor="middle" font-size="16">0.6</text>
    <text x="282" y="347" text-anchor="middle" font-size="16">0.4</text>
    <text x="347" y="347" text-anchor="middle" font-size="16">0.1</text>
    <text x="250" y="404" text-anchor="middle" font-size="15" fill="#52606d">queries run down the rows</text>

    <path d="M400 210 H470" stroke="#52606d" stroke-width="3" marker-end="url(#ax04)"/>
    <text x="435" y="182" text-anchor="middle" font-size="15" fill="#52606d">softmax</text>

    <rect x="500" y="150" width="380" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="690" y="188" text-anchor="middle" font-size="17" font-weight="700">weights for query 2</text>
    <text x="690" y="224" text-anchor="middle" font-size="16">0.140   0.514   0.115   0.231</text>
    <text x="690" y="252" text-anchor="middle" font-size="15" fill="#52606d">they add to 1.000</text>

    <rect x="500" y="296" width="380" height="86" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="690" y="330" text-anchor="middle" font-size="17" font-weight="700">output for query 2</text>
    <text x="690" y="360" text-anchor="middle" font-size="16">a weighted average of the four values</text>

    <text x="480" y="436" text-anchor="middle" font-size="15" fill="#52606d">Normalizing down a column instead would answer a different question.</text>
  </g>
</svg>
