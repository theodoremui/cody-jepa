<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Participants contain recordings, which contain clips</title>
  <desc id="desc">One participant holds two recordings, and each recording holds three clips, so the same study counts as one participant, two recordings, or six clip rows depending on the level chosen.</desc>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">One study, three different sample sizes</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="60" y="90" width="520" height="270" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="320" y="128" text-anchor="middle" font-size="18" font-weight="700">Participant P1</text>

    <rect x="90" y="150" width="230" height="180" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="205" y="186" text-anchor="middle" font-size="17" font-weight="700">Recording R1</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="105" y="212" width="60" height="60" rx="8"/><rect x="175" y="212" width="60" height="60" rx="8"/><rect x="245" y="212" width="60" height="60" rx="8"/>
    </g>
    <g font-size="16" text-anchor="middle"><text x="135" y="248">c1</text><text x="205" y="248">c2</text><text x="275" y="248">c3</text></g>

    <rect x="330" y="150" width="230" height="180" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="445" y="186" text-anchor="middle" font-size="17" font-weight="700">Recording R2</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="345" y="212" width="60" height="60" rx="8"/><rect x="415" y="212" width="60" height="60" rx="8"/><rect x="485" y="212" width="60" height="60" rx="8"/>
    </g>
    <g font-size="16" text-anchor="middle"><text x="375" y="248">c4</text><text x="445" y="248">c5</text><text x="515" y="248">c6</text></g>

    <rect x="620" y="90" width="280" height="270" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="760" y="128" text-anchor="middle" font-size="18" font-weight="700">How many units?</text>
    <g font-size="17" text-anchor="middle">
      <text x="760" y="196">participants: 1</text>
      <text x="760" y="236">recordings: 2</text>
      <text x="760" y="276">clips, that is rows: 6</text>
    </g>

    <rect x="150" y="386" width="660" height="60" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="422" text-anchor="middle" font-size="17">more clips sharpen one person; only more people add people</text>
  </g>
</svg>
