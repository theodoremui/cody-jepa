<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Partial information creates an accuracy ceiling</title>
  <desc id="desc">Knowing one of three binary factors leaves four compatible cells, so a uniformly random exact guess succeeds with probability one fourth.</desc>
  <defs><marker id="a11p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">What can one known bit identify?</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="55" y="125" width="240" height="165" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="175" y="165" text-anchor="middle" font-size="19" font-weight="700">Observed information</text>
    <text x="175" y="215" text-anchor="middle" font-size="28">1, ?, ?</text>
    <text x="175" y="258" text-anchor="middle" font-size="16">one known factor</text>
    <path d="M305 208 H380" stroke="#475569" stroke-width="3" marker-end="url(#a11p)"/>
    <rect x="390" y="90" width="300" height="235" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="540" y="128" text-anchor="middle" font-size="19" font-weight="700">Compatible cells</text>
    <g font-size="18" text-anchor="middle"><text x="470" y="185">1, 0, 0</text><text x="610" y="185">1, 0, 1</text><text x="470" y="245">1, 1, 0</text><text x="610" y="245">1, 1, 1</text></g>
    <text x="540" y="295" text-anchor="middle" font-size="16">two missing bits give 4 possibilities</text>
    <path d="M700 208 H770" stroke="#475569" stroke-width="3" marker-end="url(#a11p)"/>
    <rect x="780" y="125" width="135" height="165" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="847" y="166" text-anchor="middle" font-size="18" font-weight="700">Best exact</text>
    <text x="847" y="193" text-anchor="middle" font-size="18" font-weight="700">guess</text>
    <text x="847" y="242" text-anchor="middle" font-size="28">1 / 4</text>
    <text x="480" y="375" text-anchor="middle" font-size="17">From this query alone, uniform compatible states are indistinguishable.</text>
  </g>
</svg>
