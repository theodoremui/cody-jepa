<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">The two halves of a resume contract</title>
  <desc id="desc">A checkpoint stores optimizer and schedule state on one side and data provenance on the other, and any mismatch in either side stops the resume.</desc>
  <defs>
    <marker id="a07r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">What an exact resume has to record</text>

    <rect x="40" y="96" width="400" height="272" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Saved with the checkpoint</text>
    <text x="72" y="186" font-size="16" fill="#172b4d">model weights</text>
    <text x="72" y="222" font-size="16" fill="#172b4d">Adam moments m and v</text>
    <text x="72" y="258" font-size="16" fill="#172b4d">scheduler position</text>
    <text x="72" y="294" font-size="16" fill="#172b4d">gradient scaler state</text>
    <text x="72" y="330" font-size="16" fill="#172b4d">completed updates</text>

    <rect x="520" y="96" width="400" height="272" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="720" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Provenance that must match</text>
    <text x="552" y="186" font-size="16" fill="#172b4d">manifest and phase digests</text>
    <text x="552" y="222" font-size="16" fill="#172b4d">allocation and catalog size</text>
    <text x="552" y="258" font-size="16" fill="#172b4d">exposure and batch size</text>
    <text x="552" y="294" font-size="16" fill="#172b4d">optimization and replicate seeds</text>
    <text x="552" y="330" font-size="16" fill="#172b4d">four stream versions</text>

    <line x1="240" y1="372" x2="330" y2="398" stroke="#52606d" stroke-width="3" marker-end="url(#a07r)"/>
    <line x1="720" y1="372" x2="630" y2="398" stroke="#52606d" stroke-width="3" marker-end="url(#a07r)"/>

    <rect x="250" y="404" width="460" height="60" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="442" text-anchor="middle" font-size="17" fill="#172b4d">Missing, extra, or changed field: stop</text>
  </g>
</svg>
