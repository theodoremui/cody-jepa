<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Superiority and equivalence use different decision regions</title>
  <desc id="desc">A number line shows zero for superiority and a practical equivalence band from negative delta to positive delta.</desc>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">A confidence interval answers different threshold questions</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="55" y="85" width="850" height="275" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="350" y="125" width="260" height="150" fill="#dcfce7" opacity="0.85"/>
    <line x1="125" y1="240" x2="835" y2="240" stroke="#475569" stroke-width="3"/>
    <line x1="350" y1="218" x2="350" y2="262" stroke="#16a34a" stroke-width="3"/><line x1="480" y1="205" x2="480" y2="270" stroke="#dc2626" stroke-width="3"/><line x1="610" y1="218" x2="610" y2="262" stroke="#16a34a" stroke-width="3"/>
    <text x="350" y="295" text-anchor="middle" font-size="17">-delta</text><text x="480" y="295" text-anchor="middle" font-size="17">0</text><text x="610" y="295" text-anchor="middle" font-size="17">+delta</text>
    <line x1="395" y1="165" x2="565" y2="165" stroke="#2563eb" stroke-width="7"/><circle cx="395" cy="165" r="7" fill="#2563eb"/><circle cx="565" cy="165" r="7" fill="#2563eb"/>
    <text x="480" y="145" text-anchor="middle" font-size="17">interval entirely inside equivalence band</text>
    <line x1="540" y1="330" x2="735" y2="330" stroke="#d97706" stroke-width="7"/><circle cx="540" cy="330" r="7" fill="#d97706"/><circle cx="735" cy="330" r="7" fill="#d97706"/>
    <text x="720" y="310" text-anchor="middle" font-size="17">interval above zero</text>
    <text x="480" y="395" text-anchor="middle" font-size="17">Equivalence means sufficiently small; superiority means reliably above zero.</text>
  </g>
</svg>
