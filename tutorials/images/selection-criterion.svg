<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" width="750" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="749" height="359" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="36" font-size="16.5" font-weight="600" fill="#0f172a">Loss does not select the transferable representation</text>
  <text x="28" y="57" font-size="11" fill="#64748b">Spearman correlation with held-out retrieval across 11 existing phase 1 runs</text>

  <line x1="234" y1="92" x2="674" y2="92" stroke="#e2e8f0"/>
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <line x1="234" y1="88" x2="234" y2="260" stroke="#e2e8f0"/>
    <text x="234" y="82">0</text>
    <line x1="344" y1="88" x2="344" y2="260" stroke="#f1f5f9"/>
    <text x="344" y="82">.25</text>
    <line x1="454" y1="88" x2="454" y2="260" stroke="#f1f5f9"/>
    <text x="454" y="82">.50</text>
    <line x1="564" y1="88" x2="564" y2="260" stroke="#f1f5f9"/>
    <text x="564" y="82">.75</text>
    <line x1="674" y1="88" x2="674" y2="260" stroke="#e2e8f0"/>
    <text x="674" y="82">1.0</text>
  </g>

  <text x="28" y="132" font-size="11.5" font-weight="600" fill="#0f172a">clip-pooled effective rank</text>
  <rect x="234" y="112" width="392" height="28" rx="5" fill="#059669"/>
  <text x="636" y="131" font-size="11.5" font-weight="600" fill="#059669">ρ = 0.890</text>
  <text x="28" y="148" font-size="10" fill="#64748b">p = 0.0002</text>

  <text x="28" y="190" font-size="11.5" font-weight="600" fill="#0f172a">best validation loss</text>
  <rect x="234" y="170" width="135" height="28" rx="5" fill="#d97706"/>
  <text x="379" y="189" font-size="11.5" font-weight="600" fill="#d97706">ρ = 0.306</text>
  <text x="28" y="206" font-size="10" fill="#64748b">p = 0.360</text>

  <text x="28" y="248" font-size="11.5" font-weight="600" fill="#0f172a">best training loss</text>
  <rect x="234" y="228" width="82" height="28" rx="5" fill="#dc2626"/>
  <text x="326" y="247" font-size="11.5" font-weight="600" fill="#dc2626">ρ = 0.187</text>
  <text x="28" y="264" font-size="10" fill="#64748b">p = 0.582</text>

  <rect x="28" y="288" width="694" height="50" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="307" font-size="10.5" font-weight="600" fill="#334155">The repository saves best_loss.pt, but the pilot says loss is not a transfer proxy</text>
  <text x="44" y="325" font-size="10" fill="#64748b">Caveat: these are single-seed, non-factorial runs. The 360-run study must test checkpoint selection directly.</text>
</svg>
