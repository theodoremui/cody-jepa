<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">What the protocol freeze settles and what it still allows</title>
  <desc id="desc">A green panel lists the fields fixed by the content-addressed protocol snapshot, a blue panel lists the changes that remain allowed afterwards, and a red band states the one action that is never allowed after outcomes are opened.</desc>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">The freeze line drawn before outcomes are opened</text>

    <rect x="50" y="86" width="400" height="270" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="124" text-anchor="middle" font-size="18" font-weight="700">Frozen in the snapshot</text>
    <text x="250" y="164" text-anchor="middle" font-size="15">the 28-row allocation registry</text>
    <text x="250" y="194" text-anchor="middle" font-size="15">manifests and the phase catalog</text>
    <text x="250" y="224" text-anchor="middle" font-size="15">the exposure tier rule</text>
    <text x="250" y="254" text-anchor="middle" font-size="15">GFC-v2 and the completion control</text>
    <text x="250" y="284" text-anchor="middle" font-size="15">margins and the interval rule</text>
    <text x="250" y="314" text-anchor="middle" font-size="15">statistics code and figure templates</text>

    <rect x="510" y="86" width="400" height="270" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="710" y="124" text-anchor="middle" font-size="18" font-weight="700">Still allowed afterwards</text>
    <text x="710" y="164" text-anchor="middle" font-size="15">permitted systems reruns</text>
    <text x="710" y="194" text-anchor="middle" font-size="15">analyses labeled exploratory</text>
    <text x="710" y="224" text-anchor="middle" font-size="15">a new numbered protocol version</text>
    <text x="710" y="254" text-anchor="middle" font-size="15">carrying a written reason</text>
    <text x="710" y="284" text-anchor="middle" font-size="15">and its own snapshot digest</text>
    <text x="710" y="314" text-anchor="middle" font-size="15">earlier snapshots stay readable</text>

    <rect x="150" y="386" width="660" height="56" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="420" text-anchor="middle" font-size="16" font-weight="700">Never: quietly editing a frozen field after seeing an outcome</text>
  </g>
</svg>
