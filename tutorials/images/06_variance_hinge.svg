<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">The variance hinge penalizes only features below the target spread</title>
  <desc id="desc">The penalty falls linearly from its largest value at zero standard deviation to zero at the target gamma, and stays flat at zero for every larger standard deviation.</desc>
  <rect width="700" height="420" fill="#fbfaf7"/>
  <text x="350" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172b4d">The variance term pushes only on flat features</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="120" y="82" text-anchor="middle" font-size="15" fill="#52606d">penalty</text>
    <line x1="120" y1="96" x2="120" y2="320" stroke="#52606d" stroke-width="3"/>
    <line x1="120" y1="320" x2="620" y2="320" stroke="#52606d" stroke-width="3"/>
    <line x1="420" y1="110" x2="420" y2="320" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M120 120 L420 320 L620 320" fill="none" stroke="#dc2626" stroke-width="4"/>
    <circle cx="420" cy="320" r="7" fill="#dc2626"/>
    <text x="230" y="302" text-anchor="middle" font-size="15" fill="#dc2626">below target: push spread up</text>
    <text x="524" y="272" text-anchor="middle" font-size="15" fill="#16a34a">at or above target: no pressure</text>
    <text x="110" y="346" text-anchor="end" font-size="15" fill="#52606d">0</text>
    <text x="420" y="348" text-anchor="middle" font-size="16">gamma</text>
    <text x="370" y="384" text-anchor="middle" font-size="15" fill="#52606d">feature standard deviation s</text>
  </g>
</svg>
