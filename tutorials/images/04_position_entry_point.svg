<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Where positional vectors enter the network</title>
  <desc id="desc">Token features and a position table have the same shape, so they are added elementwise before the first Transformer block. The sum keeps the original shape and adds no extra tokens.</desc>
  <defs><marker id="pe04" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Position is added, not appended</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="25" y="130" width="210" height="100" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="170" text-anchor="middle" font-size="17" font-weight="700">Token features X</text>
    <text x="130" y="202" text-anchor="middle" font-size="16">shape (B, N, D)</text>

    <path d="M239 180 H284" stroke="#52606d" stroke-width="3" marker-end="url(#pe04)"/>
    <circle cx="320" cy="180" r="30" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="190" text-anchor="middle" font-size="26" font-weight="700">+</text>

    <rect x="215" y="290" width="210" height="94" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="320" y="330" text-anchor="middle" font-size="17" font-weight="700">Position table P</text>
    <text x="320" y="362" text-anchor="middle" font-size="16">shape (N, D)</text>
    <path d="M320 286 V216" stroke="#52606d" stroke-width="3" marker-end="url(#pe04)"/>

    <path d="M354 180 H404" stroke="#52606d" stroke-width="3" marker-end="url(#pe04)"/>
    <rect x="410" y="130" width="230" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="525" y="170" text-anchor="middle" font-size="17" font-weight="700">Block input</text>
    <text x="525" y="202" text-anchor="middle" font-size="16">still shape (B, N, D)</text>

    <path d="M644 180 H694" stroke="#52606d" stroke-width="3" marker-end="url(#pe04)"/>
    <rect x="700" y="130" width="230" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="815" y="170" text-anchor="middle" font-size="17" font-weight="700">Transformer block</text>
    <text x="815" y="202" text-anchor="middle" font-size="16">projects Q, K, V</text>

    <text x="480" y="414" text-anchor="middle" font-size="15" fill="#52606d">The sequence length never changes, so every later shape assertion still holds.</text>
  </g>
</svg>
