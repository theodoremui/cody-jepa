<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating identity geometry under a context intervention</title>
  <desc id="desc">The same identity is observed before and after context substitution, encoded, then evaluated by geometry matching and enrollment-to-probe retrieval.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Hold identity fixed, change context, test the geometry</text>
    <rect x="42" y="98" width="228" height="232" rx="18" fill="#e8f1fb" stroke="#3b82b8" stroke-width="2"/>
    <text x="156" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#173f5f">Context substitution</text>
    <circle cx="105" cy="207" r="35" fill="#ffffff" stroke="#69a7d0" stroke-width="2"/>
    <circle cx="207" cy="207" r="35" fill="#fff3d6" stroke="#d89b21" stroke-width="2"/>
    <text x="105" y="202" text-anchor="middle" font-size="17" fill="#173f5f">ID 4</text>
    <text x="105" y="225" text-anchor="middle" font-size="16" fill="#173f5f">day</text>
    <text x="207" y="202" text-anchor="middle" font-size="17" fill="#744b00">ID 4</text>
    <text x="207" y="225" text-anchor="middle" font-size="16" fill="#744b00">night</text>
    <line x1="140" y1="207" x2="164" y2="207" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="156" y="292" text-anchor="middle" font-size="17" fill="#173f5f">identity unchanged</text>
    <line x1="280" y1="214" x2="358" y2="214" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="370" y="126" width="208" height="176" rx="18" fill="#f2eafd" stroke="#8057b5" stroke-width="2"/>
    <text x="474" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#4f2e78">Encoder</text>
    <circle cx="430" cy="226" r="13" fill="#8057b5"/>
    <circle cx="470" cy="204" r="13" fill="#3b82b8"/>
    <circle cx="518" cy="240" r="13" fill="#d89b21"/>
    <text x="474" y="276" text-anchor="middle" font-size="17" fill="#4f2e78">vectors z and z′</text>
    <line x1="588" y1="214" x2="662" y2="214" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="674" y="88" width="244" height="252" rx="18" fill="#e8f7ee" stroke="#3d9b67" stroke-width="2"/>
    <text x="796" y="127" text-anchor="middle" font-size="20" font-weight="700" fill="#165b36">Two checks</text>
    <rect x="706" y="153" width="180" height="64" rx="10" fill="#ffffff" stroke="#74b38d"/>
    <text x="796" y="180" text-anchor="middle" font-size="17" fill="#165b36">pairwise geometry</text>
    <text x="796" y="203" text-anchor="middle" font-size="16" fill="#165b36">D(z) versus D(z′)</text>
    <rect x="706" y="238" width="180" height="64" rx="10" fill="#ffffff" stroke="#74b38d"/>
    <text x="796" y="265" text-anchor="middle" font-size="17" fill="#165b36">enroll → probe</text>
    <text x="796" y="288" text-anchor="middle" font-size="16" fill="#165b36">centroid or retrieval</text>
    <text x="480" y="392" text-anchor="middle" font-size="17" fill="#52606d">A valid intervention changes the intended context without leaking probe information.</text>
  </g>
</svg>
