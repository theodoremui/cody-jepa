<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Stable gradient update pipeline</title>
  <desc id="desc">A left-to-right workflow shows microbatch losses accumulating into gradients, unscaling and clipping, AdamW updating parameters, and a warmup-cosine schedule controlling learning rate.</desc>
  <defs>
    <marker id="arrow07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34495e"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17202a">One effective parameter update</text>
  <rect x="34" y="102" width="170" height="154" rx="14" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
  <text x="119" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1b4f72">Microbatches</text>
  <rect x="61" y="156" width="116" height="28" rx="7" fill="#8fc5e8"/><rect x="61" y="193" width="116" height="28" rx="7" fill="#8fc5e8"/>
  <text x="119" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#173b53">loss / K</text><text x="119" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#173b53">backward</text>
  <line x1="210" y1="179" x2="251" y2="179" stroke="#34495e" stroke-width="3" marker-end="url(#arrow07)"/>
  <rect x="266" y="102" width="180" height="154" rx="14" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
  <text x="356" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#633974">Gradient buffer</text>
  <text x="356" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#512e5f">sum scaled gradients</text>
  <text x="356" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#512e5f">unscale, then clip</text>
  <line x1="452" y1="179" x2="493" y2="179" stroke="#34495e" stroke-width="3" marker-end="url(#arrow07)"/>
  <rect x="508" y="102" width="180" height="154" rx="14" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
  <text x="598" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#145a4a">AdamW</text>
  <text x="598" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#174f42">adaptive moments</text>
  <text x="598" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#174f42">decoupled decay</text>
  <line x1="694" y1="179" x2="735" y2="179" stroke="#34495e" stroke-width="3" marker-end="url(#arrow07)"/>
  <rect x="750" y="102" width="176" height="154" rx="14" fill="#fff4d6" stroke="#d49b21" stroke-width="2"/>
  <text x="838" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7d6608">New parameters</text>
  <text x="838" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5f4b08">optimizer step</text>
  <text x="838" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5f4b08">clear gradients</text>
  <path d="M270 350 L270 320 C325 318 355 296 395 275 C443 250 488 292 534 301 C601 315 670 330 897 350" fill="none" stroke="#c75b4b" stroke-width="4"/>
  <line x1="270" y1="350" x2="900" y2="350" stroke="#7f8c8d" stroke-width="2"/>
  <text x="270" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">warmup</text>
  <text x="594" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#34495e">cosine decay controls learning rate</text>
</svg>
