<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="750" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="vdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="vdGreenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="749" height="479" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="36" font-size="16.5" font-weight="600" fill="#0f172a">Where token variance goes</text>
  <text x="28" y="57" font-size="11" fill="#64748b">For equal token counts, total covariance splits exactly into between-clip and within-clip terms</text>

  <rect x="28" y="84" width="174" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="115" y="112" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">Σ<tspan baseline-shift="sub" font-size="9">token</tspan></text>
  <text x="115" y="135" font-size="10.5" fill="#334155" text-anchor="middle">all tokens across all clips</text>
  <text x="115" y="151" font-size="10" fill="#64748b" text-anchor="middle">standard token rank reads this</text>

  <text x="222" y="130" font-size="20" font-weight="600" fill="#64748b" text-anchor="middle">=</text>

  <rect x="244" y="84" width="206" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="347" y="112" font-size="14" font-weight="600" fill="#059669" text-anchor="middle">Σ<tspan baseline-shift="sub" font-size="9">between</tspan></text>
  <text x="347" y="135" font-size="10.5" fill="#334155" text-anchor="middle">variation among clip means</text>
  <text x="347" y="151" font-size="10" fill="#059669" text-anchor="middle">survives mean pooling</text>

  <text x="472" y="130" font-size="20" font-weight="600" fill="#64748b" text-anchor="middle">+</text>

  <rect x="494" y="84" width="228" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="608" y="112" font-size="14" font-weight="600" fill="#d97706" text-anchor="middle">Σ<tspan baseline-shift="sub" font-size="9">within</tspan></text>
  <text x="608" y="135" font-size="10.5" fill="#334155" text-anchor="middle">variation among positions in a clip</text>
  <text x="608" y="151" font-size="10" fill="#d97706" text-anchor="middle">removed by mean pooling</text>

  <path d="M 347 162 L 347 198" stroke="#059669" stroke-width="1.7" fill="none" marker-end="url(#vdGreenArrow)"/>
  <rect x="244" y="204" width="206" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="347" y="228" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">pooled probe reads only this</text>
  <text x="347" y="249" font-size="11" fill="#059669" text-anchor="middle">Σ<tspan baseline-shift="sub" font-size="8">pooled</tspan> = Σ<tspan baseline-shift="sub" font-size="8">between</tspan></text>

  <path d="M 608 162 L 608 189 L 493 189 L 493 235 L 463 235" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#vdArrow)"/>
  <text x="622" y="180" font-size="10" fill="#d97706" text-anchor="start">never reaches the probe</text>

  <rect x="28" y="204" width="174" height="62" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="115" y="228" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">between-clip share</text>
  <text x="115" y="250" font-size="12.5" fill="#0f172a" text-anchor="middle">β = tr(Σ<tspan baseline-shift="sub" font-size="8">between</tspan>) / tr(Σ<tspan baseline-shift="sub" font-size="8">token</tspan>)</text>

  <line x1="28" y1="292" x2="722" y2="292" stroke="#e2e8f0"/>
  <text x="28" y="321" font-size="12" font-weight="600" fill="#0f172a">Measured on 1,872 held-out clips and 2,935,296 tokens</text>
  <text x="722" y="321" font-size="10" fill="#64748b" text-anchor="end">bar length uses a log scale</text>

  <text x="28" y="356" font-size="10.5" fill="#334155">random initialisation</text>
  <rect x="176" y="343" width="55" height="18" rx="4" fill="#94a3b8"/>
  <text x="239" y="356" font-size="10.5" font-weight="600" fill="#334155">β = 0.00025</text>

  <text x="28" y="393" font-size="10.5" fill="#334155">no regulariser</text>
  <rect x="176" y="380" width="96" height="18" rx="4" fill="#d97706"/>
  <text x="280" y="393" font-size="10.5" font-weight="600" fill="#334155">β = 0.00063</text>
  <text x="390" y="393" font-size="10.5" fill="#d97706">99.94% is within clip</text>

  <text x="28" y="430" font-size="10.5" fill="#334155">clip-axis variance on</text>
  <rect x="176" y="417" width="350" height="18" rx="4" fill="#059669"/>
  <text x="534" y="430" font-size="10.5" font-weight="600" fill="#334155">β = 0.104</text>

  <rect x="28" y="449" width="694" height="20" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="375" y="463" font-size="10.5" fill="#334155" text-anchor="middle">β changes by about 400x under identical data and identical pooling, so pooling alone cannot explain it</text>
</svg>
