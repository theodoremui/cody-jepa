<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Equal-factor blockwise distance aggregation</title>
  <desc id="desc">Distances are averaged within each factor block and then the block means receive equal weight.</desc>
  <defs><marker id="a12b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Average within factors before averaging across factors</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="45" y="90" width="280" height="245" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="185" y="128" text-anchor="middle" font-size="19" font-weight="700">Appearance block</text>
    <text x="185" y="180" text-anchor="middle" font-size="17">distances: 0.2, 0.4, 0.6</text>
    <text x="185" y="230" text-anchor="middle" font-size="18">block mean = 0.4</text>
    <text x="185" y="285" text-anchor="middle" font-size="16">3 measurements</text>
    <rect x="365" y="90" width="280" height="245" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="505" y="128" text-anchor="middle" font-size="19" font-weight="700">Motion block</text>
    <text x="505" y="180" text-anchor="middle" font-size="17">distance: 0.8</text>
    <text x="505" y="230" text-anchor="middle" font-size="18">block mean = 0.8</text>
    <text x="505" y="285" text-anchor="middle" font-size="16">1 measurement</text>
    <path d="M655 212 H730" stroke="#475569" stroke-width="3" marker-end="url(#a12b)"/>
    <rect x="740" y="120" width="175" height="185" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="827" y="160" text-anchor="middle" font-size="19" font-weight="700">Equal factors</text>
    <text x="827" y="210" text-anchor="middle" font-size="18">(0.4 + 0.8) / 2</text>
    <text x="827" y="255" text-anchor="middle" font-size="25">0.6</text>
    <text x="480" y="382" text-anchor="middle" font-size="17">A raw mean would overweight the larger appearance block.</text>
  </g>
</svg>
