<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Dot product as signed projection and cosine as direction</title>
  <desc id="desc">A vector is projected onto another vector. The dot product combines the projected length and reference length, while cosine keeps only angular alignment.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Alignment is a shadow cast onto a direction</text>
  <g font-family="sans-serif" fill="#172b4d">
    <line x1="100" y1="315" x2="440" y2="315" stroke="#94a3b8" stroke-width="2"/>
    <line x1="130" y1="315" x2="390" y2="170" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="130" y1="315" x2="370" y2="315" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="390" y1="170" x2="390" y2="315" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="395" y="162" font-size="18" font-weight="700">x</text><text x="350" y="340" text-anchor="middle" font-size="18" font-weight="700">unit y direction</text>
    <text x="270" y="300" text-anchor="middle" font-size="16" fill="#92400e">signed projection</text>
    <rect x="520" y="95" width="385" height="245" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="712" y="135" text-anchor="middle" font-size="20" font-weight="700">What each quantity remembers</text>
    <text x="555" y="185" font-size="18" font-weight="700">Dot product</text><text x="555" y="215" font-size="16">alignment and both lengths</text>
    <text x="555" y="260" font-size="18" font-weight="700">Cosine similarity</text><text x="555" y="290" font-size="16">alignment after lengths are removed</text>
    <rect x="160" y="370" width="640" height="40" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="480" y="396" text-anchor="middle" font-size="16">Positive: same general direction | zero: perpendicular | negative: opposing</text>
  </g>
</svg>
