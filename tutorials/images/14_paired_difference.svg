<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Paired differences remove participant baselines</title>
  <desc id="desc">Each participant has a before and after value connected by a line, and the analysis uses within-participant differences.</desc>
  <defs><marker id="a14p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Pair first, then analyze one difference per participant</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="55" y="85" width="520" height="275" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="185" y="125" text-anchor="middle" font-size="18" font-weight="700">Before</text><text x="445" y="125" text-anchor="middle" font-size="18" font-weight="700">After</text>
    <g stroke="#94a3b8" stroke-width="3"><line x1="185" y1="175" x2="445" y2="145"/><line x1="185" y1="225" x2="445" y2="190"/><line x1="185" y1="275" x2="445" y2="250"/><line x1="185" y1="325" x2="445" y2="285"/></g>
    <g fill="#2563eb"><circle cx="185" cy="175" r="9"/><circle cx="185" cy="225" r="9"/><circle cx="185" cy="275" r="9"/><circle cx="185" cy="325" r="9"/></g>
    <g fill="#16a34a"><circle cx="445" cy="145" r="9"/><circle cx="445" cy="190" r="9"/><circle cx="445" cy="250" r="9"/><circle cx="445" cy="285" r="9"/></g>
    <path d="M590 222 H665" stroke="#475569" stroke-width="3" marker-end="url(#a14p)"/>
    <rect x="675" y="110" width="230" height="225" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="790" y="150" text-anchor="middle" font-size="19" font-weight="700">Difference vector</text>
    <text x="790" y="195" text-anchor="middle" font-size="18">d = after - before</text>
    <text x="790" y="240" text-anchor="middle" font-size="18">one d per person</text>
    <text x="790" y="285" text-anchor="middle" font-size="17">baseline cancels</text>
    <text x="480" y="395" text-anchor="middle" font-size="17">The participant, not the row, is the unit of analysis.</text>
  </g>
</svg>
