<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Permute and reshape do different things to the same values</title>
  <desc id="desc">A two by three source tensor holding zero through five is transformed two ways. Permute swaps the axes so each value keeps its coordinates, while reshape regroups the same memory order into three rows of two.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Two ways to change a shape, only one moves values</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="140" y="95" text-anchor="middle" font-size="18" font-weight="700">Source (2, 3)</text>
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="2">
      <rect x="47" y="115" width="62" height="52"/><rect x="109" y="115" width="62" height="52"/><rect x="171" y="115" width="62" height="52"/>
      <rect x="47" y="167" width="62" height="52"/><rect x="109" y="167" width="62" height="52"/><rect x="171" y="167" width="62" height="52"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="78" y="147">0</text><text x="140" y="147">1</text><text x="202" y="147">2</text>
      <text x="78" y="199">3</text><text x="140" y="199">4</text><text x="202" y="199">5</text>
    </g>

    <path d="M245 167 H360" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M140 226 V345 H600 V193 H698" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="440" y="95" text-anchor="middle" font-size="18" font-weight="700">permute(1, 0)</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="378" y="115" width="62" height="52"/><rect x="440" y="115" width="62" height="52"/>
      <rect x="378" y="167" width="62" height="52"/><rect x="440" y="167" width="62" height="52"/>
      <rect x="378" y="219" width="62" height="52"/><rect x="440" y="219" width="62" height="52"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="409" y="147">0</text><text x="471" y="147">3</text>
      <text x="409" y="199">1</text><text x="471" y="199">4</text>
      <text x="409" y="251">2</text><text x="471" y="251">5</text>
    </g>
    <text x="440" y="300" text-anchor="middle" font-size="15">values keep their coordinates</text>

    <text x="770" y="95" text-anchor="middle" font-size="18" font-weight="700">reshape(3, 2)</text>
    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
      <rect x="708" y="115" width="62" height="52"/><rect x="770" y="115" width="62" height="52"/>
      <rect x="708" y="167" width="62" height="52"/><rect x="770" y="167" width="62" height="52"/>
      <rect x="708" y="219" width="62" height="52"/><rect x="770" y="219" width="62" height="52"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="739" y="147">0</text><text x="801" y="147">1</text>
      <text x="739" y="199">2</text><text x="801" y="199">3</text>
      <text x="739" y="251">4</text><text x="801" y="251">5</text>
    </g>
    <text x="770" y="300" text-anchor="middle" font-size="15">values keep their memory order</text>

    <rect x="150" y="358" width="660" height="60" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="394" text-anchor="middle" font-size="17">permute relabels axes; reshape redraws the grouping</text>
  </g>
</svg>
