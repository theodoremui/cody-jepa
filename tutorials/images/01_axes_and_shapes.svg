<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">The five axes of a video batch</title>
  <desc id="desc">A batch contains videos, each video contains color channels, each channel contains frames, and each frame has rows and columns.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Read a video tensor from the outside inward</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="38" y="110" width="145" height="190" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="145" text-anchor="middle" font-size="19" font-weight="700">Batch B</text>
    <rect x="65" y="170" width="72" height="55" rx="8" fill="#93c5fd"/><rect x="78" y="186" width="72" height="55" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="110" y="270" text-anchor="middle" font-size="15">separate clips</text>
    <path d="M188 205 H228" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="236" y="110" width="145" height="190" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="308" y="145" text-anchor="middle" font-size="19" font-weight="700">Channels C</text>
    <circle cx="278" cy="205" r="24" fill="#ef4444"/><circle cx="309" cy="205" r="24" fill="#22c55e" fill-opacity=".8"/><circle cx="340" cy="205" r="24" fill="#3b82f6" fill-opacity=".8"/>
    <text x="308" y="270" text-anchor="middle" font-size="15">red, green, blue</text>
    <path d="M386 205 H426" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="434" y="110" width="145" height="190" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="506" y="145" text-anchor="middle" font-size="19" font-weight="700">Time T</text>
    <rect x="463" y="174" width="60" height="48" fill="#86efac"/><rect x="476" y="187" width="60" height="48" fill="#bbf7d0" stroke="#16a34a"/><rect x="489" y="200" width="60" height="48" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="506" y="270" text-anchor="middle" font-size="15">ordered frames</text>
    <path d="M584 205 H624" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="632" y="110" width="290" height="190" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="777" y="145" text-anchor="middle" font-size="19" font-weight="700">Image plane H by W</text>
    <g stroke="#d97706" stroke-width="1"><rect x="700" y="168" width="154" height="92" fill="#fefce8"/><path d="M738 168 V260 M777 168 V260 M815 168 V260 M700 199 H854 M700 230 H854"/></g>
    <circle cx="815" cy="230" r="8" fill="#f97316"/>
    <text x="777" y="285" text-anchor="middle" font-size="15">row h, column w</text>
    <rect x="170" y="342" width="620" height="56" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="480" y="376" text-anchor="middle" font-size="18">x[b, c, t, h, w] selects one measured intensity</text>
  </g>
</svg>
