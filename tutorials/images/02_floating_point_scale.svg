<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Finite floating point scale and stable computation</title>
  <desc id="desc">A number line shows underflow, a useful finite range, and overflow, followed by three practices for stable vector calculations.</desc>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Computers store a sparse map of the real number line</text>
  <g font-family="sans-serif" fill="#172b4d">
    <line x1="90" y1="145" x2="870" y2="145" stroke="#475569" stroke-width="4"/>
    <rect x="90" y="117" width="190" height="56" fill="#fee2e2"/><rect x="280" y="117" width="400" height="56" fill="#dcfce7"/><rect x="680" y="117" width="190" height="56" fill="#fee2e2"/>
    <text x="185" y="102" text-anchor="middle" font-size="17" font-weight="700">underflow toward zero</text><text x="480" y="102" text-anchor="middle" font-size="17" font-weight="700">finite representable values</text><text x="775" y="102" text-anchor="middle" font-size="17" font-weight="700">overflow to infinity</text>
    <text x="480" y="205" text-anchor="middle" font-size="16">Spacing grows with magnitude, so precision is relative rather than uniform.</text>
    <rect x="70" y="255" width="245" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="192" y="292" text-anchor="middle" font-size="18" font-weight="700">Scale safely</text><text x="192" y="325" text-anchor="middle" font-size="16">use library norm routines</text><text x="192" y="350" text-anchor="middle" font-size="16">or higher precision</text>
    <rect x="357" y="255" width="245" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="479" y="292" text-anchor="middle" font-size="18" font-weight="700">Define edge cases</text><text x="479" y="325" text-anchor="middle" font-size="16">zero norm needs a policy</text><text x="479" y="350" text-anchor="middle" font-size="16">epsilon changes semantics</text>
    <rect x="645" y="255" width="245" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="767" y="292" text-anchor="middle" font-size="18" font-weight="700">Test approximately</text><text x="767" y="325" text-anchor="middle" font-size="16">choose absolute and</text><text x="767" y="350" text-anchor="middle" font-size="16">relative tolerances</text>
  </g>
</svg>
