<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Attention block with positional representations</title>
  <desc id="desc">Tokens plus sinusoidal positions are projected to queries, keys, and values, split into heads for scaled dot-product attention, then passed through residual and feed-forward paths.</desc>
  <defs><marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Attention and positional representations</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="40" y="120" width="160" height="145" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="120" y="158" text-anchor="middle" font-size="18" font-weight="700">Token + position</text>
    <text x="120" y="198" text-anchor="middle" font-size="16">X: (B, N, D)</text>
    <text x="120" y="228" text-anchor="middle" font-size="16">sin / cos</text>
    <path d="M205 192 H270" stroke="#52606d" stroke-width="3" marker-end="url(#a4)"/>
    <rect x="278" y="90" width="205" height="205" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="128" text-anchor="middle" font-size="18" font-weight="700">Q, K, V projections</text>
    <text x="380" y="172" text-anchor="middle" font-size="17">Q = X W_Q</text>
    <text x="380" y="207" text-anchor="middle" font-size="17">K = X W_K</text>
    <text x="380" y="242" text-anchor="middle" font-size="17">V = X W_V</text>
    <path d="M488 192 H553" stroke="#52606d" stroke-width="3" marker-end="url(#a4)"/>
    <rect x="561" y="90" width="170" height="205" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="646" y="119" text-anchor="middle" font-size="18" font-weight="700">Multi-head</text>
    <text x="646" y="143" text-anchor="middle" font-size="18" font-weight="700">attention</text>
    <text x="646" y="180" text-anchor="middle" font-size="16">split D into H heads</text>
    <text x="646" y="215" text-anchor="middle" font-size="16">scaled dot product</text>
    <text x="646" y="250" text-anchor="middle" font-size="16">softmax, mix, join</text>
    <path d="M736 192 H796" stroke="#52606d" stroke-width="3" marker-end="url(#a4)"/>
    <rect x="804" y="90" width="125" height="205" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="866" y="128" text-anchor="middle" font-size="18" font-weight="700">Block</text>
    <text x="866" y="170" text-anchor="middle" font-size="16">residual</text>
    <text x="866" y="202" text-anchor="middle" font-size="16">LayerNorm</text>
    <text x="866" y="234" text-anchor="middle" font-size="16">GELU MLP</text>
    <rect x="200" y="335" width="560" height="50" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="480" y="367" text-anchor="middle" font-size="17">Scale logits and mask before softmax for stable, valid weights</text>
  </g>
</svg>
