<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">The same five blocks seen unpaired and paired</title>
  <desc id="desc">Unpaired, the two conditions form heavily overlapping clouds because blocks differ in level, but the within-block differences are tightly clustered above zero.</desc>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Pairing removes the level differences between blocks</text>

    <rect x="45" y="80" width="420" height="300" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="255" y="118" text-anchor="middle" font-size="18" font-weight="700">Unpaired: two clouds</text>
    <text x="160" y="152" text-anchor="middle" font-size="16">condition A</text>
    <text x="350" y="152" text-anchor="middle" font-size="16">condition B</text>
    <g fill="#2563eb"><circle cx="160" cy="192" r="9"/><circle cx="160" cy="227" r="9"/><circle cx="160" cy="267" r="9"/><circle cx="160" cy="302" r="9"/><circle cx="160" cy="337" r="9"/></g>
    <g fill="#d97706"><circle cx="350" cy="177" r="9"/><circle cx="350" cy="212" r="9"/><circle cx="350" cy="252" r="9"/><circle cx="350" cy="287" r="9"/><circle cx="350" cy="322" r="9"/></g>

    <rect x="495" y="80" width="420" height="300" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="705" y="118" text-anchor="middle" font-size="18" font-weight="700">Paired: one value each</text>
    <text x="705" y="182" text-anchor="middle" font-size="16">all five differences agree</text>
    <g fill="#7c3aed"><circle cx="580" cy="245" r="9"/><circle cx="640" cy="235" r="9"/><circle cx="700" cy="250" r="9"/><circle cx="760" cy="238" r="9"/><circle cx="820" cy="243" r="9"/></g>
    <line x1="540" y1="300" x2="880" y2="300" stroke="#52606d" stroke-width="3"/>
    <text x="705" y="336" text-anchor="middle" font-size="16">zero difference</text>

    <text x="255" y="412" text-anchor="middle" font-size="16">the spread is block level</text>
    <text x="705" y="412" text-anchor="middle" font-size="16">the spread is the effect</text>
    <text x="480" y="446" text-anchor="middle" font-size="16" fill="#52606d">Both panels show the same five blocks measured in the same two conditions.</text>
  </g>
</svg>
