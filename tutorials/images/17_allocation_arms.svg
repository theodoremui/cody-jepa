<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Three allocation arms reaching one nominal catalog size</title>
  <desc id="desc">Breadth, balanced, and phase depth trade sequence count against origins per sequence, and all three arrive at the same nominal catalog of 250,000 sequence-origin atoms with the same planned recurrence.</desc>
  <defs>
    <marker id="a17a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Three arms, one nominal catalog size</text>

    <rect x="50" y="80" width="340" height="86" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="72" y="112" font-size="18" font-weight="700">Breadth</text>
    <text x="72" y="142" font-size="15">250,000 sequences, 1 origin each</text>

    <rect x="50" y="190" width="340" height="86" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="72" y="222" font-size="18" font-weight="700">Balanced</text>
    <text x="72" y="252" font-size="15">125,000 sequences, 2 origins each</text>

    <rect x="50" y="300" width="340" height="86" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="72" y="332" font-size="18" font-weight="700">Phase depth</text>
    <text x="72" y="362" font-size="15">62,500 sequences, 4 origins each</text>

    <path d="M394 123 L552 196" stroke="#52606d" stroke-width="3" marker-end="url(#a17a)"/>
    <path d="M394 233 L552 233" stroke="#52606d" stroke-width="3" marker-end="url(#a17a)"/>
    <path d="M394 343 L552 270" stroke="#52606d" stroke-width="3" marker-end="url(#a17a)"/>

    <rect x="560" y="150" width="350" height="166" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="735" y="196" text-anchor="middle" font-size="20" font-weight="700">U times k = 250,000</text>
    <text x="735" y="234" text-anchor="middle" font-size="16">sequence-origin atoms</text>
    <text x="735" y="262" text-anchor="middle" font-size="16">offered to every model</text>
    <text x="735" y="294" text-anchor="middle" font-size="15">recurrence = clips divided by 250,000</text>

    <text x="480" y="410" text-anchor="middle" font-size="16" fill="#52606d">Equal counts are a control, not a claim that the atoms carry equal information.</text>
  </g>
</svg>
