<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">A Cartesian product creates factorial cells</title>
  <desc id="desc">Three binary factors combine independently to create eight possible experimental cells.</desc>
  <defs><marker id="a11c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Independent choices multiply the state space</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="45" y="95" width="190" height="220" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="132" text-anchor="middle" font-size="19" font-weight="700">Lighting</text>
    <text x="140" y="190" text-anchor="middle" font-size="17">day</text><text x="140" y="245" text-anchor="middle" font-size="17">night</text>
    <text x="140" y="288" text-anchor="middle" font-size="16">2 choices</text>
    <text x="267" y="214" text-anchor="middle" font-size="28">×</text>
    <rect x="300" y="95" width="190" height="220" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="395" y="132" text-anchor="middle" font-size="19" font-weight="700">View</text>
    <text x="395" y="190" text-anchor="middle" font-size="17">front</text><text x="395" y="245" text-anchor="middle" font-size="17">side</text>
    <text x="395" y="288" text-anchor="middle" font-size="16">2 choices</text>
    <text x="522" y="214" text-anchor="middle" font-size="28">×</text>
    <rect x="555" y="95" width="190" height="220" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="650" y="132" text-anchor="middle" font-size="19" font-weight="700">Speed</text>
    <text x="650" y="190" text-anchor="middle" font-size="17">slow</text><text x="650" y="245" text-anchor="middle" font-size="17">fast</text>
    <text x="650" y="288" text-anchor="middle" font-size="16">2 choices</text>
    <path d="M755 205 H810" stroke="#475569" stroke-width="3" marker-end="url(#a11c)"/>
    <rect x="820" y="125" width="105" height="160" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="872" y="175" text-anchor="middle" font-size="18" font-weight="700">8 cells</text>
    <text x="872" y="215" text-anchor="middle" font-size="17">2 × 2 × 2</text>
    <text x="872" y="250" text-anchor="middle" font-size="16">all tuples</text>
    <text x="480" y="370" text-anchor="middle" font-size="17">A cell is one complete assignment, such as (night, side, fast).</text>
  </g>
</svg>
