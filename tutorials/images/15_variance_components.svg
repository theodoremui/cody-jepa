<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Variance is shared across nested levels</title>
  <desc id="desc">An observed measurement is decomposed into a grand mean, participant deviation, session deviation, and residual variation.</desc>
  <defs><marker id="a15v" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">One row contains variation from several levels</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="55" y="125" width="170" height="165" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="140" y="168" text-anchor="middle" font-size="19" font-weight="700">Observed value</text><text x="140" y="225" text-anchor="middle" font-size="24">y</text>
    <path d="M235 207 H300" stroke="#475569" stroke-width="3" marker-end="url(#a15v)"/>
    <rect x="310" y="85" width="595" height="245" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="335" y="120" width="125" height="165" rx="12" fill="#dbeafe"/><text x="397" y="165" text-anchor="middle" font-size="18" font-weight="700">Grand mean</text><text x="397" y="220" text-anchor="middle" font-size="22">mu</text>
    <text x="480" y="215" text-anchor="middle" font-size="24">+</text>
    <rect x="505" y="120" width="125" height="165" rx="12" fill="#dcfce7"/><text x="567" y="160" text-anchor="middle" font-size="18" font-weight="700">Participant</text><text x="567" y="185" text-anchor="middle" font-size="18" font-weight="700">effect</text><text x="567" y="235" text-anchor="middle" font-size="22">a</text>
    <text x="650" y="215" text-anchor="middle" font-size="24">+</text>
    <rect x="675" y="120" width="100" height="165" rx="12" fill="#fef3c7"/><text x="725" y="160" text-anchor="middle" font-size="18" font-weight="700">Session</text><text x="725" y="185" text-anchor="middle" font-size="18" font-weight="700">effect</text><text x="725" y="235" text-anchor="middle" font-size="22">b</text>
    <text x="795" y="215" text-anchor="middle" font-size="24">+</text>
    <rect x="820" y="120" width="60" height="165" rx="12" fill="#fee2e2"/><text x="850" y="174" text-anchor="middle" font-size="16">noise</text><text x="850" y="235" text-anchor="middle" font-size="22">e</text>
    <text x="480" y="375" text-anchor="middle" font-size="17">Rows sharing a participant also share the same participant effect.</text>
  </g>
</svg>
