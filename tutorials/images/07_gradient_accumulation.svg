<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Gradient accumulation reproduces a larger batch mean</title>
  <desc id="desc">Four microbatch mean losses are each divided by four, accumulated in one gradient buffer, and followed by one optimizer update.</desc>
  <defs><marker id="a07g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#425466"/></marker></defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Four microbatches, one effective-batch update</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="88" width="262" height="258" rx="16" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
    <text x="173" y="124" text-anchor="middle" font-size="20" font-weight="700" fill="#1b4f72">Microbatch means</text>
    <g font-size="17" fill="#1b4f72" text-anchor="middle"><rect x="78" y="148" width="190" height="36" rx="8" fill="#b3d9ee"/><text x="173" y="172">loss 1 / 4</text><rect x="78" y="196" width="190" height="36" rx="8" fill="#b3d9ee"/><text x="173" y="220">loss 2 / 4</text><rect x="78" y="244" width="190" height="36" rx="8" fill="#b3d9ee"/><text x="173" y="268">loss 3 / 4</text><rect x="78" y="292" width="190" height="36" rx="8" fill="#b3d9ee"/><text x="173" y="316">loss 4 / 4</text></g>
    <line x1="316" y1="217" x2="392" y2="217" stroke="#425466" stroke-width="3" marker-end="url(#a07g)"/>
    <rect x="408" y="118" width="222" height="198" rx="16" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
    <text x="519" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#633974">Gradient buffer</text>
    <text x="519" y="208" text-anchor="middle" font-size="19" fill="#633974">g = (g1 + g2</text>
    <text x="519" y="238" text-anchor="middle" font-size="19" fill="#633974">+ g3 + g4) / 4</text>
    <text x="519" y="282" text-anchor="middle" font-size="17" fill="#633974">clear once per update</text>
    <line x1="642" y1="217" x2="718" y2="217" stroke="#425466" stroke-width="3" marker-end="url(#a07g)"/>
    <rect x="734" y="145" width="184" height="144" rx="16" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="826" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#145a4a">Optimizer step</text>
    <text x="826" y="231" text-anchor="middle" font-size="18" fill="#145a4a">one update</text>
    <text x="826" y="263" text-anchor="middle" font-size="17" fill="#145a4a">effective batch = 4M</text>
    <text x="480" y="386" text-anchor="middle" font-size="18" fill="#425466">Without division by four, the accumulated gradient is four times too large.</text>
  </g>
</svg>
