<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 448" width="750" height="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="749" height="447" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="38" font-size="16.5" font-weight="600" fill="#0f172a">Four proposals, three audiences</text>
  <text x="28" y="59" font-size="11" fill="#64748b">How strongly each direction serves each destination</text>

  <text x="470" y="96" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">ICLR 2027</text>
  <text x="470" y="111" font-size="10" fill="#94a3b8" text-anchor="middle">due Sep 25, 2026</text>

  <text x="586" y="96" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Stanford HAI</text>
  <text x="586" y="111" font-size="10" fill="#94a3b8" text-anchor="middle">ambient</text>

  <text x="694" y="96" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">Delp lab</text>
  <text x="694" y="111" font-size="10" fill="#94a3b8" text-anchor="middle">balance</text>

  <line x1="28" y1="125" x2="722" y2="125" stroke="#e2e8f0"/>

  <text x="28" y="158" font-size="12.5" font-weight="600" fill="#0f172a">1 &#183; The readout problem</text>
  <text x="28" y="176" font-size="10.5" fill="#64748b">The health metric and the probe both miss</text>
  <circle cx="470" cy="164" r="8.5" fill="#2563eb"/>
  <circle cx="586" cy="164" r="8.5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
