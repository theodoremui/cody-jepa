  <circle cx="694" cy="164" r="8.5" fill="none" stroke="#059669" stroke-width="1.6"/>

  <line x1="28" y1="194" x2="722" y2="194" stroke="#f1f5f9"/>

  <text x="28" y="227" font-size="12.5" font-weight="600" fill="#0f172a">2 &#183; Paired-condition geometry</text>
  <text x="28" y="245" font-size="10.5" fill="#64748b">Are changes transportable and composable</text>
  <circle cx="470" cy="233" r="8.5" fill="#2563eb"/>
  <path d="M 586 224.5 a 8.5 8.5 0 0 1 0 17 z" fill="#7c3aed"/>
  <circle cx="586" cy="233" r="8.5" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <path d="M 694 224.5 a 8.5 8.5 0 0 1 0 17 z" fill="#059669"/>
  <circle cx="694" cy="233" r="8.5" fill="none" stroke="#059669" stroke-width="1.6"/>

  <line x1="28" y1="263" x2="722" y2="263" stroke="#f1f5f9"/>

  <text x="28" y="296" font-size="12.5" font-weight="600" fill="#0f172a">3 &#183; Minimum sufficient state</text>
  <text x="28" y="314" font-size="10.5" fill="#64748b">How little must you observe to predict well</text>
  <path d="M 470 293.5 a 8.5 8.5 0 0 1 0 17 z" fill="#2563eb"/>
  <circle cx="470" cy="302" r="8.5" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <path d="M 586 293.5 a 8.5 8.5 0 0 1 0 17 z" fill="#7c3aed"/>
  <circle cx="586" cy="302" r="8.5" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="694" cy="302" r="8.5" fill="#059669"/>

  <line x1="28" y1="332" x2="722" y2="332" stroke="#f1f5f9"/>

  <text x="28" y="365" font-size="12.5" font-weight="600" fill="#0f172a">4 &#183; Personal baseline, contained</text>
  <text x="28" y="383" font-size="10.5" fill="#64748b">Keep identity local, send only the change</text>
  <circle cx="470" cy="371" r="8.5" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="586" cy="371" r="8.5" fill="#7c3aed"/>
  <path d="M 694 362.5 a 8.5 8.5 0 0 1 0 17 z" fill="#059669"/>
  <circle cx="694" cy="371" r="8.5" fill="none" stroke="#059669" stroke-width="1.6"/>

  <line x1="28" y1="401" x2="722" y2="401" stroke="#e2e8f0"/>

  <circle cx="36" cy="424" r="6.5" fill="#475569"/>
  <text x="48" y="428" font-size="10.5" fill="#64748b">primary home</text>

  <path d="M 180 417.5 a 6.5 6.5 0 0 1 0 13 z" fill="#475569"/>
