  <text x="192" y="428" font-size="10.5" fill="#64748b">strong secondary fit</text>

  <circle cx="352" cy="424" r="6.5" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="364" y="428" font-size="10.5" fill="#64748b">useful, not the natural home</text>
