<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Row split leakage compared with group-disjoint splitting</title>
  <desc id="desc">A row split places clips from the same people in training and test, while a group split assigns each person to only one partition.</desc>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">What does the test set hold out?</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="82" width="414" height="284" rx="16" fill="#fbe9e7" stroke="#c75b4b" stroke-width="2"/>
    <text x="249" y="120" text-anchor="middle" font-size="21" font-weight="700" fill="#7b241c">Row split: groups leak</text>
    <text x="145" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7b241c">Train clips</text><text x="352" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#7b241c">Test clips</text>
    <g font-size="17" text-anchor="middle"><rect x="72" y="174" width="146" height="42" rx="8" fill="#f7c6bf"/><text x="145" y="201" fill="#7b241c">person A, clip 1</text><rect x="72" y="228" width="146" height="42" rx="8" fill="#f7c6bf"/><text x="145" y="255" fill="#7b241c">person B, clip 1</text><rect x="279" y="174" width="146" height="42" rx="8" fill="#f7c6bf"/><text x="352" y="201" fill="#7b241c">person A, clip 2</text><rect x="279" y="228" width="146" height="42" rx="8" fill="#f7c6bf"/><text x="352" y="255" fill="#7b241c">person B, clip 2</text></g>
    <path d="M145 278 C185 330 312 330 352 278" fill="none" stroke="#c75b4b" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="249" y="340" text-anchor="middle" font-size="17" fill="#7b241c">shared identity and acquisition artifacts</text>
    <rect x="504" y="82" width="414" height="284" rx="16" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="711" y="120" text-anchor="middle" font-size="21" font-weight="700" fill="#145a4a">Group split: unseen people</text>
    <text x="607" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#145a4a">Train groups</text><text x="814" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#145a4a">Test groups</text>
    <rect x="534" y="178" width="146" height="90" rx="10" fill="#91cfbf"/><text x="607" y="215" text-anchor="middle" font-size="17" fill="#145a4a">person A</text><text x="607" y="244" text-anchor="middle" font-size="16" fill="#145a4a">all clips</text>
    <rect x="741" y="178" width="146" height="90" rx="10" fill="#b8e3d7"/><text x="814" y="215" text-anchor="middle" font-size="17" fill="#145a4a">person B</text><text x="814" y="244" text-anchor="middle" font-size="16" fill="#145a4a">all clips</text>
    <line x1="711" y1="169" x2="711" y2="290" stroke="#27896f" stroke-width="3"/>
    <text x="711" y="334" text-anchor="middle" font-size="17" fill="#145a4a">empty group intersection</text>
    <text x="480" y="398" text-anchor="middle" font-size="17" fill="#425466">Choose the group key from the claim you want the test score to support.</text>
  </g>
</svg>
