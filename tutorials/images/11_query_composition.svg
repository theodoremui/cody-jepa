<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">A composed GFC-v2 query takes every block from donors and none from the target</title>
  <desc id="desc">Two donor recordings feed the composed query: donor u supplies the focal speed block and donor v supplies the clothing and direction blocks. The target recording is held out of the query and only names the correct gallery row.</desc>
  <defs>
    <marker id="a11q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">The target supplies the answer, never the query</text>

    <rect x="50" y="100" width="300" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="70" y="134" font-size="17" font-weight="700" fill="#1d4ed8">donor u = (1, 1, 0)</text>
    <text x="70" y="162" font-size="15" fill="#172b4d">gives the speed block</text>

    <rect x="50" y="214" width="300" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="70" y="248" font-size="17" font-weight="700" fill="#1d4ed8">donor v = (0, 0, 1)</text>
    <text x="70" y="276" font-size="15" fill="#172b4d">gives the other two blocks</text>

    <rect x="50" y="328" width="300" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="70" y="362" font-size="17" font-weight="700" fill="#b45309">target x = (1, 0, 1)</text>
    <text x="70" y="390" font-size="15" fill="#172b4d">supplies no query features</text>

    <rect x="560" y="140" width="350" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="580" y="178" font-size="17" font-weight="700" fill="#166534">query = (1, 0, 1)</text>
    <text x="580" y="206" font-size="15" fill="#172b4d">speed block from u</text>
    <text x="580" y="232" font-size="15" fill="#172b4d">clothing and direction from v</text>

    <rect x="560" y="330" width="350" height="90" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="580" y="366" font-size="17" font-weight="700" fill="#172b4d">answer key</text>
    <text x="580" y="394" font-size="15" fill="#172b4d">names the correct gallery row</text>

    <g stroke="#52606d" stroke-width="3" marker-end="url(#a11q)">
      <line x1="356" y1="145" x2="552" y2="178"/>
      <line x1="356" y1="259" x2="552" y2="222"/>
      <line x1="356" y1="373" x2="552" y2="373"/>
    </g>

    <text x="480" y="452" text-anchor="middle" font-size="15" fill="#52606d">Both donors must carry a different source video id from the target.</text>
  </g>
</svg>
