<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Enrollment centroids and held-out probes</title>
  <desc id="desc">Separate enrollment samples form identity centroids and held-out probe samples are assigned by nearest centroid.</desc>
  <defs><marker id="a13e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Enrollment builds references; probes test generalization</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="55" y="80" width="530" height="280" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <line x1="110" y1="320" x2="540" y2="320" stroke="#94a3b8" stroke-width="2"/><line x1="110" y1="320" x2="110" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#60a5fa"><circle cx="180" cy="245" r="8"/><circle cx="205" cy="220" r="8"/><circle cx="225" cy="258" r="8"/></g>
    <circle cx="203" cy="241" r="14" fill="#2563eb"/><text x="203" y="199" text-anchor="middle" font-size="16">centroid A</text>
    <g fill="#fbbf24"><circle cx="400" cy="180" r="8"/><circle cx="435" cy="155" r="8"/><circle cx="455" cy="200" r="8"/></g>
    <circle cx="430" cy="178" r="14" fill="#d97706"/><text x="430" y="133" text-anchor="middle" font-size="16">centroid B</text>
    <path d="M310 210 L223 236" stroke="#16a34a" stroke-width="3" marker-end="url(#a13e)"/><circle cx="310" cy="210" r="11" fill="#16a34a"/><text x="315" y="190" font-size="16">probe</text>
    <rect x="640" y="115" width="265" height="210" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="772" y="155" text-anchor="middle" font-size="19" font-weight="700">Valid evaluation</text>
    <text x="772" y="205" text-anchor="middle" font-size="17">enrollment samples</text><text x="772" y="233" text-anchor="middle" font-size="17">never serve as probes</text>
    <text x="772" y="280" text-anchor="middle" font-size="17">nearest centroid: A</text>
    <text x="480" y="395" text-anchor="middle" font-size="17">Separation prevents a sample from helping construct its own reference.</text>
  </g>
</svg>
