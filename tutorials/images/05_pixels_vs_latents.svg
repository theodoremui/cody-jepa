<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructing pixels compared with predicting latents</title>
  <desc id="desc">Both objectives start from the same visible context. Pixel reconstruction decodes back to input units and is scored against raw measurements. Latent prediction stays in feature space and is scored against target encoder features.</desc>
  <defs><marker id="pl05" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Same evidence, two different things to compare</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="40" y="72" width="420" height="356" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="110" text-anchor="middle" font-size="18" font-weight="700">Reconstruct the pixels</text>
    <rect x="70" y="132" width="360" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="250" y="166" text-anchor="middle" font-size="16">Visible context tokens</text>
    <path d="M250 191 V219" stroke="#52606d" stroke-width="3" marker-end="url(#pl05)"/>
    <rect x="70" y="224" width="360" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="250" y="256" text-anchor="middle" font-size="17" font-weight="700">Decoder</text>
    <text x="250" y="284" text-anchor="middle" font-size="15">maps back to input units</text>
    <path d="M250 303 V331" stroke="#52606d" stroke-width="3" marker-end="url(#pl05)"/>
    <rect x="70" y="336" width="360" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="250" y="368" text-anchor="middle" font-size="17" font-weight="700">Scored against raw pixels</text>
    <text x="250" y="396" text-anchor="middle" font-size="15">texture and sensor noise count</text>

    <rect x="500" y="72" width="420" height="356" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="710" y="110" text-anchor="middle" font-size="18" font-weight="700">Predict the latents</text>
    <rect x="530" y="132" width="360" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="710" y="166" text-anchor="middle" font-size="16">Visible context tokens</text>
    <path d="M710 191 V219" stroke="#52606d" stroke-width="3" marker-end="url(#pl05)"/>
    <rect x="530" y="224" width="360" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="710" y="256" text-anchor="middle" font-size="17" font-weight="700">Predictor</text>
    <text x="710" y="284" text-anchor="middle" font-size="15">stays in feature space</text>
    <path d="M710 303 V331" stroke="#52606d" stroke-width="3" marker-end="url(#pl05)"/>
    <rect x="530" y="336" width="360" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="710" y="368" text-anchor="middle" font-size="17" font-weight="700">Scored against features</text>
    <text x="710" y="396" text-anchor="middle" font-size="15">the target itself is learned</text>

    <text x="480" y="452" text-anchor="middle" font-size="15" fill="#52606d">A learned target can drop nuisance detail, but it can also become uninformative.</text>
  </g>
</svg>
