<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Nested observations, repeated exposure, and two dimensions of replication</title>
  <desc id="desc">Many frames nest within sequences and participants, repeated training exposure does not create new units, and participant and model replication support different claims.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Rows, exposures, and replications answer different questions</text>
    <rect x="38" y="82" width="290" height="276" rx="18" fill="#e8f1fb" stroke="#3b82b8" stroke-width="2"/>
    <text x="183" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#173f5f">Nested observations</text>
    <rect x="70" y="143" width="226" height="54" rx="10" fill="#ffffff" stroke="#69a7d0"/>
    <text x="183" y="177" text-anchor="middle" font-size="18" fill="#173f5f">participant</text>
    <line x1="183" y1="197" x2="183" y2="222" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="88" y="229" width="190" height="46" rx="10" fill="#ffffff" stroke="#69a7d0"/>
    <text x="183" y="258" text-anchor="middle" font-size="17" fill="#173f5f">sequences</text>
    <line x1="183" y1="275" x2="183" y2="296" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="183" y="326" text-anchor="middle" font-size="18" fill="#173f5f">many correlated frames</text>
    <line x1="338" y1="220" x2="408" y2="220" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="420" y="123" width="190" height="194" rx="18" fill="#fff3d6" stroke="#d89b21" stroke-width="2"/>
    <text x="515" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#744b00">Training exposure</text>
    <path d="M469 225 A47 47 0 1 1 515 268" fill="none" stroke="#d89b21" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="452" y="190" width="126" height="42" rx="9" fill="#fff3d6"/>
    <text x="515" y="218" text-anchor="middle" font-size="25" font-weight="700" fill="#744b00">20 epochs</text>
    <text x="515" y="292" text-anchor="middle" font-size="16" fill="#744b00">same units seen again</text>
    <line x1="620" y1="220" x2="690" y2="220" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="702" y="83" width="220" height="274" rx="18" fill="#e8f7ee" stroke="#3d9b67" stroke-width="2"/>
    <text x="812" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#165b36">Replication axes</text>
    <line x1="750" y1="292" x2="880" y2="292" stroke="#3d9b67" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="750" y1="292" x2="750" y2="160" stroke="#8057b5" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="780" cy="260" r="8" fill="#3d9b67"/><circle cx="820" cy="230" r="8" fill="#8057b5"/><circle cx="860" cy="184" r="8" fill="#3b82b8"/>
    <text x="815" y="324" text-anchor="middle" font-size="16" fill="#165b36">participants</text>
    <text x="735" y="185" text-anchor="end" font-size="16" fill="#4f2e78">model</text>
    <text x="735" y="205" text-anchor="end" font-size="16" fill="#4f2e78">seeds</text>
    <text x="480" y="392" text-anchor="middle" font-size="17" fill="#52606d">Rows and epochs do not replace replication on either declared axis.</text>
  </g>
</svg>
