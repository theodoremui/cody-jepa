<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Attention is a dictionary lookup with soft weights</title>
  <desc id="desc">A hard lookup gives weight one to the single matching key and returns that entry's value. Attention gives every key a positive weight that sums to one and returns a blend of all three values.</desc>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">A query reads a table of key and value pairs</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="40" y="76" width="420" height="336" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="114" text-anchor="middle" font-size="18" font-weight="700">Hard lookup: one key matches</text>
    <text x="100" y="150" text-anchor="middle" font-size="15" fill="#52606d">weight</text>
    <text x="100" y="190" text-anchor="middle" font-size="16">0</text>
    <text x="100" y="246" text-anchor="middle" font-size="16">1</text>
    <text x="100" y="302" text-anchor="middle" font-size="16">0</text>
    <rect x="150" y="162" width="280" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="192" text-anchor="middle" font-size="16">key 1 holds value v1</text>
    <rect x="150" y="218" width="280" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="248" text-anchor="middle" font-size="16">key 2 holds value v2</text>
    <rect x="150" y="274" width="280" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="304" text-anchor="middle" font-size="16">key 3 holds value v3</text>
    <rect x="100" y="340" width="300" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="250" y="374" text-anchor="middle" font-size="16">output = v2 exactly</text>

    <rect x="500" y="76" width="420" height="336" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="710" y="114" text-anchor="middle" font-size="18" font-weight="700">Attention: every key contributes</text>
    <text x="560" y="150" text-anchor="middle" font-size="15" fill="#52606d">weight</text>
    <text x="560" y="190" text-anchor="middle" font-size="16">0.2</text>
    <text x="560" y="246" text-anchor="middle" font-size="16">0.5</text>
    <text x="560" y="302" text-anchor="middle" font-size="16">0.3</text>
    <rect x="610" y="162" width="280" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="750" y="192" text-anchor="middle" font-size="16">key 1 holds value v1</text>
    <rect x="610" y="218" width="280" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="750" y="248" text-anchor="middle" font-size="16">key 2 holds value v2</text>
    <rect x="610" y="274" width="280" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="750" y="304" text-anchor="middle" font-size="16">key 3 holds value v3</text>
    <rect x="560" y="340" width="300" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="710" y="374" text-anchor="middle" font-size="16">output = 0.2 v1 + 0.5 v2 + 0.3 v3</text>

    <text x="480" y="440" text-anchor="middle" font-size="15" fill="#52606d">Both weight columns sum to one. Only the right column is differentiable in the query.</text>
  </g>
</svg>
