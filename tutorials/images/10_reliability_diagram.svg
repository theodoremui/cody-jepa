<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">A reliability diagram comparing predicted probability with observed frequency</title>
  <desc id="desc">A square plot has predicted probability on the horizontal axis and observed frequency on the vertical axis. A dashed diagonal marks perfect calibration. A schematic curve of five points falls below the diagonal, showing an overconfident model whose scores exceed the frequency actually observed.</desc>
  <rect width="960" height="440" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Calibration: predicted probability versus observed frequency</text>

    <text x="150" y="76" font-size="15" fill="#52606d">observed frequency</text>
    <g stroke="#52606d" stroke-width="3" stroke-linecap="round">
      <line x1="150" y1="90" x2="150" y2="350"/>
      <line x1="150" y1="350" x2="410" y2="350"/>
    </g>
    <line x1="150" y1="350" x2="410" y2="90" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>

    <polyline points="176,337 228,311 280,285 332,234 384,168" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#dc2626">
      <circle cx="176" cy="337" r="7"/>
      <circle cx="228" cy="311" r="7"/>
      <circle cx="280" cy="285" r="7"/>
      <circle cx="332" cy="234" r="7"/>
      <circle cx="384" cy="168" r="7"/>
    </g>
    <text x="392" y="200" font-size="15" font-weight="700" fill="#991b1b">overconfident model</text>

    <text x="140" y="96" text-anchor="end" font-size="15" fill="#52606d">1.0</text>
    <text x="140" y="356" text-anchor="end" font-size="15" fill="#52606d">0.0</text>
    <text x="150" y="374" text-anchor="middle" font-size="15" fill="#52606d">0.0</text>
    <text x="410" y="374" text-anchor="middle" font-size="15" fill="#52606d">1.0</text>
    <text x="280" y="398" text-anchor="middle" font-size="15" fill="#52606d">predicted probability</text>

    <rect x="540" y="110" width="390" height="205" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="562" y="146" font-size="17" font-weight="700" fill="#172b4d">Reading the diagram</text>
    <text x="562" y="180" font-size="15" fill="#52606d">dashed line: perfectly calibrated</text>
    <text x="562" y="206" font-size="15" fill="#52606d">dots below it: overconfident</text>
    <text x="562" y="232" font-size="15" fill="#52606d">dots above it: underconfident</text>
    <text x="562" y="262" font-size="15" fill="#52606d">report the count inside each bin</text>
    <text x="562" y="288" font-size="15" fill="#52606d">accuracy cannot show this</text>

    <text x="480" y="418" text-anchor="middle" font-size="15" fill="#52606d">The curve is a schematic shape, not a measured result.</text>
  </g>
</svg>
