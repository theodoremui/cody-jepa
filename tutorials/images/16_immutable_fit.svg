<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Ownership and immutability of a fitted NumPy array</title>
  <desc id="desc">A caller array is copied into fitted state, marked read-only, and then used by a transform without retaining a writable alias.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="900" height="330" rx="22" fill="#f7fafc"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#243b53">A frozen wrapper needs owned, read-only memory</text>
  <g font-family="sans-serif">
    <rect x="54" y="88" width="210" height="160" rx="16" fill="#fff4df" stroke="#c8841b" stroke-width="2"/>
    <text x="159" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#8a5a10">Caller array</text>
    <rect x="94" y="144" width="130" height="58" rx="8" fill="#ffffff" stroke="#d9a441"/>
    <text x="159" y="178" text-anchor="middle" font-family="monospace" font-size="15" fill="#334e68">writable=True</text>
    <text x="159" y="228" text-anchor="middle" font-size="14" fill="#52606d">caller may mutate</text>
    <rect x="345" y="72" width="220" height="194" rx="16" fill="#e8f5e9" stroke="#4d8b57" stroke-width="2"/>
    <text x="455" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#2f6b3a">Fitted object</text>
    <text x="455" y="140" text-anchor="middle" font-size="14" fill="#334e68">np.array(copy=True)</text>
    <rect x="390" y="158" width="130" height="58" rx="8" fill="#ffffff" stroke="#70a879"/>
    <text x="455" y="192" text-anchor="middle" font-family="monospace" font-size="15" fill="#334e68">write=False</text>
    <text x="455" y="242" text-anchor="middle" font-size="14" fill="#52606d">fit owns storage</text>
    <rect x="650" y="88" width="196" height="160" rx="16" fill="#e3f2fd" stroke="#367cad" stroke-width="2"/>
    <text x="748" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">Transform</text>
    <text x="748" y="158" text-anchor="middle" font-size="14" fill="#334e68">reads parameters</text>
    <text x="748" y="184" text-anchor="middle" font-size="14" fill="#334e68">returns new result</text>
    <text x="748" y="222" text-anchor="middle" font-size="14" fill="#52606d">no writable view</text>
  </g>
  <g stroke="#52606d" stroke-width="3" marker-end="url(#arrow)">
    <path d="M270 168 H337"/>
    <path d="M571 168 H642"/>
  </g>
  <text x="303" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#52606d">copy</text>
</svg>
