<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">The iso-catalog method from corpus to paired contrast</title>
  <desc id="desc">Five numbered stages run from a common eligible video corpus, through nested phase-origin selection, to twenty-eight trained models, then to matched GFC-v2 and completion scoring, and finally to eight paired block contrasts.</desc>
  <defs>
    <marker id="a17f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fbfaf7"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">From a prepared corpus to one paired contrast</text>

    <rect x="40" y="80" width="270" height="150" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="114" font-size="17" font-weight="700">1. Common corpus</text>
    <text x="60" y="146" font-size="15">stride period and confidence</text>
    <text x="60" y="172" font-size="15">one eligibility rule</text>
    <text x="60" y="198" font-size="15">source and duplicate groups</text>
    <path d="M314 155 H341" stroke="#52606d" stroke-width="3" marker-end="url(#a17f)"/>

    <rect x="345" y="80" width="270" height="150" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="365" y="114" font-size="17" font-weight="700">2. Phase origins</text>
    <text x="365" y="146" font-size="15">base phase by stable hash</text>
    <text x="365" y="172" font-size="15">nested 1, 2, and 4 origins</text>
    <text x="365" y="198" font-size="15">audited before training</text>
    <path d="M619 155 H646" stroke="#52606d" stroke-width="3" marker-end="url(#a17f)"/>

    <rect x="650" y="80" width="270" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="670" y="114" font-size="17" font-weight="700">3. Trained models</text>
    <text x="670" y="146" font-size="15">8 blocks of 3 allocations</text>
    <text x="670" y="172" font-size="15">plus 4 jitter models</text>
    <text x="670" y="198" font-size="15">one fixed clip exposure</text>

    <path d="M785 234 V262 H240 V282" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#a17f)"/>

    <rect x="40" y="290" width="400" height="150" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="324" font-size="17" font-weight="700">4. Matched scoring</text>
    <text x="60" y="356" font-size="15">GFC-v2 eight-item gallery</text>
    <text x="60" y="382" font-size="15">same gallery for completion</text>
    <text x="60" y="408" font-size="15">margin, with top-1 and MRR</text>
    <path d="M444 365 H476" stroke="#52606d" stroke-width="3" marker-end="url(#a17f)"/>

    <rect x="480" y="290" width="440" height="150" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="500" y="324" font-size="17" font-weight="700">5. Paired contrast</text>
    <text x="500" y="356" font-size="15">D = GFC margin minus completion</text>
    <text x="500" y="382" font-size="15">P = D at phase depth minus D at breadth</text>
    <text x="500" y="408" font-size="15">eight P values, one per block</text>

    <text x="480" y="478" text-anchor="middle" font-size="16" fill="#52606d">Every stage is frozen before any outcome is opened.</text>
  </g>
</svg>
