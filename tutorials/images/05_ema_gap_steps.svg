<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">An exponential moving average closes a fixed fraction of the gap</title>
  <desc id="desc">One target parameter starts at two while the online parameter sits at six. With momentum three quarters, each update moves the target a quarter of the remaining distance, giving three, then three point seven five, then four point three one.</desc>
  <defs><marker id="em05" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
  <rect width="960" height="400" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">The target chases the online value one quarter at a time</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="94" text-anchor="middle" font-size="17">One parameter, momentum tau = 0.75, online value held at 6.00</text>
    <line x1="120" y1="250" x2="900" y2="250" stroke="#52606d" stroke-width="3"/>

    <path d="M182 234 Q262 192 341 234" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#em05)"/>
    <path d="M348 234 Q407 198 465 234" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#em05)"/>
    <path d="M472 234 Q516 204 559 234" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#em05)"/>
    <line x1="580" y1="250" x2="820" y2="250" stroke="#52606d" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="700" y="222" text-anchor="middle" font-size="15" fill="#52606d">and so on</text>

    <circle cx="180" cy="250" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <circle cx="345" cy="250" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="469" cy="250" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="563" cy="250" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="840" cy="250" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

    <text x="180" y="294" text-anchor="middle" font-size="16">2.00</text>
    <text x="345" y="294" text-anchor="middle" font-size="16">3.00</text>
    <text x="469" y="294" text-anchor="middle" font-size="16">3.75</text>
    <text x="563" y="294" text-anchor="middle" font-size="16">4.31</text>
    <text x="840" y="294" text-anchor="middle" font-size="16">6.00</text>

    <text x="180" y="324" text-anchor="middle" font-size="15" fill="#52606d">start</text>
    <text x="345" y="324" text-anchor="middle" font-size="15" fill="#52606d">step 1</text>
    <text x="469" y="324" text-anchor="middle" font-size="15" fill="#52606d">step 2</text>
    <text x="563" y="324" text-anchor="middle" font-size="15" fill="#52606d">step 3</text>
    <text x="840" y="324" text-anchor="middle" font-size="15" fill="#52606d">online value</text>

    <text x="480" y="372" text-anchor="middle" font-size="15" fill="#52606d">Each hop is smaller than the last, so the target lags smoothly and never overshoots.</text>
  </g>
</svg>
