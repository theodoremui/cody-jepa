<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">One residual allocation contrast is computed inside one paired block</title>
  <desc id="desc">A paired block contains breadth, balanced, and phase-depth trained models. GFC and independent-completion margins are subtracted within each allocation, then the primary contrast subtracts breadth residual from phase-depth residual inside the same block.</desc>
  <defs>
    <marker id="a14c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Every primary contrast stays inside one paired block</text>

    <rect x="50" y="82" width="520" height="296" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="310" y="120" text-anchor="middle" font-size="18" font-weight="700">Block r: three primary trained models</text>

    <rect x="86" y="160" width="135" height="118" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="153" y="190" text-anchor="middle" font-size="16" font-weight="700">breadth</text>
    <text x="153" y="222" text-anchor="middle" font-size="15">G = 0.31</text>
    <text x="153" y="248" text-anchor="middle" font-size="15">C = 0.23</text>
    <text x="153" y="274" text-anchor="middle" font-size="15">D = 0.08</text>

    <rect x="242" y="160" width="135" height="118" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="309" y="190" text-anchor="middle" font-size="16" font-weight="700">balanced</text>
    <text x="309" y="222" text-anchor="middle" font-size="15">G = 0.34</text>
    <text x="309" y="248" text-anchor="middle" font-size="15">C = 0.23</text>
    <text x="309" y="274" text-anchor="middle" font-size="15">D = 0.11</text>

    <rect x="398" y="160" width="135" height="118" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="465" y="190" text-anchor="middle" font-size="16" font-weight="700">phase depth</text>
    <text x="465" y="222" text-anchor="middle" font-size="15">G = 0.42</text>
    <text x="465" y="248" text-anchor="middle" font-size="15">C = 0.25</text>
    <text x="465" y="274" text-anchor="middle" font-size="15">D = 0.17</text>

    <text x="310" y="332" text-anchor="middle" font-size="16" fill="#52606d">D is GFC margin minus independent-completion margin.</text>

    <line x1="588" y1="230" x2="632" y2="230" stroke="#52606d" stroke-width="3" marker-end="url(#a14c)"/>

    <rect x="642" y="126" width="268" height="208" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="776" y="170" text-anchor="middle" font-size="18" font-weight="700">One block contrast</text>
    <text x="776" y="218" text-anchor="middle" font-size="17">P_r = D_phase - D_breadth</text>
    <text x="776" y="258" text-anchor="middle" font-size="17">= 0.17 - 0.08</text>
    <text x="776" y="300" text-anchor="middle" font-size="17">P_r = 0.09</text>

    <text x="480" y="410" text-anchor="middle" font-size="16" fill="#52606d">Eight primary blocks give eight P_r values. Participants sharpen each D, but do not add blocks.</text>
  </g>
</svg>
