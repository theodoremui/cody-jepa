<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Paired contrasts, uncertainty intervals, and decision thresholds</title>
  <desc id="desc">Within-participant differences form a sampling distribution, whose interval is compared with zero and an equivalence margin.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Pair first, quantify uncertainty, then decide</text>
    <rect x="42" y="90" width="260" height="258" rx="18" fill="#e8f1fb" stroke="#3b82b8" stroke-width="2"/>
    <text x="172" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#173f5f">Participant pairs</text>
    <g stroke-width="3" font-size="16" fill="#173f5f">
      <line x1="92" y1="179" x2="232" y2="160" stroke="#69a7d0"/><circle cx="92" cy="179" r="7" fill="#3b82b8"/><circle cx="232" cy="160" r="7" fill="#d89b21"/>
      <line x1="92" y1="226" x2="232" y2="195" stroke="#69a7d0"/><circle cx="92" cy="226" r="7" fill="#3b82b8"/><circle cx="232" cy="195" r="7" fill="#d89b21"/>
      <line x1="92" y1="273" x2="232" y2="257" stroke="#69a7d0"/><circle cx="92" cy="273" r="7" fill="#3b82b8"/><circle cx="232" cy="257" r="7" fill="#d89b21"/>
    </g>
    <text x="92" y="316" text-anchor="middle" font-size="16" fill="#173f5f">baseline</text>
    <text x="232" y="316" text-anchor="middle" font-size="16" fill="#744b00">intervention</text>
    <line x1="312" y1="219" x2="386" y2="219" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="398" y="119" width="206" height="200" rx="18" fill="#f2eafd" stroke="#8057b5" stroke-width="2"/>
    <text x="501" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#4f2e78">Paired differences</text>
    <path d="M425 276 C448 273, 455 238, 477 230 C496 222, 504 173, 526 190 C548 207, 550 254, 578 276" fill="none" stroke="#8057b5" stroke-width="4"/>
    <line x1="424" y1="276" x2="578" y2="276" stroke="#8b98a5"/>
    <text x="501" y="303" text-anchor="middle" font-size="16" fill="#4f2e78">bootstrap or t interval</text>
    <line x1="614" y1="219" x2="688" y2="219" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="700" y="91" width="218" height="256" rx="18" fill="#e8f7ee" stroke="#3d9b67" stroke-width="2"/>
    <text x="809" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#165b36">Decision scale</text>
    <line x1="733" y1="220" x2="885" y2="220" stroke="#52606d" stroke-width="2"/>
    <line x1="809" y1="172" x2="809" y2="272" stroke="#b74d4d" stroke-width="2"/>
    <line x1="755" y1="184" x2="755" y2="256" stroke="#3d9b67" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="863" y1="184" x2="863" y2="256" stroke="#3d9b67" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="824" y1="204" x2="850" y2="204" stroke="#8057b5" stroke-width="7" stroke-linecap="round"/>
    <text x="755" y="292" text-anchor="middle" font-size="16" fill="#165b36">−Δ</text>
    <text x="809" y="292" text-anchor="middle" font-size="16" fill="#9a3434">0</text>
    <text x="863" y="292" text-anchor="middle" font-size="16" fill="#165b36">+Δ</text>
    <text x="809" y="322" text-anchor="middle" font-size="16" fill="#165b36">superiority or equivalence</text>
    <text x="480" y="392" text-anchor="middle" font-size="17" fill="#52606d">The independent participant differences, not the raw rows, determine precision.</text>
  </g>
</svg>
