<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1075" role="img" aria-labelledby="title desc">
  <title id="title">The six tutorial tracks and what each one lets you do next</title>
  <desc id="desc">Six stacked bands read from top to bottom. Each band names a track, lists its lesson numbers and topics, and states the capability the reader gains from it. Track A covers arrays and vector geometry, Track B covers attention and masked latent prediction, Track C covers representation geometry and retrieval evaluation, Track D covers paired statistical inference, Track E covers reproducible evaluators, and Track F is the end-to-end capstone. Arrows show that each track supplies what the next one assumes.</desc>
  <defs>
    <marker id="cmArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
  </defs>

  <rect width="1200" height="1075" fill="#fbfaf7"/>
  <text x="60" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#172b4d">From arrays to defensible experiments</text>
  <text x="60" y="92" font-family="sans-serif" font-size="17" fill="#52606d">Read top to bottom. Each track supplies exactly what the next track assumes you already know.</text>

  <g font-family="sans-serif">
    <rect x="60" y="130" width="1080" height="128" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="88" y="166" font-size="20" font-weight="700" fill="#172b4d">Track A: mathematical and computational foundations</text>
    <text x="88" y="204" font-size="16" font-weight="600" fill="#1e293b">01 Tensors and shapes</text>
    <text x="300" y="204" font-size="16" font-weight="600" fill="#1e293b">02 Vector geometry</text>
    <text x="490" y="204" font-size="16" font-weight="600" fill="#1e293b">03 Nested observations</text>
    <text x="88" y="236" font-size="15" fill="#52606d">You gain: reading any array by its shape, comparing vectors safely, and seeing which units are nested inside which.</text>

    <path d="M600 258 V284" stroke="#52606d" stroke-width="3" marker-end="url(#cmArrow)"/>

    <rect x="60" y="284" width="1080" height="128" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="88" y="320" font-size="20" font-weight="700" fill="#172b4d">Track B: representation learning</text>
    <text x="88" y="358" font-size="16" font-weight="600" fill="#1e293b">04 Attention</text>
    <text x="220" y="358" font-size="16" font-weight="600" fill="#1e293b">05 Latent prediction</text>
    <text x="420" y="358" font-size="16" font-weight="600" fill="#1e293b">06 Collapse</text>
    <text x="543" y="358" font-size="16" font-weight="600" fill="#1e293b">07 Optimization</text>
    <text x="700" y="358" font-size="16" font-weight="600" fill="#1e293b">08 Group-aware sampling</text>
    <text x="88" y="390" font-size="15" fill="#52606d">You gain: how a JEPA learns by predicting features of hidden regions, why it does not collapse, and how it is trained.</text>

    <path d="M600 412 V438" stroke="#52606d" stroke-width="3" marker-end="url(#cmArrow)"/>

    <rect x="60" y="438" width="1080" height="128" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="88" y="474" font-size="20" font-weight="700" fill="#172b4d">Track C: representation geometry and evaluation</text>
    <text x="88" y="512" font-size="16" font-weight="600" fill="#1e293b">09 Eigenspectra</text>
    <text x="245" y="512" font-size="16" font-weight="600" fill="#1e293b">10 Ridge and calibration</text>
    <text x="478" y="512" font-size="16" font-weight="600" fill="#1e293b">11 Factor spaces</text>
    <text x="644" y="512" font-size="16" font-weight="600" fill="#1e293b">12 Ranking</text>
    <text x="759" y="512" font-size="16" font-weight="600" fill="#1e293b">13 Interventions</text>
    <text x="88" y="544" font-size="15" fill="#52606d">You gain: measuring what a frozen representation actually holds, using probes and retrieval instead of guesswork.</text>

    <path d="M600 566 V592" stroke="#52606d" stroke-width="3" marker-end="url(#cmArrow)"/>

    <rect x="60" y="592" width="1080" height="128" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="88" y="628" font-size="20" font-weight="700" fill="#172b4d">Track D: statistical inference and experimental design</text>
    <text x="88" y="666" font-size="16" font-weight="600" fill="#1e293b">14 Paired inference</text>
    <text x="285" y="666" font-size="16" font-weight="600" fill="#1e293b">15 Exposure and replication</text>
    <text x="88" y="698" font-size="15" fill="#52606d">You gain: telling a real effect from noise, and knowing which unit you are allowed to count as a replicate.</text>

    <path d="M600 720 V746" stroke="#52606d" stroke-width="3" marker-end="url(#cmArrow)"/>

    <rect x="60" y="746" width="1080" height="128" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="88" y="782" font-size="20" font-weight="700" fill="#172b4d">Track E: reproducible evaluator engineering</text>
    <text x="88" y="820" font-size="16" font-weight="600" fill="#1e293b">16 Numerical contracts</text>
    <text x="88" y="852" font-size="15" fill="#52606d">You gain: freezing fitted state, writing artifacts atomically, and failing closed when a digest does not match.</text>

    <path d="M600 874 V900" stroke="#52606d" stroke-width="3" marker-end="url(#cmArrow)"/>

    <rect x="60" y="900" width="1080" height="128" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="88" y="936" font-size="20" font-weight="700" fill="#172b4d">Track F: end-to-end research capstone</text>
    <text x="88" y="974" font-size="16" font-weight="600" fill="#1e293b">17 Iso-catalog phase allocation and paired inference</text>
    <text x="88" y="1006" font-size="15" fill="#52606d">You gain: assembling every earlier idea into one study you could defend in review.</text>
  </g>

  <text x="60" y="1054" font-family="sans-serif" font-size="15" fill="#52606d">Seventeen lessons. Each has a lecture to read and a notebook to run.</text>
</svg>
