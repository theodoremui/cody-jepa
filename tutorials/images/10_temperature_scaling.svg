<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Temperature scaling changes confidence but not class order</title>
  <desc id="desc">One set of three logits is divided by low, unit, and high temperatures; the highest class stays the same while probability concentration changes.</desc>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Temperature changes spread, not the winner</text>
  <g font-family="Arial, sans-serif">
    <text x="480" y="82" text-anchor="middle" font-size="18" fill="#425466">same logits: class A = 3, class B = 1, class C = 0</text>
    <rect x="42" y="108" width="270" height="244" rx="16" fill="#fff4d6" stroke="#d49b21" stroke-width="2"/>
    <text x="177" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#7d6608">T = 0.5: sharper</text>
    <rect x="82" y="186" width="56" height="122" fill="#d49b21"/><rect x="149" y="279" width="56" height="29" fill="#e8c774"/><rect x="216" y="297" width="56" height="11" fill="#f1dda7"/>
    <text x="110" y="331" text-anchor="middle" font-size="16" fill="#7d6608">A</text><text x="177" y="331" text-anchor="middle" font-size="16" fill="#7d6608">B</text><text x="244" y="331" text-anchor="middle" font-size="16" fill="#7d6608">C</text>
    <rect x="345" y="108" width="270" height="244" rx="16" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
    <text x="480" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#1b4f72">T = 1: unchanged</text>
    <rect x="385" y="200" width="56" height="108" fill="#367cad"/><rect x="452" y="268" width="56" height="40" fill="#75b4dc"/><rect x="519" y="293" width="56" height="15" fill="#b3d9ee"/>
    <text x="413" y="331" text-anchor="middle" font-size="16" fill="#1b4f72">A</text><text x="480" y="331" text-anchor="middle" font-size="16" fill="#1b4f72">B</text><text x="547" y="331" text-anchor="middle" font-size="16" fill="#1b4f72">C</text>
    <rect x="648" y="108" width="270" height="244" rx="16" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="783" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#145a4a">T = 2: softer</text>
    <rect x="688" y="225" width="56" height="83" fill="#27896f"/><rect x="755" y="258" width="56" height="50" fill="#69b9a4"/><rect x="822" y="275" width="56" height="33" fill="#9bd7c8"/>
    <text x="716" y="331" text-anchor="middle" font-size="16" fill="#145a4a">A</text><text x="783" y="331" text-anchor="middle" font-size="16" fill="#145a4a">B</text><text x="850" y="331" text-anchor="middle" font-size="16" fill="#145a4a">C</text>
    <text x="480" y="394" text-anchor="middle" font-size="17" fill="#425466">Class A stays highest for every positive temperature.</text>
  </g>
</svg>
