<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Mask geometry changes the prediction problem</title>
  <desc id="desc">The same six by eight token grid is shown with scattered targets, a compact spatial block, and a full temporal slice, illustrating different evidence requirements.</desc>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">A mask is a question posed to the model</text>
  <g font-family="sans-serif" fill="#172b4d">
    <g transform="translate(55 95)"><text x="120" y="0" text-anchor="middle" font-size="19" font-weight="700">Scattered targets</text><rect x="0" y="25" width="240" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><g fill="#64748b"><rect x="32" y="48" width="25" height="25"/><rect x="122" y="78" width="25" height="25"/><rect x="182" y="48" width="25" height="25"/><rect x="62" y="138" width="25" height="25"/><rect x="182" y="138" width="25" height="25"/></g><text x="120" y="240" text-anchor="middle" font-size="16">local interpolation may work</text></g>
    <g transform="translate(360 95)"><text x="120" y="0" text-anchor="middle" font-size="19" font-weight="700">Spatial block</text><rect x="0" y="25" width="240" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="90" y="75" width="90" height="75" fill="#64748b"/><text x="120" y="240" text-anchor="middle" font-size="16">surrounding context must bridge</text></g>
    <g transform="translate(665 95)"><text x="120" y="0" text-anchor="middle" font-size="19" font-weight="700">Temporal region</text><rect x="0" y="25" width="240" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="0" y="115" width="240" height="55" fill="#64748b"/><text x="120" y="240" text-anchor="middle" font-size="16">motion must be inferred</text></g>
    <rect x="235" y="365" width="490" height="40" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="480" y="391" text-anchor="middle" font-size="17">Blue is visible context. Gray is the hidden prediction target.</text>
  </g>
</svg>
