<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Prediction agreement does not guarantee diversity</title>
  <desc id="desc">Two encoder branches map different inputs to the same constant vector, producing zero prediction error but a collapsed representation.</desc>
  <defs><marker id="a06p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#425466"/></marker></defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Agreement can choose a constant solution</text>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="120" width="205" height="190" rx="16" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
    <text x="142" y="154" text-anchor="middle" font-size="19" font-weight="700" fill="#1b4f72">Different inputs</text>
    <circle cx="102" cy="210" r="24" fill="#8fc5e8"/><rect x="148" y="186" width="48" height="48" rx="8" fill="#6aaed6"/>
    <path d="M83 279 L116 244 L147 279 Z" fill="#367cad"/><circle cx="184" cy="264" r="20" fill="#b3d9ee"/>

    <path d="M258 215 C300 215 300 135 332 135" fill="none" stroke="#425466" stroke-width="3" marker-end="url(#a06p)"/>
    <path d="M258 215 C300 215 300 287 332 287" fill="none" stroke="#425466" stroke-width="3" marker-end="url(#a06p)"/>

    <rect x="345" y="72" width="220" height="125" rx="16" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
    <text x="455" y="106" text-anchor="middle" font-size="19" font-weight="700" fill="#633974">Prediction branch</text>
    <text x="455" y="145" text-anchor="middle" font-size="18" fill="#512e5f">every input maps to c</text>
    <circle cx="455" cy="174" r="14" fill="#8e5aa9"/>

    <rect x="345" y="225" width="220" height="125" rx="16" fill="#fff4d6" stroke="#d49b21" stroke-width="2"/>
    <text x="455" y="259" text-anchor="middle" font-size="19" font-weight="700" fill="#7d6608">Target branch</text>
    <text x="455" y="298" text-anchor="middle" font-size="18" fill="#5f4b08">every input maps to c</text>
    <circle cx="455" cy="327" r="14" fill="#d49b21"/>

    <path d="M578 135 C650 135 664 185 744 199" fill="none" stroke="#425466" stroke-width="3" marker-end="url(#a06p)"/>
    <path d="M578 287 C650 287 664 239 744 225" fill="none" stroke="#425466" stroke-width="3" marker-end="url(#a06p)"/>
    <rect x="760" y="157" width="164" height="116" rx="42" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="842" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#145a4a">agreement loss</text>
    <text x="842" y="241" text-anchor="middle" font-size="28" font-weight="700" fill="#145a4a">0</text>

    <text x="480" y="392" text-anchor="middle" font-size="18" fill="#7b241c">Zero error, zero information about which input was observed</text>
  </g>
</svg>
