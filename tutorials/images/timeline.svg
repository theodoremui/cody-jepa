<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 340" width="750" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="749" height="339" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="36" font-size="16.5" font-weight="600" fill="#0f172a">Four gates from mechanism to freeze</text>
  <text x="28" y="57" font-size="11" fill="#64748b">Eight H100 GPUs remove the compute limit. They do not move the September 11 freeze.</text>

  <line x1="60" y1="150" x2="700" y2="150" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <circle cx="120" cy="150" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="120" y1="142" x2="120" y2="112" stroke="#cbd5e1"/>
  <text x="120" y="104" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Aug 21</text>
  <text x="120" y="88" font-size="10" fill="#2563eb" text-anchor="middle">gate 1</text>
  <text x="120" y="177" font-size="10.5" fill="#475569" text-anchor="middle">cache &#38; preregister</text>
  <text x="120" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">freeze factorial,</text>
  <text x="120" y="207" font-size="10" fill="#94a3b8" text-anchor="middle">seeds, analysis,</text>
  <text x="120" y="220" font-size="10" fill="#94a3b8" text-anchor="middle">second domain</text>

  <circle cx="265" cy="150" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="265" y1="142" x2="265" y2="112" stroke="#cbd5e1"/>
  <text x="265" y="104" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Aug 28</text>
  <text x="265" y="88" font-size="10" fill="#7c3aed" text-anchor="middle">gate 2</text>
  <text x="265" y="177" font-size="10.5" fill="#475569" text-anchor="middle">mechanism</text>
  <text x="265" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">position reliance</text>
  <text x="265" y="207" font-size="10" fill="#94a3b8" text-anchor="middle">moves within trace</text>
  <text x="265" y="220" font-size="10" fill="#94a3b8" text-anchor="middle">and β</text>

  <circle cx="410" cy="150" r="8" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="410" y1="142" x2="410" y2="112" stroke="#cbd5e1"/>
  <text x="410" y="104" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Sep 4</text>
  <text x="410" y="88" font-size="10" fill="#059669" text-anchor="middle">gate 3</text>
  <text x="410" y="177" font-size="10.5" fill="#475569" text-anchor="middle">metric &#38; scale</text>
  <text x="410" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">RankMe head-to-head,</text>
  <text x="410" y="207" font-size="10" fill="#94a3b8" text-anchor="middle">selection regret,</text>
  <text x="410" y="220" font-size="10" fill="#94a3b8" text-anchor="middle">scale &#38; domain sign</text>

  <circle cx="555" cy="150" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="555" y1="142" x2="555" y2="112" stroke="#cbd5e1"/>
  <text x="555" y="104" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Sep 11</text>
  <text x="555" y="88" font-size="10" fill="#d97706" text-anchor="middle">gate 4</text>
  <text x="555" y="177" font-size="10.5" fill="#475569" text-anchor="middle">freeze</text>
  <text x="555" y="194" font-size="10" fill="#94a3b8" text-anchor="middle">no new method,</text>
  <text x="555" y="207" font-size="10" fill="#94a3b8" text-anchor="middle">metric, or domain</text>

  <circle cx="655" cy="150" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="655" y1="142" x2="655" y2="112" stroke="#cbd5e1"/>
  <text x="655" y="104" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Sep 18</text>
  <text x="655" y="88" font-size="10" fill="#059669" text-anchor="middle">abstract</text>

  <circle cx="700" cy="150" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="700" y1="158" x2="700" y2="184" stroke="#cbd5e1"/>
  <text x="700" y="198" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Sep 25</text>
  <text x="700" y="212" font-size="10" fill="#059669" text-anchor="middle">paper</text>

  <rect x="28" y="250" width="694" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="272" font-size="11" font-weight="600" fill="#334155">Day one decides whether the GPUs help</text>
  <text x="44" y="290" font-size="10.5" fill="#64748b">Pack the 112 by 112 by 16 grayscale clips into a uint8 tensor cache. JPEG decode will otherwise leave the</text>
  <text x="44" y="305" font-size="10.5" fill="#64748b">small encoder IO-bound. This infrastructure task matters more than any hyperparameter choice.</text>
</svg>
