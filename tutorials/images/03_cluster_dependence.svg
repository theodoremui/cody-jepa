<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Shared group causes create dependence among repeated observations</title>
  <desc id="desc">Three groups each have a shared group effect pointing to repeated measurements, showing why rows in one group are correlated.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Rows from one group share a source of variation</text>
  <g font-family="sans-serif" fill="#172b4d">
    <g><rect x="55" y="95" width="250" height="245" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="130" text-anchor="middle" font-size="19" font-weight="700">Person A effect</text><circle cx="180" cy="182" r="27" fill="#60a5fa"/><path d="M180 210 L110 275 M180 210 L180 275 M180 210 L250 275" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><circle cx="105" cy="295" r="17" fill="#bfdbfe"/><circle cx="180" cy="295" r="17" fill="#bfdbfe"/><circle cx="255" cy="295" r="17" fill="#bfdbfe"/></g>
    <g><rect x="355" y="95" width="250" height="245" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="480" y="130" text-anchor="middle" font-size="19" font-weight="700">Person B effect</text><circle cx="480" cy="182" r="27" fill="#4ade80"/><path d="M480 210 L410 275 M480 210 L480 275 M480 210 L550 275" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><circle cx="405" cy="295" r="17" fill="#bbf7d0"/><circle cx="480" cy="295" r="17" fill="#bbf7d0"/><circle cx="555" cy="295" r="17" fill="#bbf7d0"/></g>
    <g><rect x="655" y="95" width="250" height="245" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="780" y="130" text-anchor="middle" font-size="19" font-weight="700">Person C effect</text><circle cx="780" cy="182" r="27" fill="#fbbf24"/><path d="M780 210 L710 275 M780 210 L780 275 M780 210 L850 275" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><circle cx="705" cy="295" r="17" fill="#fde68a"/><circle cx="780" cy="295" r="17" fill="#fde68a"/><circle cx="855" cy="295" r="17" fill="#fde68a"/></g>
    <text x="480" y="390" text-anchor="middle" font-size="18">New repeats refine one estimate; independently sampled people broaden evidence.</text>
  </g>
</svg>
