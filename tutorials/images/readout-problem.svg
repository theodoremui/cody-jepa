<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 396" width="750" height="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="749" height="395" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="36" font-size="16.5" font-weight="600" fill="#0f172a">One encoder, two readouts, two quality axes</text>
  <text x="28" y="57" font-size="11" fill="#64748b">Every existing label-free metric reports one number. The claim is that one number cannot be right for both consumers.</text>

  <!-- encoder -->
  <rect x="28" y="92" width="150" height="96" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="103" y="128" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">frozen encoder</text>
  <text x="103" y="148" font-size="11" fill="#475569" text-anchor="middle">2,048 tokens</text>
  <text x="103" y="165" font-size="11" fill="#475569" text-anchor="middle">per clip</text>

  <line x1="178" y1="122" x2="212" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rpArrow)"/>
  <line x1="178" y1="158" x2="212" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rpArrow)"/>

  <!-- pooled path -->
  <rect x="216" y="92" width="238" height="56" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="232" y="114" font-size="11.5" font-weight="600" fill="#166534">pooled readout</text>
  <text x="232" y="134" font-size="10.5" fill="#15803d">average the tokens, then a linear probe</text>

  <line x1="454" y1="120" x2="488" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rpArrow)"/>
  <rect x="492" y="92" width="230" height="56" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="508" y="113" font-size="11" fill="#166534">can use only between-clip variance</text>
  <text x="508" y="133" font-size="11.5" font-weight="600" fill="#059669">predicted by β</text>

  <!-- dense path -->
  <rect x="216" y="160" width="238" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="232" y="182" font-size="11.5" font-weight="600" fill="#1e40af">dense readout</text>
  <text x="232" y="202" font-size="10.5" fill="#1d4ed8">classify each token on its own</text>

  <line x1="454" y1="188" x2="488" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rpArrow)"/>
  <rect x="492" y="160" width="230" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="508" y="181" font-size="11" fill="#1e40af">can use within-clip content variance</text>
  <text x="508" y="201" font-size="11.5" font-weight="600" fill="#2563eb">predicted by γ</text>

  <!-- the claim -->
  <rect x="28" y="236" width="694" height="62" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="44" y="258" font-size="11.5" font-weight="600" fill="#6b21a8">The claim: β and γ move independently, so no single scalar can rank checkpoints for both</text>
  <text x="44" y="278" font-size="10.5" fill="#334155">Between two checkpoints already on disk, β rose 196 times while γ fell 8 percent. If that holds across a designed</text>
  <text x="44" y="292" font-size="10.5" fill="#334155">population, the checkpoint a pooled metric selects is the wrong one for a dense task, and nothing warns you.</text>

  <!-- kill condition -->
  <rect x="28" y="310" width="694" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="44" y="332" font-size="11.5" font-weight="600" fill="#b91c1c">The kill condition, checkable in week one without any labels</text>
  <text x="44" y="352" font-size="10.5" fill="#991b1b">If β and γ turn out tightly coupled across the population, one scalar does summarise both, every readout-agnostic</text>
  <text x="44" y="366" font-size="10.5" fill="#991b1b">metric is adequate, and this claim is simply false. Report it either way.</text>
</svg>
