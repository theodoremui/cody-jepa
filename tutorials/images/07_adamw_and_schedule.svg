<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">AdamW update and learning-rate schedule</title>
  <desc id="desc">An adaptive Adam direction and a separate weight-decay shrinkage combine into an update whose scale follows warmup and cosine decay.</desc>
  <defs><marker id="a07a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#425466"/></marker></defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">AdamW separates direction, shrinkage, and step size</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="96" width="220" height="186" rx="16" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
    <text x="152" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#633974">Adaptive direction</text>
    <text x="152" y="184" text-anchor="middle" font-size="19" fill="#633974">m-hat /</text><text x="152" y="214" text-anchor="middle" font-size="19" fill="#633974">(sqrt(v-hat) + eps)</text>
    <text x="152" y="255" text-anchor="middle" font-size="16" fill="#633974">from gradient history</text>
    <rect x="42" y="304" width="220" height="76" rx="14" fill="#fff4d6" stroke="#d49b21" stroke-width="2"/>
    <text x="152" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#7d6608">Direct shrinkage</text><text x="152" y="363" text-anchor="middle" font-size="17" fill="#7d6608">(1 - lr × decay) theta</text>
    <line x1="276" y1="210" x2="346" y2="210" stroke="#425466" stroke-width="3" marker-end="url(#a07a)"/>
    <line x1="276" y1="342" x2="346" y2="250" stroke="#425466" stroke-width="3" marker-end="url(#a07a)"/>
    <rect x="362" y="140" width="202" height="150" rx="16" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="463" y="182" text-anchor="middle" font-size="21" font-weight="700" fill="#145a4a">New parameters</text>
    <text x="463" y="226" text-anchor="middle" font-size="18" fill="#145a4a">shrink theta</text>
    <text x="463" y="256" text-anchor="middle" font-size="18" fill="#145a4a">minus lr × direction</text>
    <line x1="578" y1="215" x2="642" y2="215" stroke="#425466" stroke-width="3" marker-end="url(#a07a)"/>
    <rect x="658" y="86" width="260" height="260" rx="16" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
    <text x="788" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#1b4f72">Learning-rate multiplier</text>
    <line x1="694" y1="304" x2="884" y2="304" stroke="#607d8b" stroke-width="2"/><line x1="694" y1="304" x2="694" y2="158" stroke="#607d8b" stroke-width="2"/>
    <path d="M694 296 L742 178 C784 170 823 195 853 239 C871 265 879 289 884 299" fill="none" stroke="#367cad" stroke-width="4"/>
    <text x="718" y="330" text-anchor="middle" font-size="16" fill="#1b4f72">warmup</text><text x="820" y="330" text-anchor="middle" font-size="16" fill="#1b4f72">cosine decay</text>
    <text x="480" y="402" text-anchor="middle" font-size="17" fill="#425466">The schedule changes update scale, not the gradient direction.</text>
  </g>
</svg>
