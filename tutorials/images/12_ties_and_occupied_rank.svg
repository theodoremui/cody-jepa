<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Ties, fractional top one credit, and occupied rank</title>
  <desc id="desc">A sorted gallery contains two candidates tied at the best distance and the correct identity shares that tie.</desc>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">A tie is a set, not an arbitrary ordering</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="70" y="90" width="500" height="255" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="120" y="130" font-size="18" font-weight="700">Distance</text><text x="300" y="130" font-size="18" font-weight="700">Identity</text><text x="455" y="130" font-size="18" font-weight="700">Status</text>
    <rect x="92" y="150" width="456" height="54" rx="10" fill="#dcfce7"/><text x="120" y="184" font-size="18">0.20</text><text x="300" y="184" font-size="18">A</text><text x="455" y="184" font-size="17">correct</text>
    <rect x="92" y="214" width="456" height="54" rx="10" fill="#fef3c7"/><text x="120" y="248" font-size="18">0.20</text><text x="300" y="248" font-size="18">B</text><text x="455" y="248" font-size="17">tied</text>
    <rect x="92" y="278" width="456" height="44" rx="10" fill="#e2e8f0"/><text x="120" y="307" font-size="18">0.35</text><text x="300" y="307" font-size="18">C</text><text x="455" y="307" font-size="17">next distance</text>
    <rect x="620" y="105" width="270" height="220" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="755" y="148" text-anchor="middle" font-size="19" font-weight="700">Tie-aware metrics</text>
    <text x="755" y="198" text-anchor="middle" font-size="18">fractional top-1 = 1 / 2</text>
    <text x="755" y="242" text-anchor="middle" font-size="18">occupied rank = 1</text>
    <text x="755" y="286" text-anchor="middle" font-size="18">reciprocal rank = 1</text>
  <text x="480" y="388" text-anchor="middle" font-size="17">Occupied rank is one plus the number of strictly better candidates.</text>
  </g>
</svg>
