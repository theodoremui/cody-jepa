<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Iso-catalog phase allocation from source pool to paired inference</title>
  <desc id="desc">A flow diagram showing breadth, balanced, phase-depth, and nearby-jitter allocations, matched evaluation, and block-level inference.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.text{font:500 15px system-ui,sans-serif;fill:#334155}.small{font:500 13px system-ui,sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" class="title">One fixed-exposure experiment, five linked contracts</text>
  <rect x="54" y="102" width="245" height="185" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="78" y="137" class="label">Common eligible corpus</text>
  <text x="78" y="174" class="text">stride confidence</text>
  <text x="78" y="204" class="text">source groups and clusters</text>
  <text x="78" y="240" class="small">one phase catalog for all cells</text>
  <line x1="303" y1="194" x2="351" y2="194" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="359" y="102" width="270" height="185" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="383" y="137" class="label">Iso-catalog allocation</text>
  <text x="383" y="174" class="text">250k × 1  breadth</text>
  <text x="383" y="202" class="text">125k × 2  balanced</text>
  <text x="383" y="230" class="text">62.5k × 4 phase depth</text>
  <text x="383" y="263" class="small">all U × k = 250,000</text>
  <line x1="633" y1="194" x2="681" y2="194" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="689" y="102" width="220" height="185" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="713" y="137" class="label">Paired blocks</text>
  <text x="713" y="174" class="text">8 × three path cells</text>
  <text x="713" y="204" class="text">4 × nearby jitter</text>
  <text x="713" y="240" class="small">28 models total</text>
  <line x1="913" y1="194" x2="961" y2="194" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="969" y="102" width="177" height="185" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="993" y="137" class="label">Evaluation</text>
  <text x="993" y="174" class="text">GFC margin</text>
  <text x="993" y="204" class="text">completion margin</text>
  <text x="993" y="240" class="small">top-1 and MRR</text>
  <line x1="1056" y1="291" x2="1056" y2="343" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="353" width="880" height="185" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="194" y="395" class="label">Block-level scientific conclusions</text>
  <text x="194" y="434" class="text">Primary: does phase depth change GFC minus independent completion relative to breadth?</text>
  <text x="194" y="468" class="text">Mechanism: does phase depth differ from matched nearby temporal jitter?</text>
  <text x="194" y="502" class="text">Support: do continuous margin, ranks, and factor-transport geometry agree?</text>
</svg>
