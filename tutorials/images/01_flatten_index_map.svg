<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Flattening a token grid without losing coordinates</title>
  <desc id="desc">Two time slices of a two by three spatial grid map in width-fastest order to a sequence of twelve token indices.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">A reshape changes layout, not identity</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="210" y="85" text-anchor="middle" font-size="19" font-weight="700">Grid coordinates (t, h, w)</text>
    <text x="135" y="120" text-anchor="middle" font-size="16">time 0</text><text x="285" y="120" text-anchor="middle" font-size="16">time 1</text>
    <g font-size="15" text-anchor="middle">
      <g fill="#dbeafe" stroke="#2563eb"><rect x="45" y="140" width="55" height="55"/><rect x="100" y="140" width="55" height="55"/><rect x="155" y="140" width="55" height="55"/><rect x="45" y="195" width="55" height="55"/><rect x="100" y="195" width="55" height="55"/><rect x="155" y="195" width="55" height="55"/></g>
      <g fill="#dcfce7" stroke="#16a34a"><rect x="245" y="140" width="55" height="55"/><rect x="300" y="140" width="55" height="55"/><rect x="355" y="140" width="55" height="55"/><rect x="245" y="195" width="55" height="55"/><rect x="300" y="195" width="55" height="55"/><rect x="355" y="195" width="55" height="55"/></g>
      <g><text x="72" y="172">0</text><text x="127" y="172">1</text><text x="182" y="172">2</text><text x="72" y="227">3</text><text x="127" y="227">4</text><text x="182" y="227">5</text><text x="272" y="172">6</text><text x="327" y="172">7</text><text x="382" y="172">8</text><text x="272" y="227">9</text><text x="327" y="227">10</text><text x="382" y="227">11</text></g>
    </g>
    <path d="M425 195 H505" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="465" y="180" text-anchor="middle" font-size="16">flatten</text>
    <text x="715" y="85" text-anchor="middle" font-size="19" font-weight="700">Sequence index n</text>
    <g stroke="#7c3aed" fill="#ede9fe"><rect x="535" y="150" width="60" height="60"/><rect x="595" y="150" width="60" height="60"/><rect x="655" y="150" width="60" height="60"/><rect x="715" y="150" width="60" height="60"/><rect x="775" y="150" width="60" height="60"/><rect x="835" y="150" width="60" height="60"/><rect x="535" y="235" width="60" height="60"/><rect x="595" y="235" width="60" height="60"/><rect x="655" y="235" width="60" height="60"/><rect x="715" y="235" width="60" height="60"/><rect x="775" y="235" width="60" height="60"/><rect x="835" y="235" width="60" height="60"/></g>
    <g font-size="16" text-anchor="middle"><text x="565" y="187">0</text><text x="625" y="187">1</text><text x="685" y="187">2</text><text x="745" y="187">3</text><text x="805" y="187">4</text><text x="865" y="187">5</text><text x="565" y="272">6</text><text x="625" y="272">7</text><text x="685" y="272">8</text><text x="745" y="272">9</text><text x="805" y="272">10</text><text x="865" y="272">11</text></g>
    <rect x="170" y="344" width="620" height="54" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="377" text-anchor="middle" font-size="18">Width changes first, then height, then time</text>
  </g>
</svg>
