<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Substituting the context moves every embedding the same way</title>
  <desc id="desc">Each baseline embedding is joined by an arrow to its intervened counterpart, and all four arrows point in the same direction, so coordinates move but the relative layout barely changes.</desc>
  <defs>
    <marker id="a13s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">A context swap moves the point, not the layout</text>

    <rect x="50" y="80" width="560" height="280" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <line x1="100" y1="330" x2="570" y2="330" stroke="#94a3b8" stroke-width="2"/>
    <line x1="100" y1="330" x2="100" y2="115" stroke="#94a3b8" stroke-width="2"/>

    <g stroke="#52606d" stroke-width="3" marker-end="url(#a13s)">
      <line x1="180" y1="290" x2="256" y2="256"/>
      <line x1="215" y1="205" x2="291" y2="171"/>
      <line x1="340" y1="300" x2="416" y2="266"/>
      <line x1="410" y1="196" x2="486" y2="162"/>
    </g>
    <g fill="#2563eb"><circle cx="180" cy="290" r="9"/><circle cx="215" cy="205" r="9"/><circle cx="340" cy="300" r="9"/><circle cx="410" cy="196" r="9"/></g>
    <g fill="#d97706"><circle cx="262" cy="253" r="9"/><circle cx="297" cy="168" r="9"/><circle cx="422" cy="263" r="9"/><circle cx="492" cy="159" r="9"/></g>

    <line x1="616" y1="220" x2="642" y2="220" stroke="#52606d" stroke-width="3" marker-end="url(#a13s)"/>

    <rect x="650" y="125" width="260" height="195" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="780" y="167" text-anchor="middle" font-size="18" font-weight="700">What changed</text>
    <text x="780" y="212" text-anchor="middle" font-size="16">each coordinate moves</text>
    <text x="780" y="250" text-anchor="middle" font-size="16">the layout barely moves</text>
    <text x="780" y="292" text-anchor="middle" font-size="16">so measure both</text>

    <text x="480" y="404" text-anchor="middle" font-size="16" fill="#52606d">Blue dots are baseline embeddings, amber dots the same identities after substitution.</text>
  </g>
</svg>
