<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Positional waves attach order to otherwise unordered token content</title>
  <desc id="desc">Identical token content at four positions receives different combinations of a fast and a slow sinusoidal wave.</desc>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Position becomes a multiscale pattern added to content</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="100" y="100" font-size="18" font-weight="700">Same content</text>
    <g fill="#dbeafe" stroke="#2563eb"><rect x="240" y="70" width="105" height="55" rx="10"/><rect x="375" y="70" width="105" height="55" rx="10"/><rect x="510" y="70" width="105" height="55" rx="10"/><rect x="645" y="70" width="105" height="55" rx="10"/></g>
    <g font-size="16" text-anchor="middle"><text x="292" y="104">token</text><text x="427" y="104">token</text><text x="562" y="104">token</text><text x="697" y="104">token</text></g>
    <text x="100" y="200" font-size="18" font-weight="700">Fast wave</text><path d="M240 200 C275 145 310 255 345 200 S415 145 480 200 S550 255 615 200 S685 145 750 200" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="100" y="285" font-size="18" font-weight="700">Slow wave</text><path d="M240 305 C365 205 625 205 750 305" fill="none" stroke="#16a34a" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-dasharray="5 5"><line x1="292" y1="125" x2="292" y2="330"/><line x1="427" y1="125" x2="427" y2="330"/><line x1="562" y1="125" x2="562" y2="330"/><line x1="697" y1="125" x2="697" y2="330"/></g>
    <rect x="190" y="350" width="580" height="45" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="480" y="379" text-anchor="middle" font-size="17">Each position receives a different vector of wave values.</text>
  </g>
</svg>
