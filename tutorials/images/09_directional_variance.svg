<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Directional variance in a centered point cloud</title>
  <desc id="desc">The same elongated point cloud is projected onto a long principal axis and a short perpendicular axis, producing high and low projected variance.</desc>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Rotate the ruler, change the measured variance</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="82" width="414" height="284" rx="16" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
    <text x="249" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#1b4f72">Long direction</text>
    <line x1="88" y1="307" x2="410" y2="142" stroke="#c75b4b" stroke-width="4"/>
    <g fill="#367cad"><circle cx="112" cy="292" r="8"/><circle cx="154" cy="269" r="8"/><circle cx="197" cy="253" r="8"/><circle cx="238" cy="223" r="8"/><circle cx="280" cy="209" r="8"/><circle cx="326" cy="179" r="8"/><circle cx="374" cy="157" r="8"/><circle cx="256" cy="245" r="8"/></g>
    <line x1="102" y1="334" x2="394" y2="334" stroke="#c75b4b" stroke-width="6" stroke-linecap="round"/>
    <text x="249" y="358" text-anchor="middle" font-size="17" fill="#7b241c">projections spread widely: large variance</text>
    <rect x="504" y="82" width="414" height="284" rx="16" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
    <text x="711" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#633974">Perpendicular direction</text>
    <line x1="598" y1="139" x2="821" y2="320" stroke="#27896f" stroke-width="4"/>
    <g fill="#8e5aa9"><circle cx="574" cy="292" r="8"/><circle cx="616" cy="269" r="8"/><circle cx="659" cy="253" r="8"/><circle cx="700" cy="223" r="8"/><circle cx="742" cy="209" r="8"/><circle cx="788" cy="179" r="8"/><circle cx="836" cy="157" r="8"/><circle cx="718" cy="245" r="8"/></g>
    <line x1="671" y1="334" x2="751" y2="334" stroke="#27896f" stroke-width="6" stroke-linecap="round"/>
    <text x="711" y="358" text-anchor="middle" font-size="17" fill="#145a4a">projections cluster tightly: small variance</text>
    <text x="480" y="398" text-anchor="middle" font-size="17" fill="#425466">An eigenvalue is the projected variance along its eigenvector.</text>
  </g>
</svg>
