<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Independent-factor completion multiplies three marginal probabilities</title>
  <desc id="desc">Each of the three factor heads produces a probability over its two levels, and a complete gallery cell receives the product of the three selected marginal probabilities.</desc>
  <defs>
    <marker id="a13i" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Three marginals, multiplied into one gallery cell</text>

    <rect x="55" y="88" width="280" height="85" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="195" y="122" text-anchor="middle" font-size="18" font-weight="700">Speed</text>
    <text x="195" y="154" text-anchor="middle" font-size="16">p(0) = 0.2, p(1) = 0.8</text>

    <rect x="55" y="199" width="280" height="85" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="195" y="233" text-anchor="middle" font-size="18" font-weight="700">Clothing</text>
    <text x="195" y="265" text-anchor="middle" font-size="16">p(0) = 0.7, p(1) = 0.3</text>

    <rect x="55" y="310" width="280" height="85" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="195" y="344" text-anchor="middle" font-size="18" font-weight="700">Direction</text>
    <text x="195" y="376" text-anchor="middle" font-size="16">p(0) = 0.4, p(1) = 0.6</text>

    <g stroke="#52606d" stroke-width="3" marker-end="url(#a13i)">
      <line x1="339" y1="130" x2="396" y2="200"/>
      <line x1="339" y1="241" x2="396" y2="241"/>
      <line x1="339" y1="352" x2="396" y2="282"/>
    </g>

    <rect x="405" y="152" width="250" height="178" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="530" y="196" text-anchor="middle" font-size="18" font-weight="700">Cell (1, 0, 1)</text>
    <text x="530" y="245" text-anchor="middle" font-size="18">0.8 x 0.7 x 0.6</text>
    <text x="530" y="292" text-anchor="middle" font-size="20">= 0.336</text>

    <line x1="661" y1="241" x2="685" y2="241" stroke="#52606d" stroke-width="3" marker-end="url(#a13i)"/>

    <rect x="692" y="160" width="222" height="165" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="803" y="202" text-anchor="middle" font-size="18" font-weight="700">Top cell</text>
    <text x="803" y="248" text-anchor="middle" font-size="16">product is largest</text>
    <text x="803" y="286" text-anchor="middle" font-size="16">at the three winners</text>

    <text x="480" y="424" text-anchor="middle" font-size="16" fill="#52606d">All eight cells receive a mass this way, so the eight masses sum to one.</text>
  </g>
</svg>
