<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Clustered rows widen the honest error bar</title>
  <desc id="desc">Treating two hundred clustered rows as independent gives a narrow interval, while accounting for twenty clusters of ten widens it by the square root of the design effect.</desc>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Dependence does not move the estimate, it widens the interval</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="98" text-anchor="middle" font-size="15" fill="#52606d">point estimate</text>
    <line x1="480" y1="112" x2="480" y2="312" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>

    <text x="70" y="152" font-size="17" font-weight="700">Naive: 200 rows treated as independent</text>
    <line x1="400" y1="186" x2="560" y2="186" stroke="#2563eb" stroke-width="5"/>
    <line x1="400" y1="172" x2="400" y2="200" stroke="#2563eb" stroke-width="5"/>
    <line x1="560" y1="172" x2="560" y2="200" stroke="#2563eb" stroke-width="5"/>
    <circle cx="480" cy="186" r="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>

    <text x="70" y="256" font-size="17" font-weight="700">Group-aware: 20 clusters of 10 rows</text>
    <line x1="292" y1="290" x2="668" y2="290" stroke="#d97706" stroke-width="5"/>
    <line x1="292" y1="276" x2="292" y2="304" stroke="#d97706" stroke-width="5"/>
    <line x1="668" y1="276" x2="668" y2="304" stroke="#d97706" stroke-width="5"/>
    <circle cx="480" cy="290" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>

    <text x="480" y="344" text-anchor="middle" font-size="16">cluster size 10 and intraclass correlation 0.5 give a design effect of 5.5</text>
    <rect x="150" y="368" width="660" height="60" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="404" text-anchor="middle" font-size="17">the interval widens by the square root of the design effect</text>
  </g>
</svg>
