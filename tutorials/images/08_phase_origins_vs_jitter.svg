<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Phase-separated origins compared with nearby jitter</title>
  <desc id="desc">One gait cycle drawn as a circle carries four origins a quarter cycle apart, while a second identical circle carries four origins clustered within a few hundredths of a cycle around the same base phase.</desc>
  <rect width="960" height="460" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Four origins in one gait cycle, two ways</text>

    <text x="280" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Phase-separated origins</text>
    <circle cx="280" cy="250" r="110" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <circle cx="280" cy="140" r="9" fill="#7c3aed"/>
    <circle cx="390" cy="250" r="9" fill="#7c3aed"/>
    <circle cx="280" cy="360" r="9" fill="#7c3aed"/>
    <circle cx="170" cy="250" r="9" fill="#7c3aed"/>
    <text x="280" y="256" text-anchor="middle" font-size="16" fill="#52606d">k = 4</text>
    <text x="280" y="124" text-anchor="middle" font-size="16" fill="#172b4d">b</text>
    <text x="408" y="256" font-size="16" fill="#172b4d">b + 1/4</text>
    <text x="280" y="394" text-anchor="middle" font-size="16" fill="#172b4d">b + 1/2</text>
    <text x="152" y="256" text-anchor="end" font-size="16" fill="#172b4d">b + 3/4</text>
    <text x="280" y="422" text-anchor="middle" font-size="16" fill="#52606d">different points in the stride</text>

    <text x="680" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">Nearby jitter</text>
    <circle cx="680" cy="250" r="110" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <circle cx="653" cy="144" r="7" fill="#d97706"/>
    <circle cx="671" cy="140" r="7" fill="#d97706"/>
    <circle cx="689" cy="140" r="7" fill="#d97706"/>
    <circle cx="707" cy="144" r="7" fill="#d97706"/>
    <text x="680" y="256" text-anchor="middle" font-size="16" fill="#52606d">k = 4</text>
    <text x="680" y="124" text-anchor="middle" font-size="16" fill="#172b4d">four offsets near b</text>
    <text x="680" y="422" text-anchor="middle" font-size="16" fill="#52606d">nearly the same pose</text>
  </g>
</svg>
