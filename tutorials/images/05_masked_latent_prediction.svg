<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Masked latent prediction with an exponential moving average target encoder</title>
  <desc id="desc">Visible context tokens enter an online encoder and predictor. A stop-gradient target encoder processes the full token sequence and gathers target latents. Prediction and target latents both enter the loss, while a short dashed arrow shows online parameters updating target parameters by exponential moving average.</desc>
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker>
    <marker id="ema5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
  </defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Masked latent prediction and target updates</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="40" y="105" width="165" height="200" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="122" y="143" text-anchor="middle" font-size="18" font-weight="700">Token mask</text>
    <rect x="69" y="174" width="24" height="24" fill="#60a5fa"/><rect x="101" y="174" width="24" height="24" fill="#60a5fa"/><rect x="133" y="174" width="24" height="24" fill="#64748b"/>
    <rect x="69" y="206" width="24" height="24" fill="#60a5fa"/><rect x="101" y="206" width="24" height="24" fill="#64748b"/><rect x="133" y="206" width="24" height="24" fill="#64748b"/>
    <text x="122" y="270" text-anchor="middle" font-size="16">context / target</text>
    <path d="M210 170 H280" stroke="#52606d" stroke-width="3" marker-end="url(#a5)"/>
    <path d="M210 295 H280" stroke="#52606d" stroke-width="3" marker-end="url(#a5)"/>
    <rect x="288" y="90" width="190" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="383" y="128" text-anchor="middle" font-size="18" font-weight="700">Online encoder</text>
    <text x="383" y="158" text-anchor="middle" font-size="16">visible context</text>
    <path d="M478 190 H520 V250 H483" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ema5)"/>
    <text x="505" y="226" text-anchor="end" font-size="16" fill="#92400e">EMA update</text>
    <rect x="288" y="235" width="190" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="383" y="273" text-anchor="middle" font-size="18" font-weight="700">Target encoder</text>
    <text x="383" y="304" text-anchor="middle" font-size="16">encode full tokens</text>
    <text x="383" y="329" text-anchor="middle" font-size="16">gather target latents</text>
    <path d="M483 150 H553" stroke="#52606d" stroke-width="3" marker-end="url(#a5)"/>
    <rect x="561" y="90" width="170" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="646" y="128" text-anchor="middle" font-size="18" font-weight="700">Predictor</text>
    <text x="646" y="163" text-anchor="middle" font-size="16">target locations</text>
    <path d="M736 150 H802 V250 H736" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#a5)"/>
    <text x="860" y="211" text-anchor="middle" font-size="16">prediction</text>
    <rect x="561" y="235" width="170" height="120" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="646" y="273" text-anchor="middle" font-size="18" font-weight="700">Latent loss</text>
    <text x="646" y="308" text-anchor="middle" font-size="16">prediction vs target</text>
    <path d="M483 295 H553" fill="none" stroke="#52606d" stroke-width="3" marker-end="url(#a5)"/>
    <text x="518" y="282" text-anchor="middle" font-size="16">target</text>
    <text x="480" y="390" text-anchor="middle" font-size="17" fill="#52606d">solid arrows = representations; dashed arrow = EMA parameter update</text>
  </g>
</svg>
