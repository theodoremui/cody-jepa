<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">An index tuple becomes one memory offset</title>
  <desc id="desc">A two by three tensor is shown beside a line of six numbered memory slots. The element at row one, column two has offset five, because the row stride is three and the column stride is one.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="400" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">An index tuple becomes one memory offset</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="227" y="92" text-anchor="middle" font-size="18" font-weight="700">Tensor view, shape (2, 3)</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="95" y="112" width="88" height="62"/><rect x="183" y="112" width="88" height="62"/><rect x="271" y="112" width="88" height="62"/>
      <rect x="95" y="174" width="88" height="62"/><rect x="183" y="174" width="88" height="62"/>
    </g>
    <rect x="271" y="174" width="88" height="62" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <g font-size="16" text-anchor="middle">
      <text x="139" y="150">[0, 0]</text><text x="227" y="150">[0, 1]</text><text x="315" y="150">[0, 2]</text>
      <text x="139" y="212">[1, 0]</text><text x="227" y="212">[1, 1]</text><text x="315" y="212">[1, 2]</text>
    </g>
    <path d="M375 174 H455" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="415" y="156" text-anchor="middle" font-size="16">offset</text>
    <text x="694" y="92" text-anchor="middle" font-size="18" font-weight="700">Memory: one line of numbered slots</text>
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="2">
      <rect x="490" y="143" width="68" height="62"/><rect x="558" y="143" width="68" height="62"/><rect x="626" y="143" width="68" height="62"/>
      <rect x="694" y="143" width="68" height="62"/><rect x="762" y="143" width="68" height="62"/>
    </g>
    <rect x="830" y="143" width="68" height="62" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <g font-size="17" text-anchor="middle">
      <text x="524" y="181">0</text><text x="592" y="181">1</text><text x="660" y="181">2</text>
      <text x="728" y="181">3</text><text x="796" y="181">4</text><text x="864" y="181">5</text>
    </g>
    <text x="694" y="234" text-anchor="middle" font-size="15">slot numbers count from the start of the buffer</text>
    <rect x="170" y="286" width="620" height="92" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="322" text-anchor="middle" font-size="17" font-weight="700">stride: slots skipped per step of one along an axis</text>
    <text x="480" y="352" text-anchor="middle" font-size="16">row stride 3, column stride 1, so [1, 2] sits at 1x3 + 2x1 = 5</text>
  </g>
</svg>
