<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Linear warmup followed by cosine decay</title>
  <desc id="desc">The learning rate rises in a straight line to its peak over the warmup updates, then falls along a cosine curve to a positive floor at the final planned update.</desc>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">One learning rate, two phases</text>

    <line x1="110" y1="90" x2="110" y2="330" stroke="#64748b" stroke-width="2"/>
    <line x1="110" y1="330" x2="910" y2="330" stroke="#64748b" stroke-width="2"/>
    <line x1="300" y1="330" x2="300" y2="110" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>

    <path d="M110 330 L300 110" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M300 110 C480 118 700 292 890 292" fill="none" stroke="#dc2626" stroke-width="4"/>

    <text x="118" y="82" font-size="16" fill="#52606d">learning rate</text>
    <text x="300" y="96" text-anchor="middle" font-size="16" fill="#172b4d">eta max</text>
    <text x="900" y="274" text-anchor="end" font-size="16" fill="#172b4d">eta min</text>
    <text x="205" y="366" text-anchor="middle" font-size="16" fill="#52606d">warmup: W updates</text>
    <text x="600" y="366" text-anchor="middle" font-size="16" fill="#52606d">cosine decay: T - W updates</text>
    <text x="910" y="398" text-anchor="end" font-size="15" fill="#52606d">update index t</text>
    <text x="200" y="398" text-anchor="middle" font-size="15" fill="#52606d">dashed line marks the end of warmup</text>
  </g>
</svg>
