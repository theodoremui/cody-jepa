<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Nested experimental units from participants to windows</title>
  <desc id="desc">Participants contain sessions, sessions contain clips, and clips contain many overlapping windows, while the number of independent units stays small.</desc>
  <defs><marker id="a15n" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Rows multiply inside a small participant hierarchy</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="45" y="115" width="165" height="180" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="127" y="158" text-anchor="middle" font-size="19" font-weight="700">Participants</text><text x="127" y="215" text-anchor="middle" font-size="28">20</text><text x="127" y="260" text-anchor="middle" font-size="16">sampled people</text>
    <path d="M220 205 H275" stroke="#475569" stroke-width="3" marker-end="url(#a15n)"/>
    <rect x="285" y="115" width="165" height="180" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="367" y="158" text-anchor="middle" font-size="19" font-weight="700">Sessions</text><text x="367" y="215" text-anchor="middle" font-size="28">60</text><text x="367" y="260" text-anchor="middle" font-size="16">nested in people</text>
    <path d="M460 205 H515" stroke="#475569" stroke-width="3" marker-end="url(#a15n)"/>
    <rect x="525" y="115" width="165" height="180" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="607" y="158" text-anchor="middle" font-size="19" font-weight="700">Clips</text><text x="607" y="215" text-anchor="middle" font-size="28">180</text><text x="607" y="260" text-anchor="middle" font-size="16">nested in sessions</text>
    <path d="M700 205 H755" stroke="#475569" stroke-width="3" marker-end="url(#a15n)"/>
    <rect x="765" y="115" width="150" height="180" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="840" y="158" text-anchor="middle" font-size="19" font-weight="700">Windows</text><text x="840" y="215" text-anchor="middle" font-size="28">3,600</text><text x="840" y="260" text-anchor="middle" font-size="16">highly repeated</text>
    <text x="480" y="365" text-anchor="middle" font-size="17">Training exposure grows from left to right; independent replication may not.</text>
  </g>
</svg>
