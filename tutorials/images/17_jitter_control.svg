<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Where the nearby-jitter diagnostic attaches and what it rules out</title>
  <desc id="desc">Two gait cycles carry four origins each: phase depth spreads them a quarter cycle apart while nearby jitter clusters them around one base phase, so a difference between the two cannot be explained by simply drawing four different start indices.</desc>
  <defs>
    <marker id="a17j" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">The jitter control changes only where the origins sit</text>

    <circle cx="250" cy="200" r="90" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="250" y="206" text-anchor="middle" font-size="16" font-weight="700">phase depth</text>
    <circle cx="250" cy="110" r="7" fill="#7c3aed"/>
    <circle cx="340" cy="200" r="7" fill="#7c3aed"/>
    <circle cx="250" cy="290" r="7" fill="#7c3aed"/>
    <circle cx="160" cy="200" r="7" fill="#7c3aed"/>

    <path d="M348 200 H612" stroke="#52606d" stroke-width="3" marker-end="url(#a17j)"/>
    <text x="480" y="180" text-anchor="middle" font-size="15" fill="#52606d">matched in four blocks</text>

    <circle cx="710" cy="200" r="90" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="710" y="206" text-anchor="middle" font-size="16" font-weight="700">nearby jitter</text>
    <circle cx="741" cy="115" r="7" fill="#d97706"/>
    <circle cx="723" cy="111" r="7" fill="#d97706"/>
    <circle cx="698" cy="111" r="7" fill="#d97706"/>
    <circle cx="679" cy="115" r="7" fill="#d97706"/>

    <text x="250" y="322" text-anchor="middle" font-size="16">four separated origins</text>
    <text x="710" y="322" text-anchor="middle" font-size="16">four origins near one base phase</text>

    <rect x="90" y="350" width="780" height="78" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="480" y="382" text-anchor="middle" font-size="16" font-weight="700">Same sequences, same origin count, same exposure, same streams</text>
    <text x="480" y="408" text-anchor="middle" font-size="15">so a phase-depth win over jitter rules out plain start-index variety</text>
  </g>
</svg>
