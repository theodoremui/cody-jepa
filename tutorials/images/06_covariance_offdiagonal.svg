<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
  <title id="title">The covariance term penalizes the off-diagonal entries only</title>
  <desc id="desc">A five by five covariance matrix. The green diagonal holds one variance per feature and is left alone. Every red off-diagonal cell measures redundancy between two different features and is squared and summed into the penalty.</desc>
  <rect width="700" height="430" fill="#fbfaf7"/>
  <text x="350" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#172b4d">Only the off-diagonal cells enter the penalty</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="280" y="90" text-anchor="middle" font-size="16">covariance matrix C, shape (D, D)</text>
    <g stroke="#dc2626" stroke-width="2" fill="#fee2e2">
      <rect x="208" y="120" width="48" height="48"/><rect x="256" y="120" width="48" height="48"/><rect x="304" y="120" width="48" height="48"/><rect x="352" y="120" width="48" height="48"/>
      <rect x="160" y="168" width="48" height="48"/><rect x="256" y="168" width="48" height="48"/><rect x="304" y="168" width="48" height="48"/><rect x="352" y="168" width="48" height="48"/>
      <rect x="160" y="216" width="48" height="48"/><rect x="208" y="216" width="48" height="48"/><rect x="304" y="216" width="48" height="48"/><rect x="352" y="216" width="48" height="48"/>
      <rect x="160" y="264" width="48" height="48"/><rect x="208" y="264" width="48" height="48"/><rect x="256" y="264" width="48" height="48"/><rect x="352" y="264" width="48" height="48"/>
      <rect x="160" y="312" width="48" height="48"/><rect x="208" y="312" width="48" height="48"/><rect x="256" y="312" width="48" height="48"/><rect x="304" y="312" width="48" height="48"/>
    </g>
    <g stroke="#16a34a" stroke-width="2" fill="#dcfce7">
      <rect x="160" y="120" width="48" height="48"/><rect x="208" y="168" width="48" height="48"/><rect x="256" y="216" width="48" height="48"/><rect x="304" y="264" width="48" height="48"/><rect x="352" y="312" width="48" height="48"/>
    </g>
    <rect x="440" y="150" width="40" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="496" y="176" font-size="15">diagonal = variance</text>
    <rect x="440" y="240" width="40" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="496" y="266" font-size="15">off diagonal = copying</text>
    <text x="350" y="404" text-anchor="middle" font-size="15" fill="#52606d">Squaring each red cell penalizes copying and sign-flipped copying alike.</text>
  </g>
</svg>
