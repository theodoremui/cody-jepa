<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Broadcasting aligns shapes from the right</title>
  <desc id="desc">Shape two by three by one and shape thirty two are lined up from the rightmost axis. Absent and length one axes stretch, so the broadcast result is two by three by thirty two.</desc>
  <rect width="960" height="410" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Broadcasting lines shapes up from the right</text>
  <g font-family="sans-serif" fill="#172b4d">
    <g font-size="16" text-anchor="middle" fill="#52606d">
      <text x="498" y="102">axis -3</text><text x="662" y="102">axis -2</text><text x="826" y="102">axis -1</text>
    </g>
    <text x="395" y="158" text-anchor="end" font-size="16">index shape</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="430" y="122" width="136" height="56"/><rect x="594" y="122" width="136" height="56"/><rect x="758" y="122" width="136" height="56"/>
    </g>
    <g font-size="17" text-anchor="middle"><text x="498" y="158">2</text><text x="662" y="158">3</text><text x="826" y="158">1</text></g>

    <text x="395" y="236" text-anchor="end" font-size="16">feature shape</text>
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5">
      <rect x="430" y="200" width="136" height="56"/><rect x="594" y="200" width="136" height="56"/>
    </g>
    <rect x="758" y="200" width="136" height="56" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <g font-size="15" text-anchor="middle" fill="#52606d"><text x="498" y="236">absent</text><text x="662" y="236">absent</text></g>
    <text x="826" y="236" text-anchor="middle" font-size="17">32</text>

    <text x="395" y="324" text-anchor="end" font-size="16">result shape</text>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="430" y="288" width="136" height="56"/><rect x="594" y="288" width="136" height="56"/><rect x="758" y="288" width="136" height="56"/>
    </g>
    <g font-size="17" text-anchor="middle"><text x="498" y="324">2</text><text x="662" y="324">3</text><text x="826" y="324">32</text></g>

    <text x="662" y="380" text-anchor="middle" font-size="16">an absent or length-one axis stretches to match, at zero storage cost</text>
  </g>
</svg>
