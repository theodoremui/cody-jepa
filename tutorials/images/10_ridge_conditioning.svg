<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Ridge regularization improves conditioning</title>
  <desc id="desc">A long narrow least-squares valley has a weak direction; adding ridge curvature makes the valley rounder and the solution less sensitive.</desc>
  <defs><marker id="a10r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#425466"/></marker></defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Ridge lifts weak directions</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="82" width="356" height="286" rx="16" fill="#fbe9e7" stroke="#c75b4b" stroke-width="2"/>
    <text x="220" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#7b241c">Nearly collinear features</text>
    <ellipse cx="220" cy="225" rx="142" ry="38" transform="rotate(-28 220 225)" fill="none" stroke="#c75b4b" stroke-width="4"/>
    <ellipse cx="220" cy="225" rx="102" ry="27" transform="rotate(-28 220 225)" fill="none" stroke="#df8b80" stroke-width="3"/>
    <ellipse cx="220" cy="225" rx="60" ry="17" transform="rotate(-28 220 225)" fill="none" stroke="#eeb7b0" stroke-width="3"/>
    <text x="220" y="334" text-anchor="middle" font-size="17" fill="#7b241c">tiny eigenvalue, unstable coefficients</text>
    <line x1="410" y1="225" x2="506" y2="225" stroke="#425466" stroke-width="3" marker-end="url(#a10r)"/>
    <text x="458" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#425466">+ alpha I</text>
    <rect x="522" y="82" width="396" height="286" rx="16" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="720" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#145a4a">Ridge objective</text>
    <ellipse cx="720" cy="225" rx="102" ry="78" transform="rotate(-15 720 225)" fill="none" stroke="#27896f" stroke-width="4"/>
    <ellipse cx="720" cy="225" rx="70" ry="52" transform="rotate(-15 720 225)" fill="none" stroke="#69b9a4" stroke-width="3"/>
    <ellipse cx="720" cy="225" rx="38" ry="28" transform="rotate(-15 720 225)" fill="none" stroke="#9bd7c8" stroke-width="3"/>
    <circle cx="720" cy="225" r="7" fill="#145a4a"/>
    <text x="720" y="334" text-anchor="middle" font-size="17" fill="#145a4a">small eigenvalues shift upward</text>
    <text x="480" y="402" text-anchor="middle" font-size="17" fill="#425466">A rounder loss surface makes the fitted coefficients less sensitive to small perturbations.</text>
  </g>
</svg>
