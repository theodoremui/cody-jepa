<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">The target margin is the gap to the nearest competitor</title>
  <desc id="desc">Four gallery candidates sit on a cosine distance axis, and the margin is the distance from the true target to the closest wrong candidate.</desc>
  <defs>
    <marker id="a12m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">The margin is the gap to the nearest competitor</text>

    <rect x="50" y="80" width="580" height="260" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>

    <text x="220" y="162" text-anchor="middle" font-size="16">margin 0.12</text>
    <path d="M190 182 V236 M250 182 V236 M190 182 H250" fill="none" stroke="#52606d" stroke-width="2"/>

    <line x1="90" y1="250" x2="600" y2="250" stroke="#52606d" stroke-width="3"/>
    <circle cx="190" cy="250" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <circle cx="250" cy="250" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <circle cx="365" cy="250" r="11" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <circle cx="480" cy="250" r="11" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>

    <text x="190" y="292" text-anchor="middle" font-size="16">0.20</text>
    <text x="250" y="292" text-anchor="middle" font-size="16">0.32</text>
    <text x="365" y="292" text-anchor="middle" font-size="16">0.55</text>
    <text x="480" y="292" text-anchor="middle" font-size="16">0.78</text>

    <text x="190" y="322" text-anchor="middle" font-size="16">A</text>
    <text x="250" y="322" text-anchor="middle" font-size="16">B</text>
    <text x="365" y="322" text-anchor="middle" font-size="16">C</text>
    <text x="480" y="322" text-anchor="middle" font-size="16">D</text>

    <line x1="636" y1="215" x2="658" y2="215" stroke="#52606d" stroke-width="3" marker-end="url(#a12m)"/>

    <rect x="665" y="120" width="245" height="190" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="787" y="162" text-anchor="middle" font-size="18" font-weight="700">Target margin</text>
    <text x="787" y="207" text-anchor="middle" font-size="18">0.32 - 0.20</text>
    <text x="787" y="250" text-anchor="middle" font-size="22">= 0.12</text>
    <text x="787" y="288" text-anchor="middle" font-size="16">positive: A wins</text>

    <text x="340" y="374" text-anchor="middle" font-size="16">cosine distance, lower is better</text>
    <text x="480" y="412" text-anchor="middle" font-size="16" fill="#52606d">Green is the true target, amber its nearest competitor, gray the rest of the gallery.</text>
  </g>
</svg>
