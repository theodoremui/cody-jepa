<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Inner products and stable cosine similarity</title>
  <desc id="desc">Two vectors define an angle through their dot product and norms, followed by stable normalization and mean pooling.</desc>
  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Inner-product geometry and numerical stability</text>
  <g font-family="sans-serif" fill="#172b4d">
    <line x1="120" y1="290" x2="120" y2="95" stroke="#94a3b8" stroke-width="2"/>
    <line x1="70" y1="290" x2="345" y2="290" stroke="#94a3b8" stroke-width="2"/>
    <line x1="120" y1="290" x2="305" y2="135" stroke="#2563eb" stroke-width="5" marker-end="url(#a2)"/>
    <line x1="120" y1="290" x2="320" y2="240" stroke="#16a34a" stroke-width="5" marker-end="url(#a2)"/>
    <text x="293" y="117" font-size="18" font-weight="700">x</text><text x="327" y="235" font-size="18" font-weight="700">y</text>
    <path d="M183 274 A66 66 0 0 0 169 247" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="187" y="252" font-size="18">theta</text>
    <rect x="410" y="95" width="230" height="195" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="525" y="132" text-anchor="middle" font-size="19" font-weight="700">Cosine similarity</text>
    <text x="525" y="176" text-anchor="middle" font-size="18">x dot y</text>
    <line x1="458" y1="187" x2="592" y2="187" stroke="#172b4d" stroke-width="2"/>
    <text x="525" y="216" text-anchor="middle" font-size="18">||x|| ||y||</text>
    <text x="525" y="255" text-anchor="middle" font-size="16">direction, not magnitude</text>
    <path d="M645 192 H712" stroke="#52606d" stroke-width="3" marker-end="url(#a2)"/>
    <rect x="720" y="95" width="190" height="195" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="815" y="132" text-anchor="middle" font-size="19" font-weight="700">Stable compute</text>
    <text x="815" y="174" text-anchor="middle" font-size="16">float32 or float64</text>
    <text x="815" y="207" text-anchor="middle" font-size="16">clamp norm by eps</text>
    <text x="815" y="240" text-anchor="middle" font-size="16">check finite values</text>
    <rect x="300" y="335" width="360" height="50" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="367" text-anchor="middle" font-size="17">mean pooling: (B, N, D) to (B, D)</text>
  </g>
</svg>
