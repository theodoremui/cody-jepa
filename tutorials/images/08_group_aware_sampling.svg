<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Group-aware sampling and traceable windows</title>
  <desc id="desc">Groups are assigned to disjoint partitions before sequences become temporal windows and receive one consistent transformation, with a lineage record connecting every stage.</desc>
  <defs>
    <marker id="arrow08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34495e"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17202a">Split groups before sampling windows</text>
  <rect x="35" y="90" width="190" height="230" rx="15" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
  <text x="130" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1b4f72">Source groups</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#173b53"><rect x="50" y="145" width="160" height="36" rx="8" fill="#a9d2ec"/><text x="130" y="169" text-anchor="middle">Person A: 3 clips</text><rect x="50" y="193" width="160" height="36" rx="8" fill="#a9d2ec"/><text x="130" y="217" text-anchor="middle">Person B: 4 clips</text><rect x="50" y="241" width="160" height="36" rx="8" fill="#a9d2ec"/><text x="130" y="265" text-anchor="middle">Person C: 2 clips</text></g>
  <line x1="231" y1="205" x2="278" y2="205" stroke="#34495e" stroke-width="3" marker-end="url(#arrow08)"/>
  <rect x="293" y="90" width="182" height="230" rx="15" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
  <text x="384" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#633974">Disjoint split</text>
  <rect x="326" y="148" width="116" height="46" rx="9" fill="#c8a8d8"/><text x="384" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#512e5f">Train: A, B</text>
  <rect x="326" y="218" width="116" height="46" rx="9" fill="#e4cbed"/><text x="384" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#512e5f">Test: C</text>
  <line x1="481" y1="205" x2="528" y2="205" stroke="#34495e" stroke-width="3" marker-end="url(#arrow08)"/>
  <rect x="543" y="90" width="182" height="230" rx="15" fill="#fff4d6" stroke="#d49b21" stroke-width="2"/>
  <text x="634" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7d6608">Time windows</text>
  <g fill="#e5b84f"><rect x="574" y="157" width="72" height="28" rx="6"/><rect x="596" y="196" width="72" height="28" rx="6"/><rect x="619" y="235" width="72" height="28" rx="6"/></g>
  <text x="634" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5f4b08">fixed or sampled starts</text>
  <line x1="731" y1="205" x2="778" y2="205" stroke="#34495e" stroke-width="3" marker-end="url(#arrow08)"/>
  <rect x="793" y="90" width="132" height="230" rx="15" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
  <text x="859" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#145a4a">Transform</text>
  <text x="859" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#174f42">one crop</text><text x="859" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#174f42">one flip</text><text x="859" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#174f42">all frames</text>
  <rect x="799" y="257" width="120" height="34" rx="8" fill="#91cfbf"/><text x="859" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#174f42">model tensor</text>
  <path d="M130 329 C260 382 690 382 859 329" fill="none" stroke="#c75b4b" stroke-width="3" marker-end="url(#arrow08)"/>
  <text x="486" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#7b241c">Lineage records source, split, window, and transform parameters</text>
</svg>
