<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">The eight recordings of one participant as a speed by clothing by direction grid</title>
  <desc id="desc">Two two-by-two grids are shown side by side, one for each walking direction. Each grid crosses slow and fast speed with normal and coat clothing, so the two grids together hold the eight numbered recordings that one participant contributes.</desc>
  <rect width="960" height="440" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Eight recordings: speed by clothing by direction</text>

    <rect x="60" y="90" width="380" height="280" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">direction: forward</text>
    <text x="237" y="182" text-anchor="middle" font-size="15" fill="#52606d">normal</text>
    <text x="360" y="182" text-anchor="middle" font-size="15" fill="#52606d">coat</text>
    <text x="170" y="241" text-anchor="end" font-size="15" fill="#52606d">slow</text>
    <text x="170" y="317" text-anchor="end" font-size="15" fill="#52606d">fast</text>
    <rect x="180" y="200" width="115" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="303" y="200" width="115" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="180" y="276" width="115" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="303" y="276" width="115" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="237" y="241" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">1</text>
    <text x="360" y="241" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">2</text>
    <text x="237" y="317" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">3</text>
    <text x="360" y="317" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">4</text>

    <rect x="520" y="90" width="380" height="280" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="710" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">direction: backward</text>
    <text x="697" y="182" text-anchor="middle" font-size="15" fill="#52606d">normal</text>
    <text x="820" y="182" text-anchor="middle" font-size="15" fill="#52606d">coat</text>
    <text x="630" y="241" text-anchor="end" font-size="15" fill="#52606d">slow</text>
    <text x="630" y="317" text-anchor="end" font-size="15" fill="#52606d">fast</text>
    <rect x="640" y="200" width="115" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <rect x="763" y="200" width="115" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <rect x="640" y="276" width="115" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <rect x="763" y="276" width="115" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="697" y="241" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">5</text>
    <text x="820" y="241" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">6</text>
    <text x="697" y="317" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">7</text>
    <text x="820" y="317" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">8</text>

    <text x="480" y="404" text-anchor="middle" font-size="15" fill="#52606d">Three binary factors cross into eight cells, and one participant records all eight.</text>
  </g>
</svg>
