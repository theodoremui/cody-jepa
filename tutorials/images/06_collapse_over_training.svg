<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Collapse seen as an embedding cloud shrinking during training</title>
  <desc id="desc">Three snapshots of the same nine embeddings. Early in training they are spread across the plane, later they crowd toward the middle, and finally they sit on top of one another at a single location.</desc>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Collapse is a cloud that quietly shrinks to a point</text>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="170" y="80" text-anchor="middle" font-size="17" font-weight="700">early in training</text>
    <text x="480" y="80" text-anchor="middle" font-size="17" font-weight="700">midway</text>
    <text x="790" y="80" text-anchor="middle" font-size="17" font-weight="700">collapsed</text>

    <rect x="40" y="94" width="260" height="256" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <g fill="#2563eb">
      <circle cx="90" cy="152" r="8"/><circle cx="130" cy="282" r="8"/><circle cx="180" cy="132" r="8"/>
      <circle cx="230" cy="242" r="8"/><circle cx="100" cy="232" r="8"/><circle cx="255" cy="192" r="8"/>
      <circle cx="200" cy="302" r="8"/><circle cx="150" cy="202" r="8"/><circle cx="240" cy="292" r="8"/>
    </g>

    <rect x="350" y="94" width="260" height="256" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <g fill="#7c3aed">
      <circle cx="444" cy="191" r="8"/><circle cx="462" cy="249" r="8"/><circle cx="485" cy="182" r="8"/>
      <circle cx="507" cy="231" r="8"/><circle cx="449" cy="227" r="8"/><circle cx="518" cy="209" r="8"/>
      <circle cx="494" cy="258" r="8"/><circle cx="471" cy="213" r="8"/><circle cx="512" cy="254" r="8"/>
    </g>

    <rect x="660" y="94" width="260" height="256" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <g fill="#dc2626">
      <circle cx="785" cy="218" r="8"/><circle cx="788" cy="226" r="8"/><circle cx="791" cy="216" r="8"/>
      <circle cx="794" cy="223" r="8"/><circle cx="786" cy="223" r="8"/><circle cx="795" cy="220" r="8"/>
      <circle cx="792" cy="227" r="8"/><circle cx="789" cy="221" r="8"/><circle cx="794" cy="226" r="8"/>
    </g>

    <text x="170" y="382" text-anchor="middle" font-size="15" fill="#52606d">inputs are told apart</text>
    <text x="480" y="382" text-anchor="middle" font-size="15" fill="#52606d">spread is shrinking</text>
    <text x="790" y="382" text-anchor="middle" font-size="15" fill="#52606d">nine points, one location</text>
    <text x="480" y="418" text-anchor="middle" font-size="15" fill="#52606d">The prediction loss can fall through all three panels, so loss alone will not warn you.</text>
  </g>
</svg>
