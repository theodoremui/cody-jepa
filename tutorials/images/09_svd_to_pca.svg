<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">SVD, covariance eigenvalues, and PCA scores</title>
  <desc id="desc">Centered data are decomposed by SVD; squared singular values become covariance eigenvalues, and right singular vectors project data into principal component scores.</desc>
  <defs><marker id="a09s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#425466"/></marker></defs>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">One decomposition, two useful outputs</text>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="126" width="190" height="166" rx="16" fill="#eaf2f8" stroke="#367cad" stroke-width="2"/>
    <text x="137" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#1b4f72">Centered data X</text>
    <text x="137" y="214" text-anchor="middle" font-size="26" fill="#1b4f72">N × D</text>
    <text x="137" y="258" text-anchor="middle" font-size="17" fill="#1b4f72">observations × features</text>
    <line x1="244" y1="209" x2="306" y2="209" stroke="#425466" stroke-width="3" marker-end="url(#a09s)"/>
    <rect x="322" y="106" width="214" height="206" rx="16" fill="#f4ecf7" stroke="#8e5aa9" stroke-width="2"/>
    <text x="429" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#633974">Compact SVD</text>
    <text x="429" y="187" text-anchor="middle" font-size="22" fill="#633974">X = U Sigma</text>
    <text x="429" y="216" text-anchor="middle" font-size="22" fill="#633974">times V-transpose</text>
    <text x="429" y="256" text-anchor="middle" font-size="17" fill="#633974">Sigma: singular values</text>
    <text x="429" y="286" text-anchor="middle" font-size="17" fill="#633974">V: feature directions</text>
    <path d="M550 173 C613 173 602 112 660 112" fill="none" stroke="#425466" stroke-width="3" marker-end="url(#a09s)"/>
    <path d="M550 245 C613 245 602 306 660 306" fill="none" stroke="#425466" stroke-width="3" marker-end="url(#a09s)"/>
    <rect x="676" y="70" width="240" height="142" rx="16" fill="#fff4d6" stroke="#d49b21" stroke-width="2"/>
    <text x="796" y="109" text-anchor="middle" font-size="20" font-weight="700" fill="#7d6608">Covariance spectrum</text>
    <text x="796" y="145" text-anchor="middle" font-size="18" fill="#7d6608">lambda k</text>
    <text x="796" y="171" text-anchor="middle" font-size="18" fill="#7d6608">= sigma k squared</text>
    <text x="796" y="197" text-anchor="middle" font-size="17" fill="#7d6608">divided by N - 1</text>
    <rect x="676" y="244" width="240" height="130" rx="16" fill="#e8f6f3" stroke="#27896f" stroke-width="2"/>
    <text x="796" y="281" text-anchor="middle" font-size="20" font-weight="700" fill="#145a4a">PCA scores</text>
    <text x="796" y="321" text-anchor="middle" font-size="21" fill="#145a4a">S = X V<tspan baseline-shift="sub" font-size="14">K</tspan></text>
    <text x="796" y="350" text-anchor="middle" font-size="17" fill="#145a4a">shape N × K</text>
    <text x="480" y="398" text-anchor="middle" font-size="17" fill="#425466">SVD avoids explicitly building a large D × D covariance matrix.</text>
  </g>
</svg>
