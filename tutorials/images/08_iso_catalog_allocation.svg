<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Three allocations with the same nominal catalog size</title>
  <desc id="desc">Breadth uses 250,000 sequences with one origin each, balanced uses 125,000 sequences with two origins, and phase depth uses 62,500 sequences with four origins, so all three reach 250,000 sequence-origin pairs.</desc>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif">
    <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">One catalog size, three allocations</text>

    <rect x="30" y="100" width="280" height="210" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">breadth</text>
    <text x="170" y="190" text-anchor="middle" font-size="16" fill="#172b4d">U = 250,000 sequences</text>
    <text x="170" y="222" text-anchor="middle" font-size="16" fill="#172b4d">k = 1 origin each</text>
    <line x1="54" y1="244" x2="286" y2="244" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">U × k = 250,000</text>

    <rect x="340" y="100" width="280" height="210" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="480" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">balanced</text>
    <text x="480" y="190" text-anchor="middle" font-size="16" fill="#172b4d">U = 125,000 sequences</text>
    <text x="480" y="222" text-anchor="middle" font-size="16" fill="#172b4d">k = 2 origins each</text>
    <line x1="364" y1="244" x2="596" y2="244" stroke="#7c3aed" stroke-width="2"/>
    <text x="480" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">U × k = 250,000</text>

    <rect x="650" y="100" width="280" height="210" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">phase depth</text>
    <text x="790" y="190" text-anchor="middle" font-size="16" fill="#172b4d">U = 62,500 sequences</text>
    <text x="790" y="222" text-anchor="middle" font-size="16" fill="#172b4d">k = 4 origins each</text>
    <line x1="674" y1="244" x2="906" y2="244" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#172b4d">U × k = 250,000</text>

    <text x="480" y="352" text-anchor="middle" font-size="17" fill="#52606d">Same nominal catalog: 250,000 sequence-origin pairs in every cell.</text>
    <text x="480" y="386" text-anchor="middle" font-size="16" fill="#52606d">The nearby-jitter control reuses U = 62,500 and k = 4.</text>
  </g>
</svg>
