<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">The score matrix grows as the square of the sequence length</title>
  <desc id="desc">Three squares drawn to scale show the attention score matrix for sequences of eight, sixteen, and thirty two tokens. The side length is the token count and the area is the number of stored scores, so doubling the sequence length quadruples the score count.</desc>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Doubling the sequence quadruples the stored scores</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="170" y="294" width="56" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="330" y="238" width="112" height="112" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="560" y="126" width="224" height="224" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="198" y="384" text-anchor="middle" font-size="17" font-weight="700">N = 8</text>
    <text x="198" y="412" text-anchor="middle" font-size="16">64 scores</text>
    <text x="386" y="384" text-anchor="middle" font-size="17" font-weight="700">N = 16</text>
    <text x="386" y="412" text-anchor="middle" font-size="16">256 scores</text>
    <text x="672" y="384" text-anchor="middle" font-size="17" font-weight="700">N = 32</text>
    <text x="672" y="412" text-anchor="middle" font-size="16">1,024 scores</text>
    <text x="480" y="446" text-anchor="middle" font-size="15" fill="#52606d">Each square is one head in one sample. Batch size and head count multiply on top of this.</text>
  </g>
</svg>
