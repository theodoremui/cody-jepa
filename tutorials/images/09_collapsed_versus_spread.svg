<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">A collapsed spectrum compared with a spread spectrum</title>
  <desc id="desc">On the left, one tall bar and three flat bars show variance concentrated in a single direction, giving an effective rank near one. On the right, four bars of equal height show variance shared evenly, giving an effective rank of four.</desc>
  <rect width="960" height="420" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Collapsed spectrum versus spread spectrum</text>

    <rect x="40" y="80" width="420" height="280" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="250" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Collapsed: one direction</text>
    <rect x="90" y="146" width="50" height="160" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
    <rect x="160" y="294" width="50" height="12" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
    <rect x="230" y="299" width="50" height="7" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
    <rect x="300" y="302" width="50" height="4" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
    <line x1="80" y1="306" x2="360" y2="306" stroke="#991b1b" stroke-width="3" stroke-linecap="round"/>
    <text x="250" y="338" text-anchor="middle" font-size="15" fill="#991b1b">effective rank near 1</text>

    <rect x="500" y="80" width="420" height="280" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="710" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Spread: four directions</text>
    <rect x="550" y="186" width="50" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <rect x="620" y="186" width="50" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <rect x="690" y="186" width="50" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <rect x="760" y="186" width="50" height="120" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <line x1="540" y1="306" x2="820" y2="306" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
    <text x="710" y="338" text-anchor="middle" font-size="15" fill="#166534">effective rank 4</text>

    <text x="480" y="394" text-anchor="middle" font-size="15" fill="#52606d">Both spectra have four components. Only the right one uses all four.</text>
  </g>
</svg>
