<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 336" width="750" height="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="749" height="335" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="36" font-size="16.5" font-weight="600" fill="#0f172a">The headline probe is a stopwatch</text>
  <text x="28" y="57" font-size="11" fill="#64748b">Usual versus fast walking, 80 held-out participants, subject-disjoint split</text>

  <!-- scale: 0.5 -> x=250, 1.0 -> x=690 -->
  <line x1="250" y1="86" x2="250" y2="286" stroke="#e2e8f0"/>
  <line x1="470" y1="86" x2="470" y2="286" stroke="#f1f5f9"/>
  <line x1="690" y1="86" x2="690" y2="286" stroke="#f1f5f9"/>
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="250" y="302">0.50</text>
    <text x="470" y="302">0.75</text>
    <text x="690" y="302">1.00</text>
  </g>

  <!-- row 1: handcrafted all -->
  <text x="238" y="106" font-size="11.5" fill="#334155" text-anchor="end">nine handcrafted features</text>
  <rect x="250" y="94" width="421.7" height="17" rx="3" fill="#d97706"/>
  <text x="681" y="107" font-size="11" font-weight="600" fill="#b45309">.958</text>

  <!-- row 2: stopwatch with CI -->
  <text x="238" y="150" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="end">one threshold on walk duration</text>
  <text x="238" y="165" font-size="10" fill="#94a3b8" text-anchor="end">predict fast if under 3.27 s</text>
  <rect x="250" y="138" width="413.7" height="17" rx="3" fill="#d97706"/>
  <line x1="655.6" y1="146.5" x2="681.2" y2="146.5" stroke="#7c2d12" stroke-width="1.6"/>
  <line x1="655.6" y1="141" x2="655.6" y2="152" stroke="#7c2d12" stroke-width="1.6"/>
  <line x1="681.2" y1="141" x2="681.2" y2="152" stroke="#7c2d12" stroke-width="1.6"/>
  <text x="692" y="151" font-size="11" font-weight="600" fill="#b45309">.952</text>

  <!-- row 3: best jepa -->
  <text x="238" y="200" font-size="11.5" fill="#334155" text-anchor="end">best JEPA checkpoint</text>
  <rect x="250" y="188" width="385" height="17" rx="3" fill="#2563eb"/>
  <text x="645" y="201" font-size="11" font-weight="600" fill="#1d4ed8">.938</text>

  <!-- row 4: worst jepa -->
  <text x="238" y="238" font-size="11.5" fill="#334155" text-anchor="end">JEPA with the best representation</text>
  <rect x="250" y="226" width="291" height="17" rx="3" fill="#93c5fd"/>
  <text x="551" y="239" font-size="11" font-weight="600" fill="#1d4ed8">.884</text>

  <!-- row 5: majority -->
  <text x="238" y="276" font-size="11.5" fill="#94a3b8" text-anchor="end">majority class</text>
  <rect x="250" y="264" width="2" height="17" rx="1" fill="#cbd5e1"/>
  <text x="260" y="277" font-size="11" fill="#94a3b8">.500</text>

  <text x="28" y="324" font-size="10.5" fill="#64748b">Bracket shows the subject-clustered 95% interval for the stopwatch. Every learned model sits inside or below it.</text>
</svg>
