<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Assembling a mixed query from two donor recordings</title>
  <desc id="desc">One donor supplies the focal speed block and a second donor supplies the clothing and direction blocks, so the mixed query describes the target cell even though the target contributes nothing.</desc>
  <defs>
    <marker id="a12q" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Two donors build the query, the target builds none of it</text>

    <rect x="40" y="88" width="300" height="140" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="126" text-anchor="middle" font-size="18" font-weight="700">Donor U: cell (1, 1, 1)</text>
    <text x="190" y="162" text-anchor="middle" font-size="16">matches the target on speed</text>
    <text x="190" y="196" text-anchor="middle" font-size="16">gives the speed block</text>

    <rect x="40" y="258" width="300" height="140" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="190" y="296" text-anchor="middle" font-size="18" font-weight="700">Donor V: cell (0, 0, 0)</text>
    <text x="190" y="332" text-anchor="middle" font-size="16">matches clothing and direction</text>
    <text x="190" y="366" text-anchor="middle" font-size="16">gives those two blocks</text>

    <line x1="344" y1="158" x2="392" y2="176" stroke="#52606d" stroke-width="3" marker-end="url(#a12q)"/>
    <line x1="344" y1="328" x2="392" y2="304" stroke="#52606d" stroke-width="3" marker-end="url(#a12q)"/>

    <rect x="400" y="110" width="250" height="270" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="525" y="150" text-anchor="middle" font-size="18" font-weight="700">Mixed query</text>
    <text x="525" y="196" text-anchor="middle" font-size="16">speed block from U</text>
    <text x="525" y="238" text-anchor="middle" font-size="16">clothing block from V</text>
    <text x="525" y="280" text-anchor="middle" font-size="16">direction block from V</text>
    <text x="525" y="340" text-anchor="middle" font-size="16">focal factor: speed</text>

    <line x1="654" y1="245" x2="696" y2="245" stroke="#52606d" stroke-width="3" stroke-dasharray="7 6"/>

    <rect x="700" y="145" width="225" height="200" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="812" y="187" text-anchor="middle" font-size="18" font-weight="700">Target (1, 0, 0)</text>
    <text x="812" y="233" text-anchor="middle" font-size="16">supplies no block</text>
    <text x="812" y="271" text-anchor="middle" font-size="16">to the query</text>
    <text x="812" y="315" text-anchor="middle" font-size="16">stays in the gallery</text>

    <text x="480" y="437" text-anchor="middle" font-size="16" fill="#52606d">Solid arrows carry blocks into the query. The dashed line marks the one recording that contributes nothing.</text>
  </g>
</svg>
