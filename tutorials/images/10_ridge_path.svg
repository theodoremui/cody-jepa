<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">The ridge solution path as the penalty grows</title>
  <desc id="desc">Three coefficient curves start at their least-squares values on the left and all bend toward the zero line as the regularization strength increases from zero to one hundred. The intercept is not part of the path because it is never penalized.</desc>
  <rect width="960" height="430" rx="18" fill="#fbfaf7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#172b4d">Ridge pulls every coefficient toward zero</text>

    <text x="108" y="74" font-size="15" fill="#52606d">coefficient value</text>
    <g stroke="#52606d" stroke-width="3" stroke-linecap="round">
      <line x1="130" y1="90" x2="130" y2="340"/>
      <line x1="130" y1="340" x2="700" y2="340"/>
    </g>
    <line x1="130" y1="250" x2="700" y2="250" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="120" y="255" text-anchor="end" font-size="15" fill="#52606d">zero</text>

    <polyline points="130,110 267,140 405,190 542,228 700,246" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="130,175 267,192 405,216 542,238 700,247" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="130,330 267,308 405,282 542,262 700,254" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>

    <text x="120" y="115" text-anchor="end" font-size="16" font-weight="700" fill="#2563eb">w1</text>
    <text x="120" y="180" text-anchor="end" font-size="16" font-weight="700" fill="#16a34a">w2</text>
    <text x="120" y="335" text-anchor="end" font-size="16" font-weight="700" fill="#7c3aed">w3</text>

    <text x="130" y="364" text-anchor="middle" font-size="15" fill="#52606d">0</text>
    <text x="267" y="364" text-anchor="middle" font-size="15" fill="#52606d">0.1</text>
    <text x="405" y="364" text-anchor="middle" font-size="15" fill="#52606d">1</text>
    <text x="542" y="364" text-anchor="middle" font-size="15" fill="#52606d">10</text>
    <text x="700" y="364" text-anchor="middle" font-size="15" fill="#52606d">100</text>
    <text x="415" y="396" text-anchor="middle" font-size="15" fill="#52606d">regularization strength alpha</text>

    <rect x="720" y="130" width="212" height="158" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="742" y="166" font-size="17" font-weight="700" fill="#172b4d">Solution path</text>
    <text x="742" y="200" font-size="15" fill="#52606d">alpha 0: least squares</text>
    <text x="742" y="226" font-size="15" fill="#52606d">large alpha: near zero</text>
    <text x="742" y="252" font-size="15" fill="#52606d">intercept not penalized</text>
  </g>
</svg>
