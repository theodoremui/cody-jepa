<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical observations and group-balanced sampling</title>
  <desc id="desc">A population contains groups with repeated observations, and unit-aware analysis accounts for groups rather than treating every row as independent.</desc>
  <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker></defs>
  <rect width="960" height="420" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Hierarchical observations and sampling</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="55" y="90" width="265" height="240" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="187" y="125" text-anchor="middle" font-size="19" font-weight="700">Population</text>
    <circle cx="120" cy="185" r="42" fill="#93c5fd"/><circle cx="245" cy="175" r="30" fill="#86efac"/><circle cx="210" cy="265" r="48" fill="#fde68a"/>
    <text x="120" y="191" text-anchor="middle" font-size="16">group A</text><text x="245" y="181" text-anchor="middle" font-size="16">B</text><text x="210" y="271" text-anchor="middle" font-size="16">group C</text>
    <path d="M325 210 H410" stroke="#52606d" stroke-width="3" marker-end="url(#a3)"/>
    <rect x="420" y="90" width="205" height="240" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="522" y="125" text-anchor="middle" font-size="19" font-weight="700">Naive independence</text>
    <text x="522" y="170" text-anchor="middle" font-size="17">dependent repeats</text>
    <text x="522" y="208" text-anchor="middle" font-size="17">are treated as</text>
    <text x="522" y="236" text-anchor="middle" font-size="17">new evidence</text>
    <text x="522" y="285" text-anchor="middle" font-size="16" fill="#991b1b">pseudoreplication</text>
    <path d="M630 210 H715" stroke="#52606d" stroke-width="3" marker-end="url(#a3)"/>
    <rect x="725" y="90" width="180" height="240" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="815" y="125" text-anchor="middle" font-size="19" font-weight="700">Unit-aware</text>
    <text x="815" y="170" text-anchor="middle" font-size="17">model dependence</text>
    <text x="815" y="200" text-anchor="middle" font-size="17">across levels</text>
    <text x="815" y="245" text-anchor="middle" font-size="17">or summarize</text>
    <text x="815" y="275" text-anchor="middle" font-size="17">within groups</text>
    <text x="480" y="380" text-anchor="middle" font-size="17">Dependence means row count alone does not measure independent information.</text>
  </g>
</svg>
