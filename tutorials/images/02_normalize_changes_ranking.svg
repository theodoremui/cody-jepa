<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Normalizing before a dot product changes the ranking</title>
  <desc id="desc">For the query two comma zero, the raw dot product ranks the long vector b far above a and c, while cosine similarity ties a and b at one and places c last.</desc>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Normalizing changes what the score measures</text>
  <text x="480" y="74" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#52606d">query q = (2, 0)</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="60" y="96" width="390" height="250" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="255" y="134" text-anchor="middle" font-size="18" font-weight="700">Raw dot product</text>
    <g font-size="16">
      <text x="100" y="186">a = (1, 0)</text><text x="410" y="186" text-anchor="end">2</text>
      <text x="100" y="231">b = (10, 0)</text><text x="410" y="231" text-anchor="end">20</text>
      <text x="100" y="276">c = (1, 1)</text><text x="410" y="276" text-anchor="end">2</text>
    </g>
    <text x="255" y="322" text-anchor="middle" font-size="15">the longest vector wins</text>

    <rect x="510" y="96" width="390" height="250" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="705" y="134" text-anchor="middle" font-size="18" font-weight="700">Cosine after normalizing</text>
    <g font-size="16">
      <text x="550" y="186">a = (1, 0)</text><text x="860" y="186" text-anchor="end">1.00</text>
      <text x="550" y="231">b = (10, 0)</text><text x="860" y="231" text-anchor="end">1.00</text>
      <text x="550" y="276">c = (1, 1)</text><text x="860" y="276" text-anchor="end">0.71</text>
    </g>
    <text x="705" y="322" text-anchor="middle" font-size="15">only direction survives</text>

    <rect x="150" y="372" width="660" height="60" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="480" y="408" text-anchor="middle" font-size="17">b leads on raw score, yet a and b tie once length divides out</text>
  </g>
</svg>
