<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="pmAmberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="749" height="419" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="28" y="36" font-size="16.5" font-weight="600" fill="#0f172a">A mechanism that can be manipulated</text>
  <text x="28" y="57" font-size="11" fill="#64748b">Target-position conditioning predicts where masked predictive models spend their variance</text>

  <rect x="28" y="82" width="694" height="230" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="44" y="105" font-size="11.5" font-weight="600" fill="#2563eb">masked predictive path</text>

  <rect x="44" y="128" width="126" height="54" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="107" y="151" font-size="11" fill="#334155" text-anchor="middle">context</text>
  <text x="107" y="167" font-size="11" fill="#334155" text-anchor="middle">tokens</text>

  <line x1="170" y1="155" x2="224" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pmArrow)"/>

  <rect x="228" y="128" width="142" height="54" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="299" y="151" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">predictor</text>
  <text x="299" y="167" font-size="10.5" fill="#334155" text-anchor="middle">target-conditioned</text>

  <line x1="370" y1="155" x2="424" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pmArrow)"/>

  <rect x="428" y="128" width="132" height="54" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="494" y="151" font-size="11" fill="#334155" text-anchor="middle">target</text>
  <text x="494" y="167" font-size="11" fill="#334155" text-anchor="middle">prediction</text>

  <rect x="584" y="116" width="120" height="78" rx="7" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="644" y="138" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="middle">target position</text>
  <text x="644" y="156" font-size="10" fill="#334155" text-anchor="middle">absolute</text>
  <text x="644" y="170" font-size="10" fill="#334155" text-anchor="middle">relative</text>
  <text x="644" y="184" font-size="10" fill="#334155" text-anchor="middle">none</text>
  <path d="M 644 116 L 644 108 L 299 108 L 299 124" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#pmArrow)"/>

  <text x="44" y="217" font-size="10.5" fill="#64748b">remove or permute target position at evaluation to measure Δ<tspan baseline-shift="sub" font-size="8">pos</tspan></text>

  <rect x="44" y="236" width="126" height="48" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="107" y="258" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">Δ<tspan baseline-shift="sub" font-size="8">pos</tspan> increases</text>
  <text x="107" y="274" font-size="9.5" fill="#64748b" text-anchor="middle">position reliance</text>

  <line x1="170" y1="260" x2="220" y2="260" stroke="#d97706" stroke-width="1.6" marker-end="url(#pmAmberArrow)"/>

  <rect x="224" y="236" width="144" height="48" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="296" y="258" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">tr(Σ<tspan baseline-shift="sub" font-size="8">within</tspan>) increases</text>
  <text x="296" y="274" font-size="9.5" fill="#64748b" text-anchor="middle">position-specific variance</text>

  <line x1="368" y1="260" x2="418" y2="260" stroke="#d97706" stroke-width="1.6" marker-end="url(#pmAmberArrow)"/>

  <rect x="422" y="236" width="112" height="48" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="478" y="258" font-size="12" font-weight="600" fill="#dc2626" text-anchor="middle">β decreases</text>
  <text x="478" y="274" font-size="9.5" fill="#64748b" text-anchor="middle">less survives pooling</text>

  <line x1="534" y1="260" x2="584" y2="260" stroke="#d97706" stroke-width="1.6" marker-end="url(#pmAmberArrow)"/>

  <rect x="588" y="236" width="116" height="48" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="646" y="258" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">pooled transfer</text>
  <text x="646" y="274" font-size="9.5" fill="#64748b" text-anchor="middle">loses the variance</text>

  <rect x="28" y="330" width="694" height="66" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="44" y="354" font-size="11.5" font-weight="600" fill="#059669">contrastive and siamese controls</text>
  <text x="44" y="375" font-size="10.5" fill="#334155">Same data, encoder, width, pooling, and budget. No target-position-conditioned predictor.</text>
  <rect x="574" y="345" width="130" height="36" rx="7" fill="#ffffff" stroke="#86efac"/>
  <text x="639" y="368" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">predict β is higher</text>
</svg>
