<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Identity geometry means tight, separated clusters</title>
  <desc id="desc">On the left each identity forms its own compact cluster, while on the right every identity collapses into one region so distances carry no identity information.</desc>
  <rect width="960" height="440" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Identity geometry is a cluster structure</text>

    <rect x="50" y="80" width="400" height="280" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="250" y="118" text-anchor="middle" font-size="18" font-weight="700">Informative</text>
    <ellipse cx="140" cy="212" rx="55" ry="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <g fill="#2563eb"><circle cx="115" cy="196" r="6"/><circle cx="160" cy="192" r="6"/><circle cx="122" cy="235" r="6"/><circle cx="164" cy="234" r="6"/></g>
    <text x="140" y="218" text-anchor="middle" font-size="17" font-weight="700">A</text>
    <ellipse cx="340" cy="185" rx="55" ry="45" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <g fill="#d97706"><circle cx="315" cy="169" r="6"/><circle cx="360" cy="165" r="6"/><circle cx="322" cy="208" r="6"/><circle cx="364" cy="207" r="6"/></g>
    <text x="340" y="191" text-anchor="middle" font-size="17" font-weight="700">B</text>
    <ellipse cx="245" cy="303" rx="55" ry="45" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <g fill="#16a34a"><circle cx="220" cy="287" r="6"/><circle cx="265" cy="283" r="6"/><circle cx="227" cy="326" r="6"/><circle cx="269" cy="325" r="6"/></g>
    <text x="245" y="309" text-anchor="middle" font-size="17" font-weight="700">C</text>

    <rect x="510" y="80" width="400" height="280" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="710" y="118" text-anchor="middle" font-size="18" font-weight="700">Collapsed</text>
    <ellipse cx="710" cy="240" rx="70" ry="58" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <g fill="#dc2626"><circle cx="676" cy="252" r="6"/><circle cx="700" cy="215" r="6"/><circle cx="736" cy="258" r="6"/><circle cx="748" cy="238" r="6"/><circle cx="690" cy="272" r="6"/><circle cx="722" cy="200" r="6"/></g>
    <text x="668" y="238" text-anchor="middle" font-size="17" font-weight="700">A</text>
    <text x="704" y="262" text-anchor="middle" font-size="17" font-weight="700">B</text>
    <text x="742" y="216" text-anchor="middle" font-size="17" font-weight="700">C</text>

    <text x="250" y="396" text-anchor="middle" font-size="16">distances tell identities apart</text>
    <text x="710" y="396" text-anchor="middle" font-size="16">every distance is near zero</text>
  </g>
</svg>
