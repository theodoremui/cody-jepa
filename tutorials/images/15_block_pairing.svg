<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">The paired block is the trained-model sampling unit</title>
  <desc id="desc">A ladder from the whole study down to one paired block, then to the three allocation cells inside that block, then to the participants and queries evaluated inside a single trained model.</desc>
  <defs>
    <marker id="a15b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="480" fill="#fbfaf7"/>
  <g font-family="sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Nested units from the study down to one trained model</text>

    <rect x="180" y="80" width="600" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="480" y="116" text-anchor="middle" font-size="18" font-weight="700">Study: eight paired blocks</text>
    <path d="M480 142 V166" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>

    <rect x="180" y="172" width="600" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="480" y="200" text-anchor="middle" font-size="18" font-weight="700">One block</text>
    <text x="480" y="224" text-anchor="middle" font-size="15">shared pool ordering, seeds, masks, and transforms</text>
    <path d="M270 242 V266" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>
    <path d="M480 242 V266" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>
    <path d="M690 242 V266" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>

    <rect x="180" y="272" width="180" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="270" y="302" text-anchor="middle" font-size="17" font-weight="700">breadth</text>
    <text x="270" y="326" text-anchor="middle" font-size="15">1 model</text>
    <rect x="390" y="272" width="180" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="480" y="302" text-anchor="middle" font-size="17" font-weight="700">balanced</text>
    <text x="480" y="326" text-anchor="middle" font-size="15">1 model</text>
    <rect x="600" y="272" width="180" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="690" y="302" text-anchor="middle" font-size="17" font-weight="700">phase depth</text>
    <text x="690" y="326" text-anchor="middle" font-size="15">1 model</text>

    <path d="M270 346 V370" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>
    <path d="M480 346 V370" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>
    <path d="M690 346 V370" stroke="#52606d" stroke-width="3" marker-end="url(#a15b)"/>

    <rect x="180" y="376" width="600" height="66" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="404" text-anchor="middle" font-size="17" font-weight="700">Inside one model: participants, then queries</text>
    <text x="480" y="428" text-anchor="middle" font-size="15">these sharpen a cell mean, they do not add blocks</text>
  </g>
</svg>
