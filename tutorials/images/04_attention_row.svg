<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">One query creates one row of attention weights</title>
  <desc id="desc">A query compares with four keys to make scores, softmax converts scores into weights, and the weights mix four value vectors.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" fill="#fbfaf7"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Follow one query before thinking about the whole matrix</text>
  <g font-family="sans-serif" fill="#172b4d">
    <rect x="45" y="150" width="130" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110" y="190" text-anchor="middle" font-size="19" font-weight="700">Query q₂</text><text x="110" y="225" text-anchor="middle" font-size="16">what I seek</text>
    <path d="M180 205 H235" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="243" y="105" width="190" height="200" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="338" y="140" text-anchor="middle" font-size="19" font-weight="700">Scaled scores</text><text x="338" y="177" text-anchor="middle" font-size="16">s(2,1) = 0.2</text><text x="338" y="207" text-anchor="middle" font-size="16">s(2,2) = 1.5</text><text x="338" y="237" text-anchor="middle" font-size="16">s(2,3) = 0.0</text><text x="338" y="267" text-anchor="middle" font-size="16">s(2,4) = 0.7</text>
    <path d="M438 205 H493" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="501" y="105" width="190" height="200" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="596" y="140" text-anchor="middle" font-size="19" font-weight="700">Softmax weights</text><text x="596" y="177" text-anchor="middle" font-size="16">0.140 on v₁</text><text x="596" y="207" text-anchor="middle" font-size="16">0.514 on v₂</text><text x="596" y="237" text-anchor="middle" font-size="16">0.115 on v₃</text><text x="596" y="267" text-anchor="middle" font-size="16">0.231 on v₄</text>
    <path d="M696 205 H751" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="759" y="150" width="155" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="836" y="190" text-anchor="middle" font-size="19" font-weight="700">Output y₂</text><text x="836" y="225" text-anchor="middle" font-size="16">weighted values</text>
    <rect x="195" y="350" width="570" height="45" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="480" y="379" text-anchor="middle" font-size="17">Every query repeats this process and produces one output token.</text>
  </g>
</svg>
