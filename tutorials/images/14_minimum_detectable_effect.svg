<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Interval half-width sets the smallest effect a design can resolve</title>
  <desc id="desc">A wide interval reaches past the materiality margin and can never be called resolved, while a narrow interval fits inside the margin and can be.</desc>
  <rect width="960" height="460" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#172b4d">
    <text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Half-width decides what you could ever resolve</text>

    <rect x="50" y="80" width="860" height="310" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="350" y="150" width="260" height="188" fill="#dcfce7"/>
    <line x1="350" y1="150" x2="350" y2="338" stroke="#16a34a" stroke-width="3"/>
    <line x1="610" y1="150" x2="610" y2="338" stroke="#16a34a" stroke-width="3"/>
    <line x1="480" y1="150" x2="480" y2="338" stroke="#dc2626" stroke-width="3"/>
    <line x1="110" y1="250" x2="850" y2="250" stroke="#52606d" stroke-width="3"/>

    <text x="480" y="130" text-anchor="middle" font-size="16">half-width 0.09, never resolvable</text>
    <line x1="300" y1="200" x2="660" y2="200" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="200" r="8" fill="#d97706"/><circle cx="660" cy="200" r="8" fill="#d97706"/>

    <text x="342" y="278" text-anchor="end" font-size="16">-0.0625</text>
    <text x="497" y="278" font-size="16">0</text>
    <text x="618" y="278" font-size="16">+0.0625</text>

    <line x1="430" y1="305" x2="530" y2="305" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <circle cx="430" cy="305" r="8" fill="#2563eb"/><circle cx="530" cy="305" r="8" fill="#2563eb"/>
    <text x="480" y="366" text-anchor="middle" font-size="16">half-width 0.025, resolvable</text>

    <text x="480" y="428" text-anchor="middle" font-size="16" fill="#52606d">Draw this from planning numbers, before any outcome has been computed.</text>
  </g>
</svg>
